# SPDX-License-Identifier: Apache-2.0
# Dependabot scope (SL-75, P1). Only product manifests under sangam/ and the workflow actions are in scope.
# SL-75 P2 (2026-11-15): handoff/ left main for the tag archive/handoff-2026-11-15 (ARCHIVE.md), so no path is excluded.
# open-pull-requests-limit 0 keeps today's behaviour: no version-update pull requests, security updates only.
# Decision 192 (C-29, owner 2026-11-13): github-actions and docker get version-update pull requests (SHA and digest pins
# must not go stale); Maven, npm, NuGet, pip and Composer stay at 0 until after 0.1.0 (frozen graphs, decision 111).
version: 2
updates:
  - package-ecosystem: maven
    directory: /sangam
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directories: [/sangam/sangam-ui, /sangam/sdks/typescript]
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  # SDKs (B5 test projects included): .NET solution, Python pyproject, PHP composer
  - package-ecosystem: nuget
    directory: /sangam/sdks/dotnet
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /sangam/sdks/python
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: composer
    directory: /sangam/sdks/php
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  # Product image definitions: the Dockerfiles under deploy/docker and the operator Dockerfile.
  - package-ecosystem: docker
    directories: [/sangam/deploy/docker, /sangam/deploy/operator]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
