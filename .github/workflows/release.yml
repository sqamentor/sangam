# SPDX-License-Identifier: Apache-2.0
# Release (tag vX.Y.Z) and release dry run (workflow_dispatch: nothing is pushed or published).
#
# M-019, M-147, M-148, CR-01..CR-22, decisions 116-118, 122, 123, 127-130, 133. Every check writes a results-ledger
# line (results_ledger.py); the release-gate job requires every line of release-checks.json "release" to be PASS.
# FAIL, SKIPPED, BLOCKED, NOT-RUN (report-only) or a missing line stops the release (RM-12: a skipped check is never
# a pass). Nothing is tagged, attested or published before that gate:
#   build      versioned jars; one CycloneDX SBOM per distribution (makeBom per module, CR-03), matched against the
#              artefact it describes; licence gate (strict, distribution scope), decision register and notices bundle
#              per distribution (distributions.json); SDK package SBOMs; UI build, bpmn.io watermark
#   images     every image of distributions.json, built amd64 and scanned locally (dry run) or pushed by digest only,
#              untagged (tag): syft SBOM, licence gate with the OS-package rule (decision 118), register, notices,
#              grype (critical with a fix fails, decision 133); the air-gap image list licence gate (RM-13)
#   chart      helm lint and template of every example, backup-image guard (decision 129), chart package
#   db-matrix, security, governance  reusable workflows in release mode (their ledger lines gate here)
#   release-gate   reads every ledger line; then publish-images tags the scanned digests, evidence checks and writes
#              the standards profile (M-052) and signs the pack, publish writes the THIRD-PARTY-LICENSES book from the
#              notices bundles (M-088, licence_book.py), the air-gap bundle and the GitHub release. Registry packages
#              (Maven Central, npm, PyPI, NuGet, Packagist) are never published here: publish-packages.yml, owner-gated.
# Tools are pinned: actions by commit SHA (CR-10), syft and grype by SHA-256 after the vendor cosign signature of
# their checksum file is verified (fetch_tool.py, CR-11, decision 179), the npm SBOM generator from
# deploy/licence/tools/package-lock.json (CR-12), npm install scripts off (decision 130), versions-maven-plugin by its
# full coordinate 2.25.1 (decision 185).
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (dry run: images are built and scanned, nothing is pushed)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  MAVEN_ARGS: -B -ntp
  TZ: UTC
  LEDGER: ${{ github.workspace }}/results
  RL: python3 -I ${{ github.workspace }}/sangam/deploy/licence/results_ledger.py
  RD: python3 -I ${{ github.workspace }}/sangam/deploy/licence/release_dist.py
  FETCH: python3 -I ${{ github.workspace }}/sangam/deploy/licence/fetch_tool.py
  CL: python3 -I deploy/licence/check_licences.py --policy deploy/licence/licence-policy.json
  CYCLONEDX: org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      push: ${{ steps.v.outputs.push }}
    steps:
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then v="${GITHUB_REF_NAME#v}"; push=true; else v="$INPUT_VERSION"; push=false; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad version $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "push=$push" >> "$GITHUB_OUTPUT"

  db-matrix:
    needs: meta
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/db-matrix.yml
    with:
      dbs: postgres,oracle,sqlserver,mysql

  security:
    needs: meta
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write   # dependency-check reads the NVD API key from SSM through OIDC (role sangam-ci)
    uses: ./.github/workflows/security.yml
    with:
      mode: release

  governance:
    needs: meta
    permissions:
      contents: read
    uses: ./.github/workflows/governance.yml
    with:
      mode: release

  build:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      hashes: ${{ steps.subjects.outputs.hashes }}
    env:
      V: ${{ needs.meta.outputs.version }}
      D: ${{ github.workspace }}/dist
    defaults:
      run:
        working-directory: sangam
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: "25.0.1", cache: maven, cache-dependency-path: "sangam/**/pom.xml" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22.18.0" }
      - name: Set version (versions-maven-plugin 2.25.1, Apache-2.0, decision 185)
        # Full coordinate: the version is fixed here, never chosen by the run (the root pom pin is an integrator REQUEST).
        run: mvn $MAVEN_ARGS -q org.codehaus.mojo:versions-maven-plugin:2.25.1:set -DnewVersion="$V" -DprocessAllModules=true -DgenerateBackupPoms=false
      - name: Build and unit tests
        # simulators-app builds the simulators fat jar (distributions.json "simulators"); while the profile does not
        # exist Maven only warns, the jar is missing and sbom-match-simulators records BLOCKED.
        run: $RL run --check build-unit-tests --ledger-dir "$LEDGER" -- mvn $MAVEN_ARGS -Dsangam.db=h2 -DskipITs -Psimulators-app verify
      - name: Unit test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-unit-test-reports
          path: sangam/**/target/surefire-reports/
          if-no-files-found: warn
      - name: PDF validator runtime class path (distributions.json "pdf-validator", lib-dir)
        if: ${{ !cancelled() }}
        run: mvn $MAVEN_ARGS -q -DskipTests -pl sangam-pdf-validator -am package dependency:copy-dependencies -DincludeScope=runtime
      - name: eSign add-on runtime class path (distributions.json "esign", lib-dir, decision 217)
        if: ${{ !cancelled() }}
        run: mvn $MAVEN_ARGS -q -DskipTests -pl sangam-esign -am package dependency:copy-dependencies -DincludeScope=runtime
      - name: NATS add-on jars (distributions.json "nats", lib-dir, decision 232)
        if: ${{ !cancelled() }}
        # Exactly jnats and bcprov-lts8on as the reactor resolves them for sangam-integration (jnats optional there).
        run: |
          mvn $MAVEN_ARGS -q -DskipTests -pl sangam-integration -am package dependency:copy-dependencies \
            -DincludeScope=runtime -DincludeArtifactIds=jnats,bcprov-lts8on -DoutputDirectory="$GITHUB_WORKSPACE/nats-deps"
      - name: CycloneDX SBOM per module (shipped scopes, CR-03)
        if: ${{ !cancelled() }}
        # cyclonedx-maven-plugin is pinned by its coordinate; moving the pin into the root pom pluginManagement is a
        # REQUEST to the integrator (CR-12).
        run: |
          mvn $MAVEN_ARGS -DskipTests $CYCLONEDX -DoutputFormat=json -DoutputName=sangam-dist.cdx -DschemaVersion=1.6 \
            -DincludeTestScope=false -DincludeProvidedScope=false -DincludeSystemScope=false
      - name: Forbidden coordinates anywhere in the shipped dependency tree (CR-02)
        if: ${{ !cancelled() }}
        run: |
          $RL run --check forbidden-coordinates --ledger-dir "$LEDGER" -- bash -c '
            set -euo pipefail
            mvn -B -ntp -q dependency:tree -Dscope=runtime -DoutputFile=target/deps.txt -DappendOutput=true
            files=$(find . -name deps.txt -path "*/target/*")
            [ -n "$files" ] || { echo "::error::no dependency tree written"; exit 2; }
            if cat $files | grep -E -i "com\.oracle\.database|com\.ibm\.db2|mysql-connector|org\.graalvm\.(polyglot|js)|nashorn|jython|jruby"; then
              echo "::error::forbidden dependency in runtime scope (SANGAM.md X.3a)"; exit 1
            fi
            # Rhino is allowed only in the pdf-validator distribution (decision 119, licence-policy.json allowed_in)
            for f in $files; do
              case "$f" in ./sangam-pdf-validator/*) continue ;; esac
              if grep -qi "org\.mozilla:rhino" "$f"; then echo "::error::org.mozilla:rhino outside sangam-pdf-validator: $f"; exit 1; fi
            done'
      - name: Build and test scope review (CR-17, decisions 123 and 127)
        if: ${{ !cancelled() }}
        run: |
          mvn $MAVEN_ARGS -DskipTests $CYCLONEDX -DoutputFormat=json -DoutputName=sangam-build-scope.cdx -DschemaVersion=1.6 \
            -DincludeTestScope=true -DincludeProvidedScope=true -DincludeSystemScope=true
          $RL run --check build-scope-review --ledger-dir "$LEDGER" --expect-glob '**/target/sangam-build-scope.cdx.json=1' -- \
            bash -c 'args=(); for s in $(find . -name sangam-build-scope.cdx.json -path "*/target/*"); do args+=(--sbom "$s"); done; '"$CL"' --build-scope "${args[@]}"'
      # No rebuild step after npm ci (M-117): Vite 8 builds with rolldown, whose native binary comes as a prebuilt
      # optional package (@rolldown/binding-*, like lightningcss-*) with no install script. esbuild, the one package
      # that used to be rebuilt here by name, is no longer in package-lock.json.
      - name: UI build (install scripts off, decision 130)
        if: ${{ !cancelled() }}
        working-directory: sangam/sangam-ui
        run: |
          $RL run --check ui-build --ledger-dir "$LEDGER" --expect package.json --expect package-lock.json -- bash -c '
            set -euo pipefail
            npm ci --ignore-scripts --no-audit --no-fund
            npm version --no-git-tag-version --allow-same-version "$V"
            npm run build
            test -f dist/index.html'
      - name: bpmn.io watermark kept in the UI bundle (LIC-8)
        if: ${{ !cancelled() }}
        working-directory: sangam/sangam-ui
        run: $RL run --check bpmn-watermark --ledger-dir "$LEDGER" --expect node_modules/bpmn-js/package.json --expect dist/index.html -- grep -rqs "bpmn.io" dist/
      - name: SBOM generator from the tools lockfile (CR-12)
        if: ${{ !cancelled() }}
        working-directory: sangam/deploy/licence/tools
        run: $RL run --check sbom-tools --ledger-dir "$LEDGER" --expect package-lock.json -- npm ci --ignore-scripts --no-audit --no-fund
      - name: Stage release artefacts
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p "$D/lib-ext" "$D/sbom" "$D/licence" "$D/notices" "$D/pdf-validator/lib" "$D/esign/lib" "$D/nats/lib"
          # A distribution whose artefact was not built is reported here and BLOCKED by its checks below.
          stage() {
            local src=""
            if [ -d "$1" ]; then
              src=$(find "$1" -maxdepth 1 -name "$2" ! -name '*-plain.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)
            fi
            if [ -n "$src" ]; then cp "$src" "$3"; else echo "::warning::not built: $1/$2"; fi
          }
          for m in sangam-server sangam-control-plane sangam-gateway sangam-rollup; do stage "$m/target" "$m-$V.jar" "$D/$m-$V.jar"; done
          stage sangam-integration/target '*-simulators.jar' "$D/$($RD field simulators jar --version "$V")"
          stage sdks/java/target "sangam-sdk-java-$V.jar" "$D/$($RD field sdk-java jar --version "$V")"
          stage deploy/operator/target sangam-operator.jar "$D/$($RD field operator jar --version "$V")"
          stage sangam-pdf-validator/target "sangam-pdf-validator-$V.jar" "$D/pdf-validator/sangam-pdf-validator-$V.jar"
          if [ -d sangam-pdf-validator/target/dependency ]; then cp sangam-pdf-validator/target/dependency/*.jar "$D/pdf-validator/lib/"; fi
          # eSign add-on (decision 217): the esign jar outside lib/, and in lib/ only the runtime jars the server fat jar
          # does not ship (the same script as server.Dockerfile WITH_ESIGN=true); not built = BLOCKED by its checks below
          stage sangam-esign/target "sangam-esign-$V.jar" "$D/esign/sangam-esign-$V.jar"
          if [ -f "$D/esign/sangam-esign-$V.jar" ] && [ -f "$D/sangam-server-$V.jar" ] && [ -d sangam-esign/target/dependency ]; then
            sh deploy/docker/server/esign-addon.sh "$D/sangam-server-$V.jar" sangam-esign/target/dependency "$D/esign/sangam-esign-$V.jar" "$D/esign/lib"
            mv "$D/esign/lib/sangam-esign-$V.jar" "$D/esign/lib/ESIGN-ADDON.txt" "$D/esign/"
          fi
          # NATS add-on (decision 232): jnats and bcprov-lts8on in lib/ (the same script as server.Dockerfile
          # WITH_NATS=true). The script refuses while the server fat jar still ships jnats or Bouncy Castle; lib/ then
          # stays empty and sbom-match-nats FAILS below (the staging of the other distributions goes on).
          if [ -f "$D/sangam-server-$V.jar" ] && [ -d "$GITHUB_WORKSPACE/nats-deps" ]; then
            if sh deploy/docker/server/nats-addon.sh "$D/sangam-server-$V.jar" "$GITHUB_WORKSPACE/nats-deps" "$D/nats/lib"; then
              mv "$D/nats/lib/NATS-ADDON.txt" "$D/nats/"
            else
              echo "::error title=nats add-on::nats-addon.sh refused (see the log); distribution nats is not staged"
            fi
          fi
          mariadb=$(mvn -q -DforceStdout help:evaluate -Dexpression=version.mariadb -N)
          mvn $MAVEN_ARGS -q dependency:copy -Dartifact=org.mariadb.jdbc:mariadb-java-client:$mariadb -DoutputDirectory="$D/lib-ext"
          mvn $MAVEN_ARGS -q dependency:copy -Dartifact=org.mariadb.jdbc:mariadb-java-client:$mariadb:jar:sources -DoutputDirectory="$D/lib-ext"
          cp "$($RD field lib-ext source_offer)" "$D/lib-ext/"
          cp deploy/licence/OS-PACKAGES-SOURCE-OFFER.txt "$D/"
      - name: Per-distribution gates (SBOM matches artefact, licence strict, register, notices)
        if: ${{ !cancelled() }}
        run: |
          rc=0
          # id:module:kind (distributions.json). fat-jar and lib-dir/lib-ext: the published SBOM is the module SBOM
          # matched against the shipped jars (sbom_matches_jar.py --out); jar: the module SBOM as built.
          for row in server:sangam-server:fat-jar control-plane:sangam-control-plane:fat-jar gateway:sangam-gateway:fat-jar \
                     rollup:sangam-rollup:fat-jar simulators:sangam-integration:fat-jar sdk-java:sdks/java:jar \
                     operator:deploy/operator:jar pdf-validator:sangam-pdf-validator:lib-dir esign:sangam-esign:lib-dir nats:sangam-integration:lib-dir lib-ext:sangam-server:lib-ext; do
            IFS=: read -r id mod kind <<<"$row"
            in="$mod/target/sangam-dist.cdx.json"
            sbom="$D/sbom/$($RD field "$id" sbom --version "$V")"
            src=(); lic=()
            case "$kind" in
              fat-jar) art="$D/$($RD field "$id" jar --version "$V")"; src=(--jar "$art"); lic=(--jar "$art") ;;
              lib-dir) art="$D/$id/lib"; src=(--dir "$art") ;;
              lib-ext) art="$D/lib-ext"; src=(--dir "$art") ;;
              jar)     art="$D/$($RD field "$id" jar --version "$V")" ;;
            esac
            if [ "$kind" = jar ]; then
              $RL run --check "sbom-$id" --ledger-dir "$LEDGER" --expect "$in" --expect "$art" -- cp "$in" "$sbom" || rc=1
            else
              $RL run --check "sbom-match-$id" --ledger-dir "$LEDGER" --expect "$in" --expect "$art" -- \
                python3 -I deploy/licence/sbom_matches_jar.py "$in" --distribution "$id" "${src[@]}" --out "$sbom" || rc=1
            fi
            $RL run --check "licence-$id" --ledger-dir "$LEDGER" --expect "$sbom" -- \
              $CL --strict --distribution "$id" --sbom "$sbom" --report "$D/licence/licence-report-$id.md" "${lic[@]}" || rc=1
            $RL run --check "register-$id" --ledger-dir "$LEDGER" --expect "$sbom" -- \
              python3 -I deploy/licence/register_check.py "$sbom" --distribution "$id" || rc=1
            if [ "$($RD field "$id" notices)" = True ]; then
              out="$D/notices/$id"; mkdir -p "$out"
              if [ "$kind" = lib-ext ]; then cp "$($RD field lib-ext source_offer)" "$out/"; fi
              $RL run --check "notices-$id" --ledger-dir "$LEDGER" --expect "$sbom" -- \
                python3 -I deploy/licence/notice_bundle.py "$sbom" --distribution "$id" --root .. --out "$out" "${src[@]}" || rc=1
            fi
          done
          exit $rc
      - name: SDK package SBOMs and licence gate (zero runtime dependencies, package_sbom.py)
        if: ${{ !cancelled() }}
        run: |
          rc=0
          for row in npm:npm-sdk:sdks/typescript/package.json pypi:pypi-sdk:sdks/python/pyproject.toml \
                     nuget:nuget-sdk:sdks/dotnet/src/Sangam.Sdk/Sangam.Sdk.csproj packagist:packagist-sdk:sdks/php/composer.json; do
            IFS=: read -r eco id manifest <<<"$row"
            sbom="$D/sbom/$($RD field "$id" sbom --version "$V")"
            $RL run --check "sbom-$id" --ledger-dir "$LEDGER" --expect "$manifest" -- \
              python3 -I deploy/licence/package_sbom.py --ecosystem "$eco" --manifest "$manifest" --version "$V" --out "$sbom" || rc=1
            $RL run --check "licence-$id" --ledger-dir "$LEDGER" --expect "$sbom" -- \
              $CL --strict --distribution "$id" --sbom "$sbom" --report "$D/licence/licence-report-$id.md" || rc=1
          done
          exit $rc
      - name: UI SBOM, licence gate, register and notices
        if: ${{ !cancelled() }}
        run: |
          rc=0
          sbom="$D/sbom/$($RD field ui sbom --version "$V")"
          $RL run --check sbom-ui --ledger-dir "$LEDGER" --expect deploy/licence/tools/node_modules/.bin/cyclonedx-npm --expect sangam-ui/node_modules -- \
            bash -c 'cd sangam-ui && ../deploy/licence/tools/node_modules/.bin/cyclonedx-npm --omit dev --spec-version 1.6 --output-format JSON --output-file "$1"' _ "$sbom" || rc=1
          $RL run --check licence-ui --ledger-dir "$LEDGER" --expect "$sbom" -- \
            $CL --strict --distribution ui --sbom "$sbom" --report "$D/licence/licence-report-ui.md" || rc=1
          $RL run --check register-ui --ledger-dir "$LEDGER" --expect "$sbom" -- \
            python3 -I deploy/licence/register_check.py "$sbom" --distribution ui || rc=1
          mkdir -p "$D/notices/ui"
          $RL run --check notices-ui --ledger-dir "$LEDGER" --expect "$sbom" -- \
            python3 -I deploy/licence/notice_bundle.py "$sbom" --distribution ui --root .. --out "$D/notices/ui" --node-modules sangam-ui/node_modules || rc=1
          $RL run --check ui-dist-archive --ledger-dir "$LEDGER" --expect sangam-ui/dist/index.html -- \
            tar -C sangam-ui/dist -czf "$D/sangam-ui-dist-$V.tgz" .
          exit $rc
      - name: Build-time tools never shipped (CR-16, licence-policy.json build_time_tools)
        if: ${{ !cancelled() }}
        run: |
          args=(--policy deploy/licence/licence-policy.json --tree "$D/lib-ext" --tree "$D/pdf-validator/lib" --tree "$D/esign/lib" --tree "$D/nats/lib")
          for s in "$D"/sbom/*.cdx.json; do [ -f "$s" ] && args+=(--sbom "$s"); done
          for j in "$D"/*.jar; do [ -f "$j" ] && args+=(--jar "$j"); done
          # 16 SBOMs (11 Maven distributions, ui, 4 SDK packages) and 7 jars (4 fat jars, simulators, sdk-java, operator)
          $RL run --check build-tools-not-shipped --ledger-dir "$LEDGER" --expect-glob "$D/sbom/*.cdx.json=16" --expect-glob "$D/*.jar=7" -- \
            python3 -I ../.github/scripts/build_tools_not_shipped.py "${args[@]}"
      - name: One crypto provider and one Commons Logging implementation per fat jar (RM-31)
        if: ${{ !cancelled() }}
        run: |
          args=(); expect=()
          for id in server control-plane gateway rollup; do
            j="$D/$($RD field "$id" jar --version "$V")"; args+=(--jar "$j"); expect+=(--expect "$j")
          done
          $RL run --check duplicate-classes --ledger-dir "$LEDGER" "${expect[@]}" -- \
            python3 -I ../.github/scripts/duplicate_classes.py "${args[@]}" --package org.bouncycastle --package org.apache.commons.logging
      - name: Release archives (notices bundles, PDF validator)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          tar -C "$D/pdf-validator" -czf "$D/sangam-pdf-validator-$V.tgz" .
          tar -C "$D/esign" -czf "$D/sangam-esign-$V.tgz" .
          tar -C "$D/nats" -czf "$D/sangam-nats-$V.tgz" .
      - name: SLSA subjects (M-094, input of the provenance job)
        id: subjects
        if: ${{ !cancelled() }}
        working-directory: dist
        run: echo "hashes=$(sha256sum *.jar *.tgz sbom/*.cdx.json | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: release-dist
          path: |
            dist/
            sangam/sangam-ui/dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ledger-build
          path: results/
          if-no-files-found: error

  images:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write   # push by digest only; tags are created by publish-images after the release gate
    env:
      V: ${{ needs.meta.outputs.version }}
      PUSH: ${{ needs.meta.outputs.push }}
      IMG: ${{ github.workspace }}/image-refs
      ISBOM: ${{ github.workspace }}/image-sbom
      ILIC: ${{ github.workspace }}/image-licence
      INOTICES: ${{ github.workspace }}/image-notices
      IVULN: ${{ github.workspace }}/image-vuln
    defaults:
      run:
        working-directory: sangam
        shell: bash
    outputs:
      server-digest: ${{ steps.digests.outputs.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tool directory
        # BIN is set here, not in the job-level env: the runner context does not exist there, and one such
        # expression makes the whole workflow file invalid (guard: workflow_guards.py --check contexts).
        run: echo "BIN=$RUNNER_TEMP/bin" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-dist, path: . }
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: v2.5.2
      - name: syft 1.29.0 and grype 0.121.3 (vendor cosign signature, then SHA-256 pin; CR-11, decision 179)
        run: |
          $FETCH syft --bin "$BIN"
          $FETCH grype --bin "$BIN"
      - name: Stage build inputs
        run: |
          set -euo pipefail
          mkdir -p "$IMG" "$ISBOM" "$ILIC" "$INOTICES" "$IVULN" deploy/docker/lib-ext
          for m in sangam-server sangam-control-plane sangam-gateway sangam-rollup; do
            if [ -f "../dist/$m-$V.jar" ]; then mkdir -p "$m/target" && cp "../dist/$m-$V.jar" "$m/target/$m.jar"; fi
          done
          sim="../dist/$($RD field simulators jar --version "$V")"
          if [ -f "$sim" ]; then mkdir -p sangam-integration/target && cp "$sim" sangam-integration/target/sangam-integration-simulators.jar; fi
          cp ../dist/lib-ext/*.jar deploy/docker/lib-ext/
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: needs.meta.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build every image (push by digest on a tag, local amd64 on a dry run)
        run: |
          rc=0
          build() {
            local id=$1 df=$2 plat=$3; shift 3
            local tag name digest
            tag=$($RD field "$id" image --version "$V"); name=${tag%%:*}
            if [ "$PUSH" = true ]; then
              $RL run --check "image-build-$id" --ledger-dir "$LEDGER" --expect "$df" -- \
                docker buildx build -f "$df" "$@" --platform "$plat" --provenance=mode=max --sbom=true \
                  --label "org.opencontainers.image.version=$V" \
                  --output "type=image,name=$REGISTRY/$name,push-by-digest=true,name-canonical=true,push=true" \
                  --metadata-file "$IMG/$id.meta.json" . || return 1
              digest=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$IMG/$id.meta.json")
              echo "registry:$REGISTRY/$name@$digest" > "$IMG/$id.ref"
              echo "$REGISTRY/$name@$digest $REGISTRY/$tag" > "$IMG/$id.tag"
            else
              $RL run --check "image-build-$id" --ledger-dir "$LEDGER" --expect "$df" -- \
                docker buildx build -f "$df" "$@" --platform linux/amd64 --label "org.opencontainers.image.version=$V" \
                  --load -t "local/$tag" . || return 1
              echo "docker:local/$tag" > "$IMG/$id.ref"
            fi
          }
          multi=linux/amd64,linux/arm64
          prebuilt=(--build-arg JAR_SOURCE=prebuilt)
          build server-image deploy/docker/server.Dockerfile $multi --target runtime "${prebuilt[@]}" \
            --build-arg PREBUILT_JAR=sangam-server/target/sangam-server.jar || rc=1
          build server-distroless-image deploy/docker/server.Dockerfile $multi --target runtime-distroless "${prebuilt[@]}" \
            --build-arg PREBUILT_JAR=sangam-server/target/sangam-server.jar || rc=1
          for app in control-plane gateway rollup; do
            build "$app-image" deploy/docker/server.Dockerfile $multi --target runtime --build-arg APP_MODULE=sangam-$app "${prebuilt[@]}" \
              --build-arg PREBUILT_JAR=sangam-$app/target/sangam-$app.jar || rc=1
          done
          build sdk-worker-image deploy/docker/sdk-worker-native.Dockerfile linux/amd64 || rc=1
          build ui-image deploy/docker/ui.Dockerfile $multi --build-arg DIST_SOURCE=prebuilt || rc=1
          build simulators-image deploy/docker/simulators.Dockerfile linux/amd64 "${prebuilt[@]}" || rc=1
          build pdf-validator-image "$($RD field pdf-validator-image dockerfile)" $multi || rc=1
          build operator-image "$($RD field operator-image dockerfile)" $multi || rc=1
          # decisions 128 and 157: the script worker and the OCR sidecar are built only from their pinned build args
          # (distributions.json build_args: nsjail and kafel commits, the Ubuntu snapshot id); an empty one BLOCKS it.
          pinned() {
            local id=$1 args_file k v missing=""
            local -a a=()
            args_file=$($RD field "$id" build_args)
            while IFS='=' read -r k v; do
              case "$k" in ''|\#*) continue ;; esac
              [ -n "$v" ] || missing="$missing $k"
              a+=(--build-arg "$k=$v")
            done < "$args_file"
            if [ -n "$missing" ]; then
              $RL record --check "image-build-$id" --ledger-dir "$LEDGER" --status BLOCKED \
                --reason "empty build args in $args_file:$missing (decisions 128, 157)"
              return 1
            fi
            build "$id" "$($RD field "$id" dockerfile)" linux/amd64 "${a[@]}"
          }
          pinned script-worker-image || rc=1
          pinned ocr-image || rc=1
          exit $rc
      - name: Image digests
        id: digests
        if: ${{ !cancelled() && needs.meta.outputs.push == 'true' }}
        run: |
          d=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$IMG/server-image.meta.json")
          echo "server=$d" >> "$GITHUB_OUTPUT"
      - name: Per-image gates (syft SBOM, licence strict with the OS-package rule, register, notices)
        if: ${{ !cancelled() }}
        run: |
          rc=0
          for id in $($RD ids --kind image); do
            ref="$IMG/$id.ref"
            sbom="$ISBOM/$($RD field "$id" sbom --version "$V")"
            scope=$($RD scope "$id")
            $RL run --check "image-sbom-$id" --ledger-dir "$LEDGER" --expect "$ref" --tool-version syft-1.29.0 -- \
              bash -c '"$1" "$(cat "$2")" -o cyclonedx-json="$3" -q' _ "$BIN/syft" "$ref" "$sbom" || rc=1
            $RL run --check "licence-$id" --ledger-dir "$LEDGER" --expect "$sbom" -- \
              $CL --strict --image --source-root . --distribution "$scope" --sbom "$sbom" --report "$ILIC/licence-report-$id.md" || rc=1
            $RL run --check "register-$id" --ledger-dir "$LEDGER" --expect "$sbom" -- \
              python3 -I deploy/licence/register_check.py "$sbom" --distribution "$id" || rc=1
            offer=$($RD field "$id" source_offer); out="$INOTICES/$id"; mkdir -p "$out"
            if [ -f "$offer" ]; then cp "$offer" "$out/"; fi
            $RL run --check "notices-$id" --ledger-dir "$LEDGER" --expect "$sbom" --expect "$offer" -- \
              python3 -I deploy/licence/notice_bundle.py "$sbom" --distribution "$scope" --root .. --out "$out" || rc=1
          done
          # decisions 118, 128 and 157: the pinned build args of the script worker and the OCR sidecar, and the Ubuntu
          # package versions their snapshot resolved (/licenses/OS-PACKAGES.txt in the image), travel with the SBOM.
          for row in script-worker-image:sangam-script-worker ocr-image:sangam-ocr; do
            IFS=: read -r id base <<<"$row"
            cp "$($RD field "$id" build_args)" "$ISBOM/${base}_$V.build-args.env"
            [ -f "$IMG/$id.ref" ] || continue   # not built: its build and gates above already failed
            img=$(sed -e 's/^registry://' -e 's/^docker://' "$IMG/$id.ref")
            $RL run --check "image-os-packages-$id" --ledger-dir "$LEDGER" --expect "$IMG/$id.ref" -- \
              bash -c 'set -euo pipefail; c=$(docker create --platform linux/amd64 "$1"); trap "docker rm -f $c" EXIT; docker cp "$c:/licenses/OS-PACKAGES.txt" "$2"; test -s "$2"' \
              _ "$img" "$ISBOM/${base}_$V.os-packages.txt" || rc=1
          done
          exit $rc
      - name: Image vulnerability gate (grype, critical with a fix fails, decision 133)
        if: ${{ !cancelled() }}
        run: |
          $RL run --check image-vuln-scan --ledger-dir "$LEDGER" --tool-version grype-0.121.3 --expect-glob "$ISBOM/*.cdx.json=12" -- \
            bash -c 'rc=0; for s in "$1"/*.cdx.json; do "$2" "sbom:$s" --fail-on critical --only-fixed -o table --file "$3/$(basename "$s" .cdx.json).grype.txt" || rc=1; done; exit $rc' \
            _ "$ISBOM" "$BIN/grype" "$IVULN"
      - name: Image SBOMs hold no build-time tool (CR-16)
        if: ${{ !cancelled() }}
        run: |
          args=(--policy deploy/licence/licence-policy.json)
          for s in "$ISBOM"/*.cdx.json; do [ -f "$s" ] && args+=(--sbom "$s"); done
          $RL run --check build-tools-not-shipped --ledger-dir "$LEDGER" --expect-glob "$ISBOM/*.cdx.json=12" -- \
            python3 -I ../.github/scripts/build_tools_not_shipped.py "${args[@]}"
      - name: Air-gap bundle licence gate and completeness (RM-13, CR-06)
        # The bundle itself is written by the publish job, after the release gate, from the tags created there; this
        # line proves before the gate that its image list passes the licence policy and that every product image of
        # images.txt was built in this run.
        if: ${{ !cancelled() }}
        run: |
          $RL run --check airgap-bundle --ledger-dir "$LEDGER" --expect deploy/airgap/images.txt -- bash -c '
            set -euo pipefail
            python3 -I deploy/airgap/bundle_licence_gate.py deploy/airgap/images.txt deploy/licence/licence-policy.json
            for img in $(sed -n "s/^product[[:space:]]\{1,\}\${SANGAM_REGISTRY}\/\([^:]*\):.*/\1/p" deploy/airgap/images.txt); do
              grep -Eq "/$img[@:]" "$1"/*.ref || { echo "::error::air-gap product image $img was not built in this release"; exit 1; }
            done' _ "$IMG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: image-release-files
          path: |
            image-refs/
            image-sbom/
            image-licence/
            image-notices/
            image-vuln/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ledger-images
          path: results/
          if-no-files-found: error

  chart:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      V: ${{ needs.meta.outputs.version }}
    defaults:
      run:
        working-directory: sangam
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with: { version: v3.18.4 }
      - name: Chart version and image repository
        run: |
          sed -i "s/^appVersion: .*/appVersion: \"$V\"/" deploy/helm/sangam/Chart.yaml
          sed -i "s#repository: sqamentor/#repository: ${GITHUB_REPOSITORY_OWNER}/#" deploy/helm/sangam/values.yaml
      - name: helm lint and template, every example values file
        run: |
          $RL run --check helm-lint --ledger-dir "$LEDGER" --expect deploy/helm/sangam/Chart.yaml -- bash -c '
            set -euo pipefail
            helm lint deploy/helm/sangam --kube-version 1.30.0 -f deploy/helm/sangam/examples/values-postgres.yaml --strict
            for f in deploy/helm/sangam/examples/values-*.yaml; do
              extra=()
              case "$f" in *airgap*) extra=(-f deploy/helm/sangam/examples/values-postgres.yaml) ;; esac
              echo "== $f"
              helm lint deploy/helm/sangam --kube-version 1.30.0 "${extra[@]}" -f "$f" --strict
              helm template sangam deploy/helm/sangam --kube-version 1.30.0 "${extra[@]}" -f "$f" --namespace sangam > /dev/null
            done'
      - name: Backup images have no default and are required (decision 129)
        if: ${{ !cancelled() }}
        run: $RL run --check helm-backup-guard --ledger-dir "$LEDGER" -- python3 -I deploy/helm/backup_image_guard.py deploy/helm/sangam
      - name: Chart package
        if: ${{ !cancelled() }}
        run: |
          mkdir -p ../chart
          helm package deploy/helm/sangam --version "$V" --app-version "$V" -d ../chart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: release-chart
          path: chart/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ledger-chart
          path: results/
          if-no-files-found: error

  release-gate:
    # CR-01, CR-22: every line of release-checks.json "release" must be PASS, and every job it reads must have
    # succeeded. Nothing below runs unless this job succeeds.
    name: Release gate (results ledger)
    needs: [meta, build, images, chart, db-matrix, security, governance]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: sangam/deploy/licence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ledger-*
          path: results
      - name: Every upstream job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -I -c 'import json,os,sys
          bad = {k: v["result"] for k, v in json.loads(os.environ["NEEDS"]).items() if v["result"] != "success"}
          [print(f"::error::job {k}: {r}") for k, r in sorted(bad.items())]
          sys.exit(1 if bad else 0)'
      - name: Results-ledger gate (release mode, every line PASS)
        if: ${{ !cancelled() }}
        run: $RL gate --required sangam/deploy/licence/release-checks.json --mode release --set release --ledger-dir results --out results/release-gate.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-gate-ledger
          path: results/
          if-no-files-found: error
          retention-days: 90

  publish-images:
    # Tags exactly the digests that were scanned and gated, then attests the server image (GitHub provenance).
    needs: [meta, images, release-gate]
    if: needs.meta.outputs.push == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: image-release-files, path: . }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the gated digests
        run: |
          set -euo pipefail
          n=0
          for f in image-refs/*.tag; do
            read -r src tag < "$f"
            docker buildx imagetools create -t "$tag" "$src"
            n=$((n + 1))
          done
          [ "$n" -eq 12 ] || { echo "::error::expected 12 gated images, tagged $n"; exit 1; }
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.REGISTRY }}/sangam-server
          subject-digest: ${{ needs.images.outputs.server-digest }}
          push-to-registry: true

  slsa-provenance:
    # M-094: SLSA Build L3 provenance from the isolated reusable workflow (slsa-github-generator v2.1.0, approved
    # batch 1). Report-only: no job needs it, so a failure here never blocks the publish job. The generator must be
    # referenced by its release tag (it verifies its own ref; ci-tool-pins.json tag_pinned_actions). The
    # .intoto.jsonl is a workflow artifact.
    needs: [meta, build, release-gate]
    if: needs.meta.outputs.push == 'true'
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: false

  evidence:
    # R52: audit evidence pack. Every mandatory area must be present (no --allow-missing, RM-12).
    name: Audit evidence pack
    needs: [meta, build, images, release-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: read
      id-token: write   # keyless signature of SHA256SUMS
    env:
      V: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: "25.0.1" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-dist, path: . }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: image-release-files, path: images }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-gate-ledger, path: evidence-input/tests/results-ledger }
      - name: Collect pipeline reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: pipeline
          pattern: "{db-*-reports,release-unit-test-reports,dependency-check-report}"
      - name: sangam-compliance evidence report
        run: bash sangam/deploy/evidence/generate_compliance_report.sh "dist/sangam-server-$V.jar" evidence-input/compliance
      - name: CodeQL summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence-input/codeql
          gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?ref=$GITHUB_REF&state=open&per_page=100" \
            > evidence-input/codeql/open-alerts.json
          python3 -I -c "import json,collections as c;a=json.load(open('evidence-input/codeql/open-alerts.json'));json.dump({'ref':'$GITHUB_REF','openAlerts':len(a),'bySeverity':c.Counter((x.get('rule') or {}).get('security_severity_level') or (x.get('rule') or {}).get('severity') or 'unknown' for x in a)},open('evidence-input/codeql/summary.json','w'),indent=2)"
      - name: Configuration and version manifest
        run: |
          mkdir -p evidence-input/config
          cp sangam/deploy/helm/sangam/values.yaml sangam/deploy/helm/sangam/Chart.yaml sangam/deploy/SUPPORT-MATRIX.md \
             sangam/deploy/airgap/images.txt sangam/pom.xml sangam/deploy/licence/distributions.json \
             sangam/deploy/licence/release-checks.json sangam/deploy/licence/ci-tool-pins.json evidence-input/config/
          cp sangam/sangam-compliance/src/main/resources/compliance/jurisdictions/IN/obligations.tsv evidence-input/compliance/
      - name: Standards profile of this release (M-052; R44, CF-8)
        # --check: the committed profile matches the committed compat data (gen-compat.mjs output) and FEEL policy;
        # then the profile of the tag version for the pack (10-standards-profile) and the release assets.
        run: |
          set -euo pipefail
          python3 -I sangam/deploy/evidence/gen_standards_profile.py --check
          python3 -I sangam/deploy/evidence/gen_standards_profile.py --version "$V" --out-dir evidence-input/standards
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standards-profile
          path: evidence-input/standards/
          if-no-files-found: error
      - name: Assemble pack
        run: |
          set -euo pipefail
          cp -r pipeline/db-*-reports pipeline/release-unit-test-reports evidence-input/tests/
          args=(--version "$V" --commit "$GITHUB_SHA" --out evidence --pom sangam/pom.xml
                --area sbom=dist/sbom --area sbom=images/image-sbom
                --area licence=dist/licence --area licence=images/image-licence
                --area dependency-check=pipeline/dependency-check-report --area codeql=evidence-input/codeql
                --area tests=evidence-input/tests --area compliance=evidence-input/compliance
                --area config=evidence-input/config --area procurement=sangam/deploy/evidence/procurement
                --area standards=evidence-input/standards)
          for f in images/image-refs/*.tag; do
            [ -f "$f" ] || continue
            read -r src _tag < "$f"
            args+=(--image "$src")
          done
          python3 -I sangam/deploy/evidence/build_evidence_pack.py "${args[@]}"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        if: needs.meta.outputs.push == 'true'
        with:
          cosign-release: v2.5.2
      - name: Sign checksums (keyless)
        if: needs.meta.outputs.push == 'true'
        run: |
          cd "evidence/sangam-evidence-$V"
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cd .. && rm -f "sangam-evidence-$V.tar.gz" && tar -czf "sangam-evidence-$V.tar.gz" "sangam-evidence-$V"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-pack
          path: evidence/*.tar.gz
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [meta, build, images, chart, release-gate, publish-images, evidence]
    if: needs.meta.outputs.push == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      packages: read
    env:
      V: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-dist, path: . }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: image-release-files, path: images }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-chart, path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: evidence-pack, path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: standards-profile, path: standards }
      - name: Merge image SBOMs, licence reports and notices into the release
        run: |
          set -euo pipefail
          cp images/image-sbom/* dist/sbom/
          cp images/image-licence/* dist/licence/
          cp -R images/image-notices/. dist/notices/
          tar -C dist/notices -czf "dist/sangam-notices-$V.tgz" .
      - name: THIRD-PARTY-LICENSES book (M-088, from every gated notices bundle; any gap fails the release)
        run: python3 -I sangam/deploy/licence/licence_book.py dist/notices --version "$V" --out "dist/THIRD-PARTY-LICENSES-$V.txt"
      - name: Standards profile release assets (M-052)
        run: |
          set -euo pipefail
          cp standards/STANDARDS-PROFILE.md "dist/sangam-standards-profile-$V.md"
          cp standards/standards-profile.json "dist/sangam-standards-profile-$V.json"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: v2.5.2
      - name: syft 1.29.0 (vendor cosign signature, then SHA-256 pin, decision 179; save-images.sh writes the bundle image SBOMs)
        run: |
          python3 -I sangam/deploy/licence/fetch_tool.py syft --bin "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with: { version: v3.18.4 }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Air-gapped bundle (strict, every image, SBOM, notice and source offer)
        run: |
          set -euo pipefail
          bash sangam/deploy/airgap/save-images.sh --version "$V" --registry "$REGISTRY" --out airgap \
            --sbom-dir dist/sbom --notices-dir dist/notices
          # GitHub release assets are limited to 2 GiB each
          split -b 1900m -d "airgap/sangam-airgap-$V.tar" "dist/sangam-airgap-$V.tar.part-"
          cp "airgap/sangam-airgap-$V.tar.sha256" dist/
      - name: Checksums
        working-directory: dist
        run: |
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Sangam ${{ needs.meta.outputs.version }}
          tag_name: v${{ needs.meta.outputs.version }}
          prerelease: ${{ contains(needs.meta.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Images (`${{ env.REGISTRY }}/<name>:${{ needs.meta.outputs.version }}`): `sangam-server` (also `-distroless`), `sangam-control-plane`, `sangam-gateway`, `sangam-rollup`, `sangam-ui`, `sangam-sdk-worker`, `sangam-simulators`, `sangam-pdf-validator`, `sangam-ocr`, `sangam-script-worker`, `sangam-operator`.
            Server image digest: `${{ needs.images.outputs.server-digest }}`.
            Every release check passed (results ledger in the audit evidence pack, `05-tests/results-ledger`).
            Air-gapped bundle: concatenate the `.tar.part-*` files (`cat sangam-airgap-*.tar.part-* > sangam-airgap.tar`), then `sha256sum -c`.
            Audit evidence pack (R52): `sangam-evidence-*.tar.gz`, start at `INDEX.md`; `SHA256SUMS` is signed with cosign (keyless).
            One CycloneDX 1.6 SBOM per distribution and image is in the assets, with its licence report; licence notices per distribution are in `sangam-notices-*.tgz`, and `THIRD-PARTY-LICENSES-*.txt` lists every third-party component with the text of each licence once.
            Standards profile (R44): `sangam-standards-profile-*.md` and `.json`, the BPMN, DMN and CMMN constructs this release supports and its FEEL policy.
            Optional eSign and DSC add-on (decision 217, off by default, not in the images): `sangam-esign-*.tgz`, the sangam-esign jar and the Bouncy Castle jars the server does not ship, for `/opt/sangam/lib-ext` (deploy README, eSign add-on). Live eSign stays off until its ESP profile is confirmed.
            Optional NATS add-on (decision 232, off by default, not in the images): `sangam-nats-*.tgz`, jnats and its Bouncy Castle jar bcprov-lts8on, for `/opt/sangam/lib-ext`. Without it the server refuses NATS settings. Not combinable with the eSign add-on.
            Source offers: `SOURCE-OFFER.txt` (MariaDB Connector/J, with its source jar) and `OS-PACKAGES-SOURCE-OFFER.txt` (operating-system packages in the images).
          files: |
            dist/*.jar
            dist/*.tgz
            dist/lib-ext/*
            dist/sbom/*
            dist/licence/*
            dist/OS-PACKAGES-SOURCE-OFFER.txt
            dist/THIRD-PARTY-LICENSES-*.txt
            dist/sangam-standards-profile-*
            dist/sangam-airgap-*
            dist/SHA256SUMS
            dist/sangam-evidence-*.tar.gz
