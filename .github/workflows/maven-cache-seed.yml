# SPDX-License-Identifier: Apache-2.0
# Seeds the shared Maven cache (.github/actions/maven-cache) in the default branch's cache scope.
# Root cause of the cold-cache Maven Central HTTP 429 (run 44879593721, ci/packs-boot-15ce4cdb-e07382): a ci/* branch
# can restore only its own caches and main's, and the only writer (ci-lanes `deps`) runs on ci/** only, so main never
# held the cache (`gh cache list` 2026-11-21: 43 entries, 11.1 GB, none on refs/heads/main). Every new lane branch
# therefore started cold and fetched ~590 MiB plus the Maven distribution from repo.maven.apache.org.
# This job is the one writer in main's scope: on a pom or wrapper change on main, daily (keeps the entry recently used
# under the 10 GB LRU eviction) and on dispatch. With an exact-key hit actions/cache saves nothing, so lane branches
# then restore main's entry and add no ~590 MiB copy of their own. It builds and tests nothing.
name: maven-cache-seed

on:
  push:
    branches: [main]
    paths: ["sangam/**/pom.xml", "sangam/.mvn/wrapper/maven-wrapper.properties", ".github/actions/maven-cache/**",
            ".github/workflows/maven-cache-seed.yml"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-cache-seed-${{ github.ref }}
  cancel-in-progress: false

env:
  MAVEN_ARGS: -B -ntp
  TZ: UTC

jobs:
  seed:
    name: Maven dependencies (main-scope cache writer)
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: sangam
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25.0.5+8"
      - uses: ./.github/actions/maven-cache
        with:
          save: "true"
      - name: Resolve once everything the workflows fetch later (maven_inventory.py)
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/actions/maven-cache/prefetch.sh"
      - name: Maven fetch count (Maven Central 429 evidence)
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/actions/maven-cache/fetch-count.sh"
