# SPDX-License-Identifier: Apache-2.0
# Licence gate (SANGAM.md X.3, LIC-1..LIC-11; M-148, decision 116: strict on every pull request). One CycloneDX SBOM
# per distribution (makeBom per module, CR-03), each matched against its fat jar, checked strictly against the licence
# policy with its distribution scope (CR-05), against the decision register (CR-08, CR-09: a new or changed transitive
# without a register row fails), and for build-time tools (CR-16). The build/test scope gets its own review (CR-17,
# decision 127). Every check writes a results-ledger line (CR-01); a missing input is BLOCKED, never a skip.
name: licence-check

on:
  push:
    branches: [main]
    paths: ["sangam/**/pom.xml", "sangam/**/package.json", "sangam/**/package-lock.json", "sangam/deploy/licence/**", ".github/workflows/licence-check.yml"]
  pull_request:
    paths: ["sangam/**/pom.xml", "sangam/**/package.json", "sangam/**/package-lock.json", "sangam/deploy/licence/**", ".github/workflows/licence-check.yml"]
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  LEDGER: ${{ github.workspace }}/results
  RL: python3 -I ${{ github.workspace }}/sangam/deploy/licence/results_ledger.py
  RD: python3 -I ${{ github.workspace }}/sangam/deploy/licence/release_dist.py
  CL: python3 -I deploy/licence/check_licences.py --policy deploy/licence/licence-policy.json
  CYCLONEDX: org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom

jobs:
  licences:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: sangam
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: "25.0.5+8" }
      - uses: ./.github/actions/maven-cache
      - name: Package (no tests)
        run: mvn -B -ntp -DskipTests package
      - name: Project version (names each jar, RM-15)
        run: |
          v=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          [ -n "$v" ] || { echo "::error::no project version"; exit 2; }
          echo "V=$v" >> "$GITHUB_ENV"
      - name: CycloneDX SBOM per module (shipped scopes, CR-03)
        # makeBom writes target/sangam-dist.cdx.json in every module. cyclonedx-maven-plugin is pinned here by its
        # coordinate; moving the pin into the root pom pluginManagement is a REQUEST to the integrator (CR-12).
        run: |
          mvn -B -ntp -DskipTests $CYCLONEDX -DoutputFormat=json -DoutputName=sangam-dist.cdx -DschemaVersion=1.6 \
            -DincludeTestScope=false -DincludeProvidedScope=false -DincludeSystemScope=false
      - name: Forbidden coordinates anywhere in the shipped dependency tree (CR-02)
        run: |
          $RL run --check forbidden-coordinates --ledger-dir "$LEDGER" -- bash -c '
            set -euo pipefail
            mvn -B -ntp -q dependency:tree -Dscope=runtime -DoutputFile=target/deps.txt -DappendOutput=true
            files=$(find . -name deps.txt -path "*/target/*")
            [ -n "$files" ] || { echo "::error::no dependency tree written"; exit 2; }
            if cat $files | grep -E -i "com\.oracle\.database|com\.ibm\.db2|mysql-connector|org\.graalvm\.(polyglot|js)|nashorn|jython|jruby"; then
              echo "::error::forbidden dependency in runtime scope (SANGAM.md X.3a)"; exit 1
            fi
            # Rhino is allowed only in the pdf-validator distribution (decision 119, licence-policy.json allowed_in)
            for f in $files; do
              case "$f" in ./sangam-pdf-validator/*) continue ;; esac
              if grep -qi "org\.mozilla:rhino" "$f"; then echo "::error::org.mozilla:rhino outside sangam-pdf-validator: $f"; exit 1; fi
            done'
      - name: Build and test scope review (CR-17, decisions 123 and 127)
        run: |
          mvn -B -ntp -DskipTests $CYCLONEDX -DoutputFormat=json -DoutputName=sangam-build-scope.cdx -DschemaVersion=1.6 \
            -DincludeTestScope=true -DincludeProvidedScope=true -DincludeSystemScope=true
          $RL run --check build-scope-review --ledger-dir "$LEDGER" --expect-glob '**/target/sangam-build-scope.cdx.json=1' -- \
            bash -c 'args=(); for s in $(find . -name sangam-build-scope.cdx.json -path "*/target/*"); do args+=(--sbom "$s"); done; '"$CL"' --build-scope "${args[@]}"'
      - name: Per-distribution gates (licence strict, register, SBOM matches jar)
        run: |
          rc=0; mkdir -p target
          # RM-15: each fat jar is named from distributions.json with the built version, never found by a glob
          V=$($RD pom-version)
          for id in server control-plane gateway rollup sdk-java; do
            mod=$($RD field "$id" module)
            sbom="$mod/target/sangam-dist.cdx.json"; jar=""
            if [ "$id" != sdk-java ]; then
              jar="$mod/target/$($RD field "$id" jar --version "$V")"
              $RL run --check sbom-match-$id --ledger-dir "$LEDGER" --expect "$sbom" --expect "$jar" -- \
                python3 -I deploy/licence/sbom_matches_jar.py "$sbom" --distribution $id --jar "$jar" --out "target/dist-$id.cdx.json" || rc=1
            else
              cp "$sbom" "target/dist-$id.cdx.json" || rc=1
            fi
            $RL run --check licence-$id --ledger-dir "$LEDGER" --expect "target/dist-$id.cdx.json" -- \
              $CL --strict --distribution $id --sbom "target/dist-$id.cdx.json" --report "target/licence-report-$id.md" ${jar:+--jar "$jar"} || rc=1
            $RL run --check register-$id --ledger-dir "$LEDGER" --expect "target/dist-$id.cdx.json" -- \
              python3 -I deploy/licence/register_check.py "target/dist-$id.cdx.json" --distribution $id || rc=1
          done
          exit $rc
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22.23.5", package-manager-cache: false }
      - name: UI SBOM (tools lockfile, CR-12; install scripts off, decision 130)
        run: |
          rc=0
          $RL run --check ui-sbom --ledger-dir "$LEDGER" --expect sangam-ui/package-lock.json --expect deploy/licence/tools/package-lock.json -- bash -c '
            set -euo pipefail
            (cd deploy/licence/tools && npm ci --ignore-scripts --no-audit --no-fund)
            cd sangam-ui && npm ci --ignore-scripts --no-audit --no-fund
            ../deploy/licence/tools/node_modules/.bin/cyclonedx-npm --omit dev --spec-version 1.6 --output-format JSON --output-file ../target/dist-ui.cdx.json' || rc=1
          $RL run --check licence-ui --ledger-dir "$LEDGER" --expect target/dist-ui.cdx.json -- \
            $CL --strict --distribution ui --sbom target/dist-ui.cdx.json --report target/licence-report-ui.md || rc=1
          $RL run --check register-ui --ledger-dir "$LEDGER" --expect target/dist-ui.cdx.json -- \
            python3 -I deploy/licence/register_check.py target/dist-ui.cdx.json --distribution ui || rc=1
          exit $rc
      - name: Build-time tools never shipped (CR-16, licence-policy.json build_time_tools)
        # SpotBugs, FindSecBugs, the Semgrep CLI and sonar-maven-plugin are allowed only as build-time tools: none may
        # appear in a shipped SBOM or fat jar. Every expected SBOM and jar must exist (BLOCKED otherwise).
        run: |
          args=(--policy deploy/licence/licence-policy.json); expect=()
          for s in target/dist-*.cdx.json; do [ -f "$s" ] && args+=(--sbom "$s"); done
          # RM-15: the four fat jars by name (distributions.json and the built version), each one expected
          V=$($RD pom-version); expect=()
          for id in server control-plane gateway rollup; do
            j="$($RD field "$id" module)/target/$($RD field "$id" jar --version "$V")"
            args+=(--jar "$j"); expect+=(--expect "$j")
          done
          $RL run --check build-tools-not-shipped --ledger-dir "$LEDGER" --expect-glob 'target/dist-*.cdx.json=6' "${expect[@]}" -- \
            python3 -I ../.github/scripts/build_tools_not_shipped.py "${args[@]}"
      - name: One crypto provider and one Commons Logging implementation per fat jar (RM-31)
        run: |
          V=$($RD pom-version); args=(); expect=()
          for id in server control-plane gateway rollup; do
            j="$($RD field "$id" module)/target/$($RD field "$id" jar --version "$V")"
            args+=(--jar "$j"); expect+=(--expect "$j")
          done
          $RL run --check duplicate-classes --ledger-dir "$LEDGER" "${expect[@]}" -- \
            python3 -I ../.github/scripts/duplicate_classes.py "${args[@]}" --package org.bouncycastle --package org.apache.commons.logging
      - name: Results-ledger gate (pull request)
        if: always()
        run: $RL gate --required deploy/licence/release-checks.json --mode pr --set pr-licence-check --ledger-dir "$LEDGER"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: licence-report
          path: |
            sangam/target/dist-*.cdx.json
            sangam/target/licence-report-*.md
            results/
          if-no-files-found: error
