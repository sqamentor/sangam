# SPDX-License-Identifier: Apache-2.0
# Licence gate (SANGAM.md X.3, LIC-1..LIC-11): fails on forbidden licences, on forbidden components (Oracle / Db2 /
# MySQL Connector/J drivers, GraalJS, Rhino/Nashorn/Jython/JRuby, Liquibase >= 5) and on any forbidden driver nested
# inside the Spring Boot fat jar (MariaDB must stay a separate replaceable jar, LIC-5).
name: licence-check

on:
  push:
    branches: [main]
    paths: ["sangam/**/pom.xml", "sangam/**/package.json", "sangam/**/package-lock.json", "sangam/deploy/licence/**", ".github/workflows/licence-check.yml"]
  pull_request:
    paths: ["sangam/**/pom.xml", "sangam/**/package.json", "sangam/**/package-lock.json", "sangam/deploy/licence/**", ".github/workflows/licence-check.yml"]
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  licences:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: sangam
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven, cache-dependency-path: "sangam/**/pom.xml" }
      - name: Package (no tests)
        run: mvn -B -ntp -DskipTests package
      - name: CycloneDX aggregate SBOM (shipped scopes)
        run: |
          mvn -B -ntp -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom \
            -DoutputFormat=json -DoutputName=sangam-maven.cdx -DschemaVersion=1.6 \
            -DincludeTestScope=false -DincludeProvidedScope=false -DincludeSystemScope=false
      - name: Forbidden coordinates anywhere in the shipped dependency tree
        run: |
          mvn -B -ntp -q dependency:tree -Dscope=runtime -DoutputFile=target/deps.txt -DappendOutput=true || true
          if cat $(find . -name deps.txt -path '*/target/*') 2>/dev/null | grep -E -i 'com\.oracle\.database|com\.ibm\.db2|mysql-connector|org\.graalvm\.(polyglot|js)|org\.mozilla:rhino|nashorn|jython|jruby'; then
            echo "::error::forbidden dependency in runtime scope (SANGAM.md X.3a)"; exit 1
          fi
      - uses: actions/setup-node@v4
        if: hashFiles('sangam/sangam-ui/package-lock.json') != ''
        with: { node-version: "22" }
      - name: UI SBOM
        if: hashFiles('sangam/sangam-ui/package-lock.json') != ''
        working-directory: sangam/sangam-ui
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npx --yes @cyclonedx/cyclonedx-npm@2.1.0 --omit dev --spec-version 1.6 --output-format JSON --output-file ../target/sangam-ui.cdx.json
      - name: Licence policy
        run: |
          args=(--policy deploy/licence/licence-policy.json --sbom target/sangam-maven.cdx.json --report target/licence-report.md)
          [ -f target/sangam-ui.cdx.json ] && args+=(--sbom target/sangam-ui.cdx.json)
          for j in $(ls sangam-server/target/sangam-server-*.jar 2>/dev/null | grep -v -e '\.original$' -e '-plain\.jar$' -e '-sources\.jar$'); do
            args+=(--jar "$j")
          done
          python3 -I deploy/licence/check_licences.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licence-report
          path: |
            sangam/target/*.cdx.json
            sangam/target/licence-report.md
          if-no-files-found: ignore
