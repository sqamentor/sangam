# SPDX-License-Identifier: Apache-2.0
# M-095 test-quality reports (owner download batch 1, 2026-11-12). REPORT-ONLY: no threshold fails the run.
#   - coverage: the unit tests (H2, as in ci-build.yml) with the JaCoCo 0.8.16 agent (-Psangam-coverage); the SANGAM.md
#     target (85% lines on core) is a JaCoCo check with haltOnFailure=false.
#   - mutation: PIT 1.30.2 + pitest-junit5-plugin 1.2.3 on sangam-core (-Psangam-mutation); the 70% target is reported,
#     mutationThreshold 0 keeps it non-blocking.
# jqwik, Jazzer and Cucumber are managed in sangam/pom.xml; their harnesses arrive with the module owners in Wave 2.
# Weekly and on demand only: these runs are long and are not a pull-request gate.
# CR-01 (W4-C): the thresholds are report-only (haltOnFailure=false, mutationThreshold 0), but a failing build, test or
# tool run fails the job: there is no continue-on-error. Each job records a results-ledger line NOT-RUN (report-only).
name: quality

on:
  schedule:
    - cron: "0 21 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -ntp
  TZ: UTC
  LEDGER: ${{ github.workspace }}/results
  RL: python3 -I ${{ github.workspace }}/sangam/deploy/licence/results_ledger.py

defaults:
  run:
    working-directory: sangam
    shell: bash

jobs:
  coverage:
    name: Unit-test coverage (JaCoCo, report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: "25.0.5+8", cache: maven, cache-dependency-path: "sangam/**/pom.xml" }
      - name: Unit tests with the JaCoCo agent
        run: |
          mvn $MAVEN_ARGS -Psangam-coverage -Dsangam.db=h2 -DskipITs -Dsangam.it.skip=true verify
          $RL record --check coverage --ledger-dir "$LEDGER" --status NOT-RUN --reason "report-only: the 85% line target is a JaCoCo check with haltOnFailure=false; the build and tests passed"
      - name: Coverage summary
        if: always()
        run: |
          echo "### JaCoCo line coverage per module (report-only, target 85% on core)" >> "$GITHUB_STEP_SUMMARY"
          for f in $(find . -path '*/target*/site/jacoco/jacoco.csv' | sort); do
            python3 -I -c "import csv,sys;r=list(csv.DictReader(open(sys.argv[1])));m=sum(int(x['LINE_MISSED']) for x in r);c=sum(int(x['LINE_COVERED']) for x in r);print(f'- {sys.argv[2]}: {100*c/max(c+m,1):.1f}% ({c}/{c+m} lines)')" "$f" "${f%%/target*}" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jacoco-reports
          path: |
            sangam/**/target*/site/jacoco/
            results/
          retention-days: 14

  mutation:
    name: Mutation testing sangam-core (PIT, report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: "25.0.5+8", cache: maven, cache-dependency-path: "sangam/**/pom.xml" }
      - name: Compile sangam-core and its tests
        run: mvn $MAVEN_ARGS -pl sangam-core -am -DskipTests install
      - name: PIT mutationCoverage (mutationThreshold 0)
        run: |
          mvn $MAVEN_ARGS -Psangam-mutation -pl sangam-core org.pitest:pitest-maven:1.30.2:mutationCoverage
          $RL record --check mutation --ledger-dir "$LEDGER" --status NOT-RUN --reason "report-only: the 70% target is reported, mutationThreshold 0; the PIT run completed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pit-reports
          path: |
            sangam/sangam-core/target*/pit-reports/
            results/
          retention-days: 14
