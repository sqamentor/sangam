# SPDX-License-Identifier: Apache-2.0
# Tier-1 SDKs (ADR-D-4): Java, .NET, Python, TypeScript/Node, PHP; Tier-2: Go, Rust, Kotlin (M-022); the generated
# typed surface check (M-020) and the AC-08 cross-language run (M-023). Each job builds and runs the SDK's unit /
# contract tests (T01-T04, T18 against a mock of sangam-rest/api/sangam-api.yaml). A job is skipped with a notice
# when its SDK directory does not exist yet.
name: sdks

on:
  push:
    branches: [main]
    paths: ["sangam/sdks/**", "sangam/sangam-rest/api/**", ".github/workflows/sdks.yml"]
  pull_request:
    paths: ["sangam/sdks/**", "sangam/sangam-rest/api/**", ".github/workflows/sdks.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Toolchains (downloads batch 2, owner 2026-11-12, CI-first), pinned exactly: .NET SDK 8.0.404, Go 1.27.4 (decision 190; go.mod floor 1.26), PHP 8.3 with
# composer 2.8.3 (phpunit 11.5.0 pinned by "composer update --with" in the php job; composer.json keeps ^11.5 so
# "composer validate --strict" stays clean), xunit 2.9.2 / Microsoft.NET.Test.Sdk 17.11.1 /
# xunit.runner.visualstudio 2.8.2 (exact in the test csproj), Kotlin 2.0.21 (sdks/kotlin/pom.xml), Gradle 8.10.2,
# openapi-generator-cli 7.10.0 from Maven Central fetched with -C (the build fails on a checksum mismatch; Kotlin and the
# SDK Maven builds use -C too). @types/node 20.19.43 is exact in sdks/typescript/package.json with its sha512 in
# package-lock.json (npm ci verifies it). The setup-* actions download from the vendors' release servers; they take no
# user checksum, so their pins are the exact versions above. Go is the exception (decision 260): both Go jobs fetch the
# official go.dev tarball and check its published SHA-256 before use (1.27.4, and 1.26.11 for the floor).
concurrency:
  group: sdks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: "21", cache: maven, cache-dependency-path: "sangam/**/pom.xml" }
      - name: Build + test sdks/java
        working-directory: sangam
        run: |
          if [ ! -f sdks/java/pom.xml ]; then echo "::notice::sdks/java not present"; exit 0; fi
          mvn -B -ntp -pl sdks/java -am -DskipITs verify
      - name: JDK 25 compatibility (R5)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: "25" }
      - working-directory: sangam
        run: |
          if [ ! -f sdks/java/pom.xml ]; then exit 0; fi
          mvn -B -ntp -pl sdks/java -am -DskipITs verify

  java-native:
    # R7: native-light worker (GraalVM CE, no GraalJS). Offline smoke on the executable is the build evidence.
    name: Java SDK native-light worker
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          java-version: "25"
          distribution: graalvm-community
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Native metadata matches the SDK model
        run: python3 -I sangam/deploy/native/sdk-worker/generate_native_config.py --check
      - name: Build native executable
        working-directory: sangam
        run: |
          mvn -B -ntp -DskipTests -pl sdks/java -am install
          mvn -B -ntp -DskipTests -f deploy/native/sdk-worker/pom.xml -Pnative package
      - name: Smoke
        working-directory: sangam/deploy/native/sdk-worker/target
        run: |
          ./sangam-sdk-worker --smoke | tee native-smoke.txt
          ls -l sangam-sdk-worker >> native-smoke.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-worker-evidence
          path: sangam/deploy/native/sdk-worker/target/native-smoke.txt
      - name: Image build (no push)
        working-directory: sangam
        run: docker buildx build -f deploy/docker/sdk-worker-native.Dockerfile --load -t sangam-sdk-worker:ci .

  dotnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        run: if [ -d sangam/sdks/dotnet ] && find sangam/sdks/dotnet -name "*.csproj" | grep -q .; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::sdks/dotnet not present"; fi
        shell: bash
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        id: sdk
        if: steps.d.outputs.present == 'true'
        with: { dotnet-version: "8.0.404" }
      - if: steps.d.outputs.present == 'true'
        working-directory: sangam/sdks/dotnet
        run: |
          # Use the SDK installed above: without a global.json the runner's preinstalled, newer SDK (10.x) is picked,
          # and its "dotnet pack -o <relative dir>" fails with MSB1009 (reproduced with mcr.microsoft.com/dotnet/sdk:10.0).
          dotnet new globaljson --force --sdk-version "${{ steps.sdk.outputs.dotnet-version }}" --roll-forward latestPatch
          dotnet --version
          dotnet restore --locked-mode
          dotnet build --no-restore -c Release
          dotnet test --no-build -c Release --logger trx
          # Pack the one packable project: pack on the .sln (examples are IsPackable=false) with -o fails, MSB1009.
          dotnet pack src/Sangam.Sdk/Sangam.Sdk.csproj --no-build -c Release -o ../../../out/dotnet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.d.outputs.present == 'true'
        with: { name: sdk-dotnet, path: out/dotnet, if-no-files-found: error }

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        shell: bash
        run: if [ -f sangam/sdks/python/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::sdks/python not present"; fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.d.outputs.present == 'true'
        with: { python-version: "${{ matrix.python }}" }
      - if: steps.d.outputs.present == 'true'
        working-directory: sangam/sdks/python
        run: |
          # CR-18: pytest, build and the build backend (setuptools, wheel) come from one hashed file; the SDK itself has
          # no runtime dependency, so the editable install and the build run without build isolation and fetch nothing.
          python -m pip install --disable-pip-version-check -q --require-hashes --no-deps -r ../../deploy/licence/ci-req-python-sdk.txt
          python -m pip install --disable-pip-version-check -q --no-build-isolation --no-deps -e .
          python -m pytest -q
          python -m build --no-isolation -o ../../../out/python

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        shell: bash
        run: if [ -f sangam/sdks/typescript/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::sdks/typescript not present"; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.d.outputs.present == 'true'
        with: { node-version: "22.18.0", cache: npm, cache-dependency-path: sangam/sdks/typescript/package-lock.json }
      - if: steps.d.outputs.present == 'true'
        working-directory: sangam/sdks/typescript
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run --if-present lint
          npm run build
          npm test --if-present
          mkdir -p ../../../out/ts
          npm pack --pack-destination ../../../out/ts

  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        shell: bash
        run: if [ -f sangam/sdks/php/composer.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::sdks/php not present"; fi
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: steps.d.outputs.present == 'true'
        with: { php-version: "8.3", tools: "composer:2.8.3", coverage: none }
      - if: steps.d.outputs.present == 'true'
        working-directory: sangam/sdks/php
        run: |
          composer validate --strict
          # no composer.lock in a library: the exact phpunit is pinned here (composer update --with, Composer >= 2.2)
          composer update --no-interaction --prefer-dist --with phpunit/phpunit:11.5.0
          vendor/bin/phpunit

  # M-027 framework adapters (the FastAPI adapter is deferred past 0.1.0, decision 131: no job). Each uses only the toolchain and versions of its SDK job above; no new actions.
  dotnet-hosting:
    name: .NET Sangam.Sdk.Hosting adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        shell: bash
        run: if [ -f sangam/sdks/dotnet/src/Sangam.Sdk.Hosting/Sangam.Sdk.Hosting.csproj ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Sangam.Sdk.Hosting not present"; fi
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        id: sdk
        if: steps.d.outputs.present == 'true'
        with: { dotnet-version: "8.0.404" }
      - if: steps.d.outputs.present == 'true'
        working-directory: sangam/sdks/dotnet
        run: |
          # same SDK pin as the dotnet job (global.json, see there); Microsoft.AspNetCore.App is a framework reference
          dotnet new globaljson --force --sdk-version "${{ steps.sdk.outputs.dotnet-version }}" --roll-forward latestPatch
          dotnet restore --locked-mode tests/Sangam.Sdk.Tests/Sangam.Sdk.Tests.csproj
          dotnet build --no-restore -c Release tests/Sangam.Sdk.Tests/Sangam.Sdk.Tests.csproj
          dotnet test --no-build -c Release tests/Sangam.Sdk.Tests/Sangam.Sdk.Tests.csproj --filter "FullyQualifiedName~Sangam.Sdk.Tests.Hosting" --logger trx
          # decision 132 (C-17): Sangam.Sdk.Hosting stays source only in 0.1.0; tested here, never packed or published

  typescript-nestjs:
    name: TypeScript NestJS adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        shell: bash
        run: if [ -f sangam/sdks/typescript-nestjs/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::sdks/typescript-nestjs not present"; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.d.outputs.present == 'true'
        with: { node-version: "22.18.0", cache: npm, cache-dependency-path: sangam/sdks/typescript/package-lock.json }
      - if: steps.d.outputs.present == 'true'
        working-directory: sangam/sdks
        run: |
          # The adapter has no dependencies of its own to install: TypeScript and @types/node come from the SDK's lockfile
          # (npm ci there) and @sangam/sdk is this tree's SDK build. @nestjs is a peer dependency the adapter never imports.
          (cd typescript && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          cd typescript-nestjs
          mkdir -p node_modules/@sangam
          ln -sfn ../../../typescript node_modules/@sangam/sdk
          TSC=../typescript/node_modules/typescript/bin/tsc
          TYPES=../typescript/node_modules/@types
          node "$TSC" -p tsconfig.check.json --noEmit --typeRoots "$TYPES"
          node "$TSC" -p tsconfig.json --typeRoots "$TYPES"
          node "$TSC" -p test/tsconfig.json --typeRoots "$TYPES"
          node --test build-test/test/*.test.js

  codegen:
    # M-020: the typed surface of all five Tier-1 SDKs is generated from the contract; a stale tree fails here.
    name: SDK surface is generated from the contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13.7" }
      - name: Generator check and unit tests
        run: |
          set -euo pipefail
          # CR-18: PyYAML pinned by hash into this setup-python interpreter (not --user), the same file as ci-build.yml
          python -m pip install --disable-pip-version-check -q --require-hashes --no-deps \
            -r sangam/deploy/licence/ci-python-requirements.txt
          python sangam/sdks/codegen/generate_sdk_surface.py --check
          python -m unittest discover -s sangam/sdks/codegen -p "test_*.py" -v

  tier2-go:
    # M-022 (ADR-D-4 Tier 2): generated Go client (openapi-generator, pinned in generate_tier2.py) + the worker helper.
    name: Tier-2 Go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Decisions 190 and 260: CI Go 1.27.4 (module floor go 1.26, built by tier2-go-floor), the official go.dev tarball
      # checked against its published SHA-256 (DOWNLOADS-WAVE4.md, go.dev release index read 2026-11-13T03:26:25Z).
      GO_VERSION: "1.27.4"
      GO_SHA256: "7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840"
      GOTOOLCHAIN: local   # never switch to another toolchain than the verified one
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Go toolchain from go.dev (SHA-256 verified)
        run: |
          set -euo pipefail
          f="go${GO_VERSION}.linux-amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 -sS -o "$RUNNER_TEMP/$f" "https://go.dev/dl/$f"
          echo "${GO_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/$f"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/go/bin/go" version | grep -F "go${GO_VERSION} linux/amd64"
      - name: Worker helper (vet + tests)
        working-directory: sangam/sdks/go
        run: |
          go vet ./...
          go test ./...
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: "21" }
      - name: Fetch openapi-generator-cli 7.10.0 (Maven Central, strict checksum)
        run: |
          mvn -B -ntp -C org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy             -Dartifact=org.openapitools:openapi-generator-cli:7.10.0 -DoutputDirectory="$RUNNER_TEMP/oag"
      - name: Generate and build the Go client
        run: |
          set -euo pipefail
          python3 sangam/sdks/tier2/generate_tier2.py --jar "$RUNNER_TEMP/oag/openapi-generator-cli-7.10.0.jar" --lang=go
          cd sangam/sdks/tier2/out/go
          # openapi-generator 7.10.0 writes a oneOf model (the request body of receiveDltDeliveryReports) that imports
          # gopkg.in/validator.v2 and a go.mod that does not require it: "no required module provides package
          # gopkg.in/validator.v2". The module is added at one exact version; Go checks it against the checksum
          # database, and the line below against the h1 hash the generator's own go.sum template names for v2.0.1.
          if grep -rqF --include='*.go' '"gopkg.in/validator.v2"' . && ! grep -qF 'gopkg.in/validator.v2' go.mod; then
            go get gopkg.in/validator.v2@v2.0.1
            grep -Fxq 'gopkg.in/validator.v2 v2.0.1 h1:xF0KWyGWXm/LM2G1TrEjqOu4pa6coO9AlWSf3msVfDY=' go.sum
          fi
          go build ./...

  tier2-go-floor:
    # Decisions 252 and 260: the declared floor (go.mod "go 1.26") is exercised with the latest Go 1.26.x, the official
    # go.dev tarball checked against its published SHA-256 (DOWNLOADS-WAVE4.md, go.dev release index read
    # 2026-11-13T03:26:25Z). Builds and vets the Go SDK; tests and the generated client run on 1.27.4 in tier2-go.
    name: Tier-2 Go floor (1.26)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GO_VERSION: "1.26.11"
      GO_SHA256: "9849f4e04ee35303714e34fbc3ac8ab44ea3e448a95aa182f91e3b9b79c710ec"
      GOTOOLCHAIN: local   # never switch to another toolchain than the verified one
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Go toolchain from go.dev (SHA-256 verified)
        run: |
          set -euo pipefail
          f="go${GO_VERSION}.linux-amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 -sS -o "$RUNNER_TEMP/$f" "https://go.dev/dl/$f"
          echo "${GO_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/$f"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/go/bin/go" version | grep -F "go${GO_VERSION} linux/amd64"
      - name: Build and vet sdks/go
        working-directory: sangam/sdks/go
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...

  tier2-rust:
    name: Tier-2 Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Worker helper (tests)
        working-directory: sangam/sdks/rust/sangam-worker
        # RM-46, CR-18: the tracked Cargo.lock is authoritative; no fallback that would ignore it (W4-M REQUEST 16:47:50Z)
        run: cargo test --locked
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: "21" }
      - name: Fetch openapi-generator-cli 7.10.0 (Maven Central, strict checksum)
        run: |
          mvn -B -ntp -C org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy             -Dartifact=org.openapitools:openapi-generator-cli:7.10.0 -DoutputDirectory="$RUNNER_TEMP/oag"
      - name: Generate and build the Rust client
        run: |
          python3 sangam/sdks/tier2/generate_tier2.py --jar "$RUNNER_TEMP/oag/openapi-generator-cli-7.10.0.jar" --lang=rust
          cd sangam/sdks/tier2/out/rust && cargo build

  tier2-kotlin:
    name: Tier-2 Kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: "21", cache: maven, cache-dependency-path: "sangam/**/pom.xml" }
      - name: Kotlin extensions over the Java SDK
        working-directory: sangam
        run: |
          mvn -B -ntp -pl sdks/java -am -DskipTests install
          mvn -B -ntp -C -f sdks/kotlin/pom.xml verify
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with: { gradle-version: "8.10.2" }
      - name: Fetch openapi-generator-cli 7.10.0 (Maven Central, strict checksum)
        run: |
          mvn -B -ntp -C org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy             -Dartifact=org.openapitools:openapi-generator-cli:7.10.0 -DoutputDirectory="$RUNNER_TEMP/oag"
      - name: Generate and build the Kotlin client
        run: |
          python3 sangam/sdks/tier2/generate_tier2.py --jar "$RUNNER_TEMP/oag/openapi-generator-cli-7.10.0.jar" --lang=kotlin
          gradle -p sangam/sdks/tier2/out/kotlin assemble

  ac08:
    # IX.8 AC-08 (M-023): Java, .NET, Python, Node and PHP workers against one server (H2 profile, compose), same
    # lease, idempotency and error semantics, identical T18 values.
    name: AC-08 cross-language workers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: "25", cache: maven, cache-dependency-path: "sangam/**/pom.xml" }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        id: dotnet
        with: { dotnet-version: "8.0.404" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13.7" }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: "8.3", tools: "composer:2.8.3", coverage: none }
      - name: Build the server jar and the Java SDK worker
        working-directory: sangam
        run: |
          mvn -B -ntp -pl sangam-server,sdks/java -am -DskipTests package
          mvn -B -ntp -pl sdks/java -DskipTests test-compile dependency:build-classpath -Dmdep.outputFile=target/ac08-cp.txt
      - name: Start the AC-08 server (compose, H2, dev token)
        working-directory: sangam
        run: docker compose -f sdks/conformance/ac08/compose.yaml up -d --build
      - name: Build the other workers
        working-directory: sangam/sdks
        run: |
          (cd dotnet && dotnet new globaljson --force --sdk-version "${{ steps.dotnet.outputs.dotnet-version }}" --roll-forward latestPatch && dotnet build examples/Ac08Worker -c Release)
          python -m pip install --disable-pip-version-check -q --require-hashes --no-deps -r ../deploy/licence/ci-req-python-sdk.txt
          python -m pip install --disable-pip-version-check -q --no-build-isolation --no-deps -e python
          (cd typescript && npm ci --ignore-scripts --no-audit --no-fund && npx tsc -p examples/tsconfig.json)
          (cd php && composer install --no-interaction --prefer-dist --no-dev)
      - name: Run the harness
        working-directory: sangam
        env:
          AC08_CMD_DOTNET: dotnet run --no-build -c Release --project dotnet/examples/Ac08Worker
          AC08_CMD_PYTHON: python python/examples/ac08_worker.py
          AC08_CMD_TYPESCRIPT: node typescript/build-examples/examples/ac08-worker.js
          AC08_CMD_PHP: php php/examples/ac08-worker.php
        run: |
          # the classpath file holds the dependency jars joined by ':'; expand it into the Java command
          cp="$(cat sdks/java/target/ac08-cp.txt)"
          export AC08_CMD_JAVA="java -cp java/target/classes:java/target/test-classes:${cp} org.sangam.sdk.conformance.Ac08Worker"
          python sdks/conformance/ac08/run_ac08.py --base-url http://127.0.0.1:18080 --token ac08-development-token --require-all
      - name: Server log on failure
        if: failure()
        working-directory: sangam
        run: docker compose -f sdks/conformance/ac08/compose.yaml logs --tail=400
      - name: Stop the server
        if: always()
        working-directory: sangam
        run: docker compose -f sdks/conformance/ac08/compose.yaml down -v
