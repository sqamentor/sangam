# SPDX-License-Identifier: Apache-2.0
# Tier-1 SDKs (ADR-D-4): Java, .NET, Python, TypeScript/Node, PHP. Each job builds and runs the SDK's unit /
# contract tests (T01-T04, T18 against a mock of sangam-rest/api/sangam-api.yaml). A job is skipped with a notice
# when its SDK directory does not exist yet.
name: sdks

on:
  push:
    branches: [main]
    paths: ["sangam/sdks/**", "sangam/sangam-rest/api/**", ".github/workflows/sdks.yml"]
  pull_request:
    paths: ["sangam/sdks/**", "sangam/sangam-rest/api/**", ".github/workflows/sdks.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: sdks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven, cache-dependency-path: "sangam/**/pom.xml" }
      - name: Build + test sdks/java
        working-directory: sangam
        run: |
          if [ ! -f sdks/java/pom.xml ]; then echo "::notice::sdks/java not present"; exit 0; fi
          mvn -B -ntp -pl sdks/java -am -DskipITs verify
      - name: JDK 25 compatibility (R5)
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - working-directory: sangam
        run: |
          if [ ! -f sdks/java/pom.xml ]; then exit 0; fi
          mvn -B -ntp -pl sdks/java -am -DskipITs verify

  dotnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: if [ -d sangam/sdks/dotnet ] && find sangam/sdks/dotnet -name "*.csproj" | grep -q .; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::sdks/dotnet not present"; fi
        shell: bash
      - uses: actions/setup-dotnet@v4
        if: steps.d.outputs.present == 'true'
        with: { dotnet-version: "8.0.x" }
      - if: steps.d.outputs.present == 'true'
        working-directory: sangam/sdks/dotnet
        run: |
          dotnet restore
          dotnet build --no-restore -c Release
          dotnet test --no-build -c Release --logger trx
          dotnet pack --no-build -c Release -o ../../../out/dotnet
      - uses: actions/upload-artifact@v4
        if: steps.d.outputs.present == 'true'
        with: { name: sdk-dotnet, path: out/dotnet, if-no-files-found: ignore }

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - id: d
        shell: bash
        run: if [ -f sangam/sdks/python/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::sdks/python not present"; fi
      - uses: actions/setup-python@v5
        if: steps.d.outputs.present == 'true'
        with: { python-version: "${{ matrix.python }}" }
      - if: steps.d.outputs.present == 'true'
        working-directory: sangam/sdks/python
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[test]" || python -m pip install -e .
          python -m pytest -q
          python -m build -o ../../../out/python

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: d
        shell: bash
        run: if [ -f sangam/sdks/typescript/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::sdks/typescript not present"; fi
      - uses: actions/setup-node@v4
        if: steps.d.outputs.present == 'true'
        with: { node-version: "22", cache: npm, cache-dependency-path: sangam/sdks/typescript/package-lock.json }
      - if: steps.d.outputs.present == 'true'
        working-directory: sangam/sdks/typescript
        run: |
          npm ci --no-audit --no-fund
          npm run --if-present lint
          npm run build
          npm test --if-present
          npm pack --pack-destination ../../../out/ts

  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: d
        shell: bash
        run: if [ -f sangam/sdks/php/composer.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::sdks/php not present"; fi
      - uses: shivammathur/setup-php@v2
        if: steps.d.outputs.present == 'true'
        with: { php-version: "8.3", tools: composer:v2, coverage: none }
      - if: steps.d.outputs.present == 'true'
        working-directory: sangam/sdks/php
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist
          vendor/bin/phpunit
