# SPDX-License-Identifier: Apache-2.0
# Static analysis (CodeQL: Java, JavaScript/TypeScript) and OWASP Dependency-Check (fails on CVSS >= 7).
# NVD_API_KEY (repository secret) makes the NVD download fast; without it the scan still runs, slowly.
name: security

on:
  push:
    branches: [main]
    paths: ["sangam/**", ".github/workflows/security.yml"]
  pull_request:
    paths: ["sangam/**", ".github/workflows/security.yml"]
  schedule:
    - cron: "0 23 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - name: Detect sources
        id: d
        shell: bash
        run: |
          if [ "${{ matrix.language }}" = "javascript-typescript" ]; then
            if [ -f sangam/sangam-ui/package.json ] || [ -f sangam/sdks/typescript/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::no JS/TS sources yet"; fi
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with: { distribution: temurin, java-version: "25", cache: maven, cache-dependency-path: "sangam/**/pom.xml" }
      - uses: github/codeql-action/init@v3
        if: steps.d.outputs.present == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - spike/**
              - reference/**
              - "**/node_modules/**"
              - "**/target/**"
      - name: Build (Java)
        if: matrix.language == 'java-kotlin'
        working-directory: sangam
        run: mvn -B -ntp -DskipTests compile test-compile
      - uses: github/codeql-action/analyze@v3
        if: steps.d.outputs.present == 'true'
        with:
          category: /language:${{ matrix.language }}

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25", cache: maven, cache-dependency-path: "sangam/**/pom.xml" }
      - name: NVD data cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: dependency-check aggregate
        working-directory: sangam
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B -ntp -DskipTests install
          mvn -B -ntp org.owasp:dependency-check-maven:12.1.3:aggregate \
            -DfailBuildOnCVSS=7 -Dformats=HTML,SARIF,JSON -DskipTestScope=true -DskipProvidedScope=true \
            -DassemblyAnalyzerEnabled=false -DossindexAnalyzerEnabled=false \
            -DsuppressionFile=deploy/licence/dependency-check-suppressions.xml \
            ${NVD_API_KEY:+-DnvdApiKey=$NVD_API_KEY}
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('sangam/target/dependency-check-report.sarif') != ''
        with:
          sarif_file: sangam/target/dependency-check-report.sarif
          category: dependency-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: sangam/target/dependency-check-report.*
          if-no-files-found: ignore
