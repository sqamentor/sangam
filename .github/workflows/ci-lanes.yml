# SPDX-License-Identifier: Apache-2.0
# Lane builds on GitHub Actions: level 2 of the build strategy (owner decisions 411 and 412; sangam/docs/CI-LANES.md).
# A lane pushes a test-only branch ci/<lane>-<shortsha> (sangam/tools/ci/route_build.py); main and tags stay behind
# the owner-signed push gate and never trigger this workflow. The run selection (modules, databases, IT chunks, UI)
# comes from the dispatch inputs, else from ci-lane.json at the repository root, else the defaults of
# sangam/tools/ci/ci_plan.py, which AWS CodeBuild (level 3, sangam/tools/ci/aws/buildspec.yml) reads too.
# No secrets. Vendor database terms (decision 122) come only from the repository variables db-matrix.yml uses; a leg
# whose terms are not accepted fails with the reason, it never passes silently (RM-12).
name: ci-lanes

on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:
    inputs:
      modules:
        description: "Comma-separated Maven modules for the build job (-pl ... -am); empty = ci-lane.json or whole reactor"
        default: ""
      dbs:
        description: "Comma-separated: postgres,oracle,sqlserver,sqlserver2025,mysql (empty = ci-lane.json or postgres)"
        default: ""
      chunks:
        description: "IT chunks: A-contracts,B-engine,B2-e2,C-e16a,D-e16bc,E-e17,F-platform or all"
        default: ""
      ui:
        description: "Run the UI job (true/false)"
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-lanes-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -ntp
  TZ: UTC

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_it: ${{ steps.plan.outputs.has_it }}
      ui: ${{ steps.plan.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute plan
        id: plan
        env:
          IN_MODULES: ${{ inputs.modules }}
          IN_DBS: ${{ inputs.dbs }}
          IN_CHUNKS: ${{ inputs.chunks }}
          IN_UI: ${{ inputs.ui }}
        run: |
          python3 -I sangam/tools/ci/ci_plan.py --modules "$IN_MODULES" --dbs "$IN_DBS" --chunks "$IN_CHUNKS" \
            --ui "$IN_UI" --file ci-lane.json --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

  deps:
    # Single writer of the shared Maven cache (.github/actions/maven-cache) for this run. Root cause of the Maven
    # Central HTTP 429 failures (2026-11-18): each ci/* branch is a new cache scope that sees only main's caches, and
    # main had no Maven cache, so build + every IT leg cold-fetched ~290 MiB and the wrapper distribution in parallel.
    # This job resolves once; build and the IT legs wait for it and restore read-only.
    name: Maven dependencies (cache writer)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: sangam
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25.0.5+8"
      - uses: ./.github/actions/maven-cache
        with:
          save: "true"
      - name: Resolve dependencies and plugins once (all IT profiles)
        # test-compile lets the reactor resolve sibling modules; go-offline then resolves every dependency and plugin
        # of every module, including the IT profiles' (failsafe, JDBC drivers, Testcontainers modules).
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/actions/maven-cache/resolve-once.sh" -DskipTests -Psangam-db-it,sangam-it-only,oracle-it test-compile dependency:go-offline
      - name: Maven fetch count (Maven Central 429 evidence)
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/actions/maven-cache/fetch-count.sh"

  build:
    name: Build + unit tests (H2)
    needs: [plan, deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sangam
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25.0.5+8"
      - uses: ./.github/actions/maven-cache
      - name: Maven verify (unit tests on H2)
        env:
          IN_MODULES: ${{ inputs.modules }}
          IN_DBS: ${{ inputs.dbs }}
          IN_CHUNKS: ${{ inputs.chunks }}
          IN_UI: ${{ inputs.ui }}
        run: |
          set -euo pipefail
          mapfile -t args < <(python3 -I tools/ci/ci_plan.py --modules "$IN_MODULES" --dbs "$IN_DBS" \
            --chunks "$IN_CHUNKS" --ui "$IN_UI" --file ../ci-lane.json --print-build-args)
          [ "${#args[@]}" -gt 0 ] || { echo "ci_plan refused the selection (see its message above); nothing built"; exit 2; }
          echo "mvnw ${args[*]}"
          bash ./mvnw $MAVEN_ARGS "${args[@]}"
      - name: Maven fetch count (Maven Central 429 evidence)
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/actions/maven-cache/fetch-count.sh"
      - name: Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: |
            sangam/**/target/surefire-reports/
            sangam/**/target/failsafe-reports/
          if-no-files-found: error
          retention-days: 14

  it:
    name: IT ${{ matrix.db }}
    needs: [plan, deps]
    if: needs.plan.outputs.has_it == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SANGAM_IT_DB: ${{ matrix.db }}
      TESTCONTAINERS_RYUK_DISABLED: "false"
      # Decision 122: operator acceptance of vendor database terms (repository variables), passed through unchanged.
      SANGAM_ACCEPT_ORACLE_FREE_TERMS: ${{ vars.SANGAM_ACCEPT_ORACLE_FREE_TERMS }}
      SANGAM_ACCEPT_MSSQL_EULA: ${{ vars.SANGAM_ACCEPT_MSSQL_EULA }}
    defaults:
      run:
        working-directory: sangam
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vendor terms accepted by the operator (decision 122)
        run: |
          var=$(python3 -I tools/ci/ci_plan.py --file ../ci-lane.json --db "${{ matrix.db }}" --print-terms)
          if [ -n "$var" ] && [ "${!var}" != "Y" ]; then
            echo "::error::repository variable $var is not set to Y: the operator has not accepted the vendor terms of the ${{ matrix.db }} image (decision 122)"
            exit 1
          fi
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25.0.5+8"
      - uses: ./.github/actions/maven-cache
      - name: Free disk space for large DB images
        if: matrix.db == 'oracle' || matrix.db == 'sqlserver' || matrix.db == 'sqlserver2025'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Pull database image (timed)
        run: |
          set -euo pipefail
          ref=$(python3 -I tools/ci/ci_plan.py --file ../ci-lane.json --db "${{ matrix.db }}" --print-image)
          start=$(date +%s)
          docker pull "$ref"
          case "$ref" in *@sha256:*) docker tag "$ref" "${ref%@sha256:*}" ;; esac
          echo "image ${{ matrix.db }} $ref pulled in $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Integration tests on ${{ matrix.db }}
        env:
          IN_MODULES: ${{ inputs.modules }}
          IN_DBS: ${{ inputs.dbs }}
          IN_CHUNKS: ${{ inputs.chunks }}
          IN_UI: ${{ inputs.ui }}
        run: |
          set -euo pipefail
          mapfile -t args < <(python3 -I tools/ci/ci_plan.py --modules "$IN_MODULES" --dbs "$IN_DBS" \
            --chunks "$IN_CHUNKS" --ui "$IN_UI" --file ../ci-lane.json --db "${{ matrix.db }}" --print-it-args)
          [ "${#args[@]}" -gt 0 ] || { echo "ci_plan refused the selection (see its message above); nothing built"; exit 2; }
          echo "mvnw ${args[*]}"
          bash ./mvnw $MAVEN_ARGS "${args[@]}"
      - name: Maven fetch count (Maven Central 429 evidence)
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/actions/maven-cache/fetch-count.sh"
      - name: Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: it-${{ matrix.db }}-reports
          path: |
            sangam/**/target/surefire-reports/
            sangam/**/target/failsafe-reports/
          if-no-files-found: error
          retention-days: 14

  ui:
    name: UI unit tests + Playwright Chromium
    needs: plan
    if: needs.plan.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sangam/sangam-ui
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: sangam/sangam-ui/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Playwright Chromium (browser install + spec listing; the full stack e2e runs in ui.yml)
        # The lockfile's @playwright/test binary, as in ui.yml (no npm command that could fetch a package: Scorecard
        # PinnedDependencies, round 9).
        run: |
          set -euo pipefail
          test -f node_modules/@playwright/test/package.json || { echo "::error::@playwright/test is not installed from package-lock.json"; exit 1; }
          ./node_modules/.bin/playwright install --with-deps chromium
          ./node_modules/.bin/playwright test --config playwright.config.ts --project=chromium --list
