# SPDX-License-Identifier: Apache-2.0
# Database test matrix, SANGAM.md CF-11 (supersedes "all Tier-1 on every PR"):
#   every PR      : PostgreSQL + each affected Tier-1 DB when the change touches dialect-specific SQL, mappings or
#                   migrations (shared migrations/mappings -> all Tier-1);
#   nightly       : full Tier-1 matrix (PostgreSQL, Oracle, SQL Server, MySQL 8.4 - ARCHITECTURE.md 1.5);
#   weekly        : Tier 2 (MariaDB) - R17; Db2 is unsupported (SL-114) and its leg is NOT-RUN with a LIC-3 reason (SL-112);
#   release       : full Tier-1 matrix, mandatory (VIII.9 condition 2) - called by release.yml.
# Images and settings = the Stage B Testcontainers set (spike/RUN-QUEUE.md): postgres:17, Oracle Free 23,
# SQL Server 2022 with READ_COMMITTED_SNAPSHOT ON, MySQL 8.4 with READ-COMMITTED / utf8mb4.
# SG-05: lane sqlserver2025 (SQL Server dialect and profile on mcr.microsoft.com/mssql/server:2025-CU10-ubuntu-24.04,
# the image AcceptanceDatabase uses) runs nightly and on request as tier "1-candidate": it is report-only (its ledger
# line is NOT-RUN, never PASS) until its acceptance run is green and deploy/SUPPORT-MATRIX.md declares it.
# M-108 (decisions 156 and 323): lane yugabytedb (YugabyteDB YSQL through the PostgreSQL driver) is tier
# "experimental": nightly and on request, report-only and never gating, and it runs only sangam-engine's YugabyteDbIT
# (the guard, the product changelog and the identity-order probe on a real server), not the server acceptance suite.
# Its image must be pinned by digest (SANGAM_IT_IMAGE_YUGABYTEDB = <repo>:<tag>@sha256:<64 hex>); until it is, the lane
# writes NOT-RUN with that reason and pulls nothing.
# Q22 (owner 2026-11-12): the DB legs run only the database ITs (failsafe, profile sangam-it-only); the unit tests run
# once, in ci-build.yml. SG-16: every leg records its provenance (commit, JDK, test-JVM zone, database).
#
# Vendor database terms (decision 122): this workflow never accepts a vendor's terms by itself. A lane whose image
# comes under vendor terms runs only when the repository operator has set the matching repository variable to Y
# (exactly Y, as SANGAM_ACCEPT_MSSQL_EULA=Y in compose and AcceptanceDatabase; integrator ruling, decision 180):
#   oracle                   SANGAM_ACCEPT_ORACLE_FREE_TERMS   (Oracle Database Free container image)
#   sqlserver, sqlserver2025 SANGAM_ACCEPT_MSSQL_EULA          (Microsoft SQL Server container image EULA)
#   db2                      SANGAM_ACCEPT_DB2_COMMUNITY_TERMS (IBM Db2 Community Edition image)
# The variable is passed to the test JVM under the same name. Without it the lane writes NOT-RUN with the reason,
# so a pull request shows it and a release (which needs PASS) fails. Oracle JDBC (ojdbc) comes only from the CI
# profile oracle-it (decision 123), which the Oracle lane activates; it is never in a shipped scope (LIC-2; SL-110).
# Every leg writes a results-ledger line db-<db> (CR-01); the result job fails on FAIL, SKIPPED, BLOCKED or a
# missing line, so a skipped leg is never a pass (RM-12).
name: db-matrix

on:
  pull_request:
    paths: ["sangam/**", ".github/workflows/db-matrix.yml"]
  schedule:
    - cron: "30 20 * * *"   # nightly 02:00 IST: Tier-1
    - cron: "30 21 * * 6"   # weekly Sunday 03:00 IST: Tier-2
  workflow_dispatch:
    inputs:
      dbs:
        description: "Comma-separated: postgres,oracle,sqlserver,sqlserver2025,mysql,mariadb,db2,yugabytedb"
        default: "postgres,oracle,sqlserver,mysql"
        required: true
  workflow_call:
    inputs:
      dbs:
        type: string
        default: "postgres,oracle,sqlserver,mysql"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: db-matrix-${{ github.ref }}-${{ github.event_name }}-${{ inputs.dbs || github.event.schedule || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MAVEN_ARGS: -B -ntp
  TZ: UTC
  LEDGER: ${{ github.workspace }}/results
  RL: python3 -I ${{ github.workspace }}/sangam/deploy/licence/results_ledger.py

jobs:
  plan:
    name: Plan DB matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      dbs: ${{ steps.plan.outputs.dbs }}
      planned: ${{ steps.plan.outputs.planned }}
      has_legs: ${{ steps.plan.outputs.has_legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared:
              - 'sangam/sangam-persistence/**'
              - 'sangam/**/*.sql'
              - 'sangam/**/db/changelog/**'
              - 'sangam/**/mappings/**'
              - 'sangam/**/*Mapping*.xml'
              - 'sangam/**/*Dialect*.java'
              - 'sangam/**/dialect/**'
              - 'sangam/**/LeaseTable*.java'
              - 'sangam/sangam-engine/PATCHES.md'
              - 'sangam/pom.xml'
            oracle:
              - 'sangam/**/oracle/**'
              - 'sangam/**/*[Oo]racle*'
            sqlserver:
              - 'sangam/**/sqlserver/**'
              - 'sangam/**/mssql/**'
              - 'sangam/**/*[Ss]ql[Ss]erver*'
              - 'sangam/**/*[Mm]ssql*'
            mysql:
              - 'sangam/**/mysql/**'
              - 'sangam/**/*[Mm]y[Ss]ql*'
              - 'sangam/**/*[Mm]aria*'
      - name: Compute matrix
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_DBS: ${{ inputs.dbs }}
          CH_SHARED: ${{ steps.changes.outputs.shared }}
          CH_ORACLE: ${{ steps.changes.outputs.oracle }}
          CH_SQLSERVER: ${{ steps.changes.outputs.sqlserver }}
          CH_MYSQL: ${{ steps.changes.outputs.mysql }}
        run: |
          python3 -I - <<'PY'
          import json, os
          ev = os.environ["EVENT"]; sched = os.environ.get("SCHEDULE", ""); given = os.environ.get("INPUT_DBS", "")
          tier1 = ["postgres", "oracle", "sqlserver", "mysql"]
          candidates = ["sqlserver2025"]   # SG-05: reported, not gating, until declared in SUPPORT-MATRIX
          experimental = ["yugabytedb"]    # M-108, decisions 156 and 323: reported, never gating
          if given.strip():
              dbs = [d.strip() for d in given.split(",") if d.strip()]
              why = "explicit input"
          elif ev == "schedule" and sched == "30 21 * * 6":
              dbs, why = ["mariadb", "db2"], "weekly Tier-2"
          elif ev == "schedule":
              dbs, why = tier1 + candidates + experimental, "nightly Tier-1 + candidates + experimental"
          elif ev == "pull_request":
              if os.environ.get("CH_SHARED") == "true":
                  dbs, why = tier1, "PR touches shared SQL / mappings / migrations"
              else:
                  dbs = ["postgres"] + [d for d, k in (("oracle", "CH_ORACLE"), ("sqlserver", "CH_SQLSERVER"), ("mysql", "CH_MYSQL")) if os.environ.get(k) == "true"]
                  why = "PR: PostgreSQL + affected dialects"
          else:
              dbs, why = ["postgres"], "default"
          allowed = set(tier1 + candidates + experimental + ["mariadb", "db2"])
          bad = [d for d in dbs if d not in allowed]
          if bad:
              raise SystemExit(f"unknown database(s): {bad}")
          tier = {"postgres": "1", "oracle": "1", "sqlserver": "1", "sqlserver2025": "1-candidate", "mysql": "1",
                  "mariadb": "2", "db2": "unsupported", "yugabytedb": "experimental"}
          planned = list(dict.fromkeys(dbs))
          inc = [{"db": d, "tier": tier[d]} for d in planned if d != "db2"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": inc}) + "\n")
              f.write("dbs=" + ",".join(d["db"] for d in inc) + "\n")
              f.write("planned=" + ",".join(planned) + "\n")
              f.write("has_legs=" + ("true" if inc else "false") + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### DB matrix ({why})\n\n" + "\n".join(f"- {d} (Tier {tier[d]})" for d in planned) + "\n")
          PY
      - name: Db2 lane is NOT-RUN (LIC-3, SL-112, SL-114)
        # Db2 needs the IBM Db2 JCC driver, which is customer-supplied (LIC-3): this build never fetches it, so the
        # lane cannot run here. It is recorded as NOT-RUN with the reason, never as a pass.
        if: contains(format(',{0},', steps.plan.outputs.planned), ',db2,')
        run: |
          $RL record --check db-db2 --ledger-dir "$LEDGER" --status NOT-RUN --reason "Db2 is unsupported (SL-114); the IBM Db2 JCC driver is customer-supplied (LIC-3) and never fetched by this build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(format(',{0},', steps.plan.outputs.planned), ',db2,')
        with:
          name: ledger-db-db2
          path: results/
          if-no-files-found: error

  test:
    name: DB ${{ matrix.db }}
    needs: plan
    if: needs.plan.outputs.has_legs == 'true'   # an empty matrix (only db2 requested) is not a valid matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # Read by the Sangam integration-test base classes (same images as spike Databases.java).
      SANGAM_IT_DB: ${{ matrix.db }}
      SANGAM_IT_IMAGE_POSTGRES: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
      SANGAM_IT_IMAGE_ORACLE: gvenzl/oracle-free:23-slim-faststart@sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093
      SANGAM_IT_IMAGE_SQLSERVER: mcr.microsoft.com/mssql/server:2022-latest@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
      # SG-05: must equal AcceptanceDatabase's sqlserver2025 image
      SANGAM_IT_IMAGE_SQLSERVER2025: mcr.microsoft.com/mssql/server:2025-CU10-ubuntu-24.04@sha256:245f6b1c8903edae52cb20fa31419cefcde1a49938bb8c3447099011fc871ca3
      SANGAM_IT_IMAGE_MYSQL: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
      SANGAM_IT_IMAGE_MARIADB: mariadb:11.4@sha256:5e73baf8179b29f115101bb102763a47a017361f3e9792daccba6646c3ab1532
      SANGAM_IT_IMAGE_DB2: icr.io/db2_community/db2:12.1.2.0@sha256:9cc0d21df5d86cd9a5ce1c65c390dc10d56b1d38ab6e992c8a08eda677368781
      # M-108: YugabyteDB YSQL, pinned by digest (<repo>:<tag>@sha256:<64 hex>). Not pinned yet: the digest needs a
      # registry lookup, which the integrator does; while this is empty the lane is NOT-RUN and pulls nothing.
      SANGAM_IT_IMAGE_YUGABYTEDB: ""
      TESTCONTAINERS_RYUK_DISABLED: "false"
      # Decision 122: operator acceptance of vendor database terms, passed through to the test JVM unchanged.
      SANGAM_ACCEPT_ORACLE_FREE_TERMS: ${{ vars.SANGAM_ACCEPT_ORACLE_FREE_TERMS }}
      SANGAM_ACCEPT_MSSQL_EULA: ${{ vars.SANGAM_ACCEPT_MSSQL_EULA }}
      SANGAM_ACCEPT_DB2_COMMUNITY_TERMS: ${{ vars.SANGAM_ACCEPT_DB2_COMMUNITY_TERMS }}
      REPORT_ONLY: ${{ (matrix.tier == '1-candidate' || matrix.tier == 'experimental') && '--report-only' || '' }}
    defaults:
      run:
        working-directory: sangam
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vendor terms accepted by the operator (decision 122)
        id: terms
        run: |
          case "${{ matrix.db }}" in
            oracle) var=SANGAM_ACCEPT_ORACLE_FREE_TERMS ;;
            sqlserver|sqlserver2025) var=SANGAM_ACCEPT_MSSQL_EULA ;;
            *) var="" ;;
          esac
          if [ "${{ matrix.db }}" = yugabytedb ] && ! printf '%s' "$SANGAM_IT_IMAGE_YUGABYTEDB" | grep -Eq '^[^@[:space:]]+:[^@[:space:]]+@sha256:[0-9a-f]{64}$'; then
            # M-108: an experimental image is run only when pinned by digest; never pulled by tag alone
            echo "run=false" >> "$GITHUB_OUTPUT"
            $RL record --check "db-${{ matrix.db }}" --ledger-dir "$LEDGER" --status NOT-RUN \
              --reason "SANGAM_IT_IMAGE_YUGABYTEDB is not pinned by digest (<repo>:<tag>@sha256:<64 hex>): M-108 runs no unpinned image"
          elif [ -z "$var" ] || [ "${!var}" = "Y" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            $RL record --check "db-${{ matrix.db }}" --ledger-dir "$LEDGER" --status NOT-RUN \
              --reason "repository variable $var is not set to Y: the operator has not accepted the vendor terms of this database image (decision 122)"
          fi
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.terms.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "25.0.5+8"
      - uses: ./.github/actions/maven-cache
      - name: Free disk space for large DB images
        if: steps.terms.outputs.run == 'true' && (matrix.db == 'oracle' || matrix.db == 'sqlserver' || matrix.db == 'sqlserver2025')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Pre-pull database image
        if: steps.terms.outputs.run == 'true'
        run: |
          img_var="SANGAM_IT_IMAGE_$(echo '${{ matrix.db }}' | tr a-z A-Z)"
          ref="${!img_var}"
          docker pull "$ref"
          # RM-33: a <name>:<tag>@sha256:<digest> pin is pulled by its digest and tagged <name>:<tag>, the name the
          # integration tests ask Testcontainers for (AcceptanceDatabase), which then runs exactly the pinned image
          case "$ref" in *@sha256:*) docker tag "$ref" "${ref%@sha256:*}" ;; esac
      - name: Provenance (start)
        if: steps.terms.outputs.run == 'true'
        run: python3 -I tools/provenance/run_provenance.py start --db "${{ matrix.db }}" --out target/run-provenance
      - name: Integration tests on ${{ matrix.db }}
        if: steps.terms.outputs.run == 'true'
        run: |
          # Decision 123: ojdbc comes only from the CI profile oracle-it, which only this lane activates.
          # No Db2 JCC driver is declared anywhere: LIC-3 makes it customer-supplied.
          # Q22: sangam-it-only skips the surefire unit tests (they run in ci-build.yml); failsafe ITs still run.
          profiles=sangam-db-it,sangam-it-only
          [ "${{ matrix.db }}" = oracle ] && profiles="$profiles,oracle-it"
          if [ "${{ matrix.db }}" = yugabytedb ]; then
            # M-108: only YugabyteDbIT (sangam-engine), and the report must show it ran with nothing skipped: an
            # assumption skip is never a result (RM-12). Report-only (REPORT_ONLY), never gating.
            # shellcheck disable=SC2086
            $RL run --check db-yugabytedb --ledger-dir "$LEDGER" $REPORT_ONLY -- bash -c '
              set -euo pipefail
              mvn $MAVEN_ARGS verify -pl sangam-engine -am -P"'"$profiles"'" -Dsangam.db=yugabytedb \
                -Dit.test=YugabyteDbIT -Dfailsafe.failIfNoSpecifiedTests=false
              r=sangam-engine/target/failsafe-reports/TEST-org.sangam.engine.db.YugabyteDbIT.xml
              [ -f "$r" ] || { echo "::error::YugabyteDbIT wrote no report"; exit 1; }
              grep -Eq "<testsuite[^>]* skipped=\"0\"" "$r" && ! grep -Eq "<testsuite[^>]* tests=\"0\"" "$r" \
                || { echo "::error::YugabyteDbIT was skipped or ran no test"; exit 1; }'
            exit 0
          fi
          # shellcheck disable=SC2086
          $RL run --check "db-${{ matrix.db }}" --ledger-dir "$LEDGER" $REPORT_ONLY -- \
            mvn $MAVEN_ARGS verify -P"$profiles" -Dsangam.db=${{ matrix.db }}
      - name: Oracle AI Vector Search equivalence (sangam-ai profile oracle-it, decisions 170 and 207)
        # OracleVectorIndexEquivalenceTest needs SANGAM_AI_ORACLE_URL and an account that may create and drop users,
        # so this step starts its own Oracle Free container (same image and terms gate as the lane) with a random
        # SYSTEM password, runs only that test, and fails unless the report shows it ran with nothing skipped: an
        # assumption skip is never a pass (RM-12).
        if: steps.terms.outputs.run == 'true' && matrix.db == 'oracle'
        run: |
          set -euo pipefail
          pw="Sg$(openssl rand -hex 12)1"
          echo "::add-mask::$pw"
          docker run -d --name sangam-ai-oracle -p 127.0.0.1:1522:1521 -e ORACLE_PASSWORD="$pw" "$SANGAM_IT_IMAGE_ORACLE" > /dev/null
          for _ in $(seq 1 120); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' sangam-ai-oracle)" = healthy ] && break
            sleep 5
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' sangam-ai-oracle)" = healthy ] \
            || { echo "::error::Oracle Free for the sangam-ai equivalence test did not become healthy"; exit 1; }
          export SANGAM_AI_ORACLE_URL="jdbc:oracle:thin:@//127.0.0.1:1522/FREEPDB1" SANGAM_AI_ORACLE_USER=system SANGAM_AI_ORACLE_PASSWORD="$pw"
          $RL run --check db-oracle-ai-vector --ledger-dir "$LEDGER" -- bash -c '
            set -euo pipefail
            mvn $MAVEN_ARGS -pl sangam-ai -am test -Poracle-it -Dsangam.db=oracle \
              -Dtest=OracleVectorIndexEquivalenceTest -Dsurefire.failIfNoSpecifiedTests=false
            r=sangam-ai/target/surefire-reports/TEST-org.sangam.ai.rag.OracleVectorIndexEquivalenceTest.xml
            [ -f "$r" ] || r=$(ls sangam-ai/target/surefire-reports/TEST-*OracleVectorIndexEquivalenceTest.xml)
            grep -Eq "<testsuite[^>]* skipped=\"0\"" "$r" && ! grep -Eq "<testsuite[^>]* tests=\"0\"" "$r" \
              || { echo "::error::OracleVectorIndexEquivalenceTest was skipped or ran no test"; exit 1; }'
          docker rm -f sangam-ai-oracle > /dev/null
      - name: Provenance (finish)
        if: always() && steps.terms.outputs.run == 'true'
        run: |
          python3 -I tools/provenance/run_provenance.py finish --db "${{ matrix.db }}" --out target/run-provenance \
            --reports . --summary "$GITHUB_STEP_SUMMARY"
      - name: Reports
        if: always() && steps.terms.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-${{ matrix.db }}-reports
          path: |
            sangam/**/target/surefire-reports/
            sangam/**/target/failsafe-reports/
            sangam/target/run-provenance/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ledger-db-${{ matrix.db }}
          path: results/
          if-no-files-found: error

  result:
    name: DB matrix result
    needs: [plan, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: sangam/deploy/licence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ledger-db-*
          path: results
      - name: Gate (every planned database has a ledger line; FAIL, SKIPPED or BLOCKED fails)
        env:
          PLANNED: ${{ needs.plan.outputs.planned }}
        run: |
          [ "${{ needs.plan.result }}" = "success" ] || { echo "::error::the plan job did not succeed"; exit 1; }
          python3 -I -c "import json,os; json.dump({'planned': ['db-' + d for d in os.environ['PLANNED'].split(',') if d]}, open('planned.json', 'w'))"
          $RL gate --required planned.json --mode pr --set planned --ledger-dir results
