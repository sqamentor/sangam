# M-094 local Semgrep rule. Test cases: sangam-secret-in-log.java (semgrep --test).
# Matches a logger call whose argument is a variable, field or getter named like a secret. String literals are not
# matched ("token refreshed" is a message, not a secret). Known noise: names such as tokenCount; triage decides.
rules:
  - id: sangam-secret-in-log
    languages: [java]
    severity: ERROR
    message: >-
      A value named like a secret ($ARG) is passed to the logger. Never log credentials, tokens or keys; log a
      fingerprint or an id instead (runtime secrets come only through the secret-provider SPI).
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owner: M-094
    patterns:
      - pattern: $LOG.$LEVEL(..., $ARG, ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)^\w*(log|logger)$
      - metavariable-regex:
          metavariable: $LEVEL
          regex: ^(trace|debug|info|warn|error)$
      - metavariable-regex:
          metavariable: $ARG
          regex: (?i)^[a-z_][a-z0-9_.]*(password|passwd|secret|token|apikey|api_key|credential|privatekey)[a-z0-9_]*(\(\))?$
