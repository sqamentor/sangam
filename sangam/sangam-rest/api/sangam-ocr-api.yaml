      summary: Recognise the text of an image
      description: 'Recognises the text of one PNG, JPEG or TIFF image in the requested languages. The bearer token is checked first: missing
        or wrong is 401 (WWW-Authenticate: Bearer) and the body is not read. The body limit is SANGAM_OCR_MAX_BYTES (default 33554432 bytes, 32
        MiB) and the pixel limit SANGAM_OCR_MAX_PIXELS (default 100000000); processing time and concurrent recognitions are limited too.'
      x-sangam-roles: []
      parameters:
      - name: lang
        in: query
        required: true
        description: 'Comma-separated language codes (Tesseract traineddata names), for example eng,hin: given once, each well-formed, distinct
          and offered by the sidecar (SANGAM_OCR_LANGUAGES, default eng,hin)'
        schema:
