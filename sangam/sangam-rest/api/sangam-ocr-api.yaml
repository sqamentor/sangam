                type: string
              description: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrError'
        '413':
          description: The body is larger than the byte limit, or the image has more pixels than the pixel limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrError'
        '415':
          description: The body is not a PNG, JPEG or TIFF image, or not the declared image type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrError'
        '422':
          description: The image size cannot be read, or the engine cannot read the image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrError'
        '500':
          description: The engine failed or gave no text
