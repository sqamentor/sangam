openapi: 3.1.0
info:
  title: Sangam OCR sidecar
  version: 0.1.0
  summary: Internal OCR service for scanned documents (owner decisions 167 and 153)
  description: 'One stateless JDK HTTP server in its own container (Tesseract); it never stores or logs the image or the text. Only authorised
    callers reach its private port (the Sangam server: sangam.ocr.url / SANGAM_OCR_URL), over HTTPS directly or through an authenticated mesh.
    Every recognition request is authenticated with a bearer token before the image is read (decision 153); the token only authenticates the caller,
    user permissions and tenant ownership stay in the caller. The client fails closed: 400, 413, 415 and 422 are a refusal of the image (OcrRejected);
    no URL, no token, a timeout, 401, 500, 503, any other status or an answer of another shape is OcrUnavailable. Every error answer is `application/json`
    `{"error": ...}` and never contains a token; another method on a known path is 405, an unknown path 404.'
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: /
  description: The OCR container (SANGAM_OCR_PORT, default 8086), HTTPS
security:
- bearerAuth: []
tags:
- name: Recognition
  description: Text recognition of one image
- name: Health
  description: Container probe
