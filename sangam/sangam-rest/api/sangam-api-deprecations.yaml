    to: "requestBody ComplianceDefinePurposeRequest: basis, standardsAttested and active required; no version; dataItems of ComplianceDataItemRequest with code and sensitive required"
    reason: "PurposeDefinition has primitive standardsAttested, version, active and DataItem.sensitive, and the server's JSON binding refuses a missing primitive (400), so a body without them never worked (CI ui e2e run 43717963671 on 209d2765: the e2e seed and the officer form both failed); the attestations are now explicit, version is the server's"
    decision: "integrator ruling 2026-11-15 to lane D1 (0.1.0 unreleased; owner rules: fail closed, never default a legal attestation)"
