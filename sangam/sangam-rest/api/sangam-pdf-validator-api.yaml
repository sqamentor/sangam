# Sangam PDF validator contract (OpenAPI 3.1). Generated by sangam-rest/api/gen_openapi.py from api/apps/pdf_validator.py; do not edit.
openapi: 3.1.0
info:
  title: Sangam PDF validator
  version: 0.1.0
  summary: Internal PDF/A-2b and PDF/UA-1 validation service (owner decisions 114, 119 and 153)
  description: 'One stateless JDK HTTP server in its own container; it never stores or logs the PDF it is sent. Only authorised callers reach
    its private port (the Sangam server: sangam.pdf.validator.url / SANGAM_PDF_VALIDATOR_URL), over HTTPS directly or through an authenticated
    mesh. Every validation request is authenticated with a bearer token before the PDF is read (decision 153); the token only authenticates the
    caller, user permissions and tenant ownership stay in the caller. The client fails closed: no URL, no token, a timeout, a refused connection,
    any status other than 200 or a malformed or inconsistent report make PDF output answer 422 FORMAT_NOT_AVAILABLE in the server, never an unvalidated
    PDF. Every error answer is `application/json` `{"error": ...}` and never contains a token; another method on a known path is 405 with `Allow`,
    an unknown path 404.'
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: /
  description: The validator container (SANGAM_PDF_VALIDATOR_PORT, default 8085), HTTPS
security:
- bearerAuth: []
tags:
- name: Validation
  description: PDF/A and PDF/UA conformance of a rendered PDF
- name: Health
  description: Container probe
paths:
  /v1/validate:
    post:
      operationId: validatePdf
      tags:
      - Validation
      summary: Validate a PDF
      description: 'Checks the PDF in the body against every requested conformance level. The bearer token is checked first: missing or wrong
        is 401 and the body is not read. The body limit is SANGAM_PDF_VALIDATOR_MAX_BYTES (default 67108864 bytes, 64 MiB); a declared Content-Length
        over it is refused before the body is read. Processing time, concurrent validations and temporary storage are limited too.'
      x-sangam-roles: []
      parameters:
      - name: conformance
        in: query
        required: true
        style: form
        explode: false
        description: Comma-separated conformance levels, for example PDF_A_2B,PDF_UA_1; the parameter may be given once
        schema:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - PDF_A_2B
            - PDF_UA_1
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '400':
          description: conformance missing, given more than once, or naming an unknown level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorError'
        '401':
          description: No bearer token, or a token the validator does not accept; nothing was read
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorError'
        '413':
          description: The PDF is larger than the limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorError'
        '500':
          description: The validator failed or gave no report; the client refuses the PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorError'
        '503':
          description: Not ready (no token configured), busy (concurrency limit, with Retry-After), past the processing-time limit, or stopping;
            nothing was validated and the client refuses the PDF
          headers:
            Retry-After:
              schema:
                type: string
              description: Seconds; sent when busy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorError'
  /health:
    get:
      operationId: pdfValidatorHealth
      tags:
      - Health
      summary: Health probe
      description: For container probes; no token, and the answer carries no secret. 200 UP when a token is configured, otherwise 503 NOT_READY.
      x-sangam-roles: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorHealth'
        '503':
          description: 'Not ready: no token configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorHealth'
      security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Validator token (decision 153): a strong random value injected through secret configuration, never hard-coded, committed,
        sent to a browser or placed in a URL, log or error. Distinct tokens per caller are preferred; a single shared token cannot tell callers
        apart and is given to the Sangam server only. The validator accepts each configured token (two during a rotation, the new one and the
        old one) and stops accepting a token as soon as it is removed: there is no permanent fallback token. With no token configured the validator
        is not ready and refuses every validation (503). A demo uses the same mechanism with its own synthetic token. Tokens are read from a token
        file (secret mount), never from the command line.'
  schemas:
    ValidatorError:
      type: object
      description: Error answer of the validator.
      required:
      - error
      properties:
        error:
          type: string
    ValidationReport:
      type: object
      description: The validation report; ok is true only when findings is empty. Findings are conformance results only; authentication and processing
        errors are never reported as findings.
      required:
      - ok
      - validator
      - checked
      - findings
      properties:
        ok:
          type: boolean
        validator:
          type: string
          description: Name and version of the validator that checked the PDF
        checked:
          type: array
          items:
            type: string
            enum:
            - PDF_A_2B
            - PDF_UA_1
          description: The conformance levels checked, sorted by name
        findings:
          type: array
          items:
            type: string
          description: Failed rules; empty when ok
    ValidatorHealth:
      type: object
      description: 'Probe answer: the status only (no validator name).'
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - NOT_READY
          description: NOT_READY while no token is configured
