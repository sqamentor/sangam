    ChannelEvent:
      name: ChannelEvent
      title: Event-registry outbound event
      contentType: application/json
      summary: Outbox type sangam.event.<eventKey> (OutboundEventService), one ordered delivery per outbound channel.
      payload:
        $ref: '#/components/schemas/ChannelEventEnvelope'
      x-sangam-event-type-pattern: ^sangam\.event\..+$
      x-sangam-transport-headers:
        http: ChannelHttpHeaders
        kafka: record key messageId (or the tenant, recordKey=tenant); headers message-id, event-key, tenant-id
        jms: JMSCorrelationID messageId; properties messageId, eventKey, tenantId
        rabbitmq: properties messageId, contentType application/json, deliveryMode 2; headers event-key, tenant-id
    RollupEvent:
      name: RollupEvent
      title: Roll-up stream event
