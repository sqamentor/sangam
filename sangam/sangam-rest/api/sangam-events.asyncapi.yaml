asyncapi: 3.0.0
info:
  title: Sangam events
  version: 0.1.0
  description: 'Events Sangam sends from its transactional outbox (VI.2) and receives from brokers (R16, R38). Delivery is at least once: receivers
    deduplicate on the event id (CloudEvents `id`, `Idempotency-Key`). Events of one root keep their order on ordered destinations. Channel addresses
    are outbox destination names; each operation says how the relay delivers them. Audit event names (X.4.0.3) are published as the `AuditEventName`
    schema.'
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
defaultContentType: application/json
channels:
  webhook:
    address: webhook:{name}
    title: Webhook subscription
    description: 'Outbox destination webhook:<name> (WebhooksWiring). Any outbox event routed there is POSTed to the subscription''s URL in CloudEvents
      binary mode. Outcomes: 2xx done; 400, 404, 413, 415 and 422 permanent; 410 permanent and the subscription is disabled; 429 and 503 with
      Retry-After deferred (at most 1 h); anything else retried. Case, programme and field events reach a webhook through sangam.<module>.events.forward-to;
      other events through sangam.integration.default-destinations.'
    parameters:
      name:
        description: The configured name
    messages:
      WebhookCaseFileEvent:
        $ref: '#/components/messages/WebhookCaseFileEvent'
      WebhookProgrammeReturnCampaignStarted:
        $ref: '#/components/messages/WebhookProgrammeReturnCampaignStarted'
      WebhookProgrammeReturnSubmitted:
        $ref: '#/components/messages/WebhookProgrammeReturnSubmitted'
      WebhookProgrammeReturnReasoned:
        $ref: '#/components/messages/WebhookProgrammeReturnReasoned'
      WebhookProgrammeReturnAccepted:
        $ref: '#/components/messages/WebhookProgrammeReturnAccepted'
      WebhookProgrammeAlertRaised:
        $ref: '#/components/messages/WebhookProgrammeAlertRaised'
      WebhookProgrammeAlertEscalated:
        $ref: '#/components/messages/WebhookProgrammeAlertEscalated'
      WebhookProgrammeDashboardSnapshot:
        $ref: '#/components/messages/WebhookProgrammeDashboardSnapshot'
      WebhookFieldEvent:
        $ref: '#/components/messages/WebhookFieldEvent'
      WebhookHistoryEvent:
        $ref: '#/components/messages/WebhookHistoryEvent'
      WebhookPipelineEvent:
        $ref: '#/components/messages/WebhookPipelineEvent'
      WebhookProcessEvent:
        $ref: '#/components/messages/WebhookProcessEvent'
      WebhookRegistryEvent:
        $ref: '#/components/messages/WebhookRegistryEvent'
  channel:
    address: channel:{channelKey}
    title: Event-registry outbound channel
    description: 'Outbox destination channel:<channelKey> (OutboundEventService, ChannelPublisher): the channel''s deployed definition picks the
      transport (http, webhook, kafka, jms, rabbitmq) and the serializer.'
    parameters:
      channelKey:
        description: The event-registry channel key
    messages:
      ChannelEvent:
        $ref: '#/components/messages/ChannelEvent'
  rollupNational:
    address: rollup:national
    title: National roll-up stream
    description: 'Cell to roll-up (RollupPublisher): POST to the roll-up''s /api/v1/ingest (sangam-rollup-api.yaml ingestRollupEvents). A 4xx
      other than 408 and 429 is a poison event; anything else is retried.'
    messages:
      RollupEvent:
        $ref: '#/components/messages/RollupEvent'
  crossCell:
    address: xcell:{targetTenant}
    title: Cross-cell message
    description: 'Outbox destination xcell:<target tenant> (CrossCellPublisher): POST {gateway}/api/v1/messages. 2xx and 409 (already processed)
      are done; other 4xx except 408 and 429 are poison; anything else retried.'
    parameters:
      targetTenant:
        description: Tenant that receives the message
    messages:
      CrossCellMessage:
        $ref: '#/components/messages/CrossCellMessage'
  inbox:
    address: '{inboxTopic}'
    title: Broker inbox
    description: Inbound Kafka and JMS messages (KafkaInboxConsumer, JmsInboxListener) mapped by InboundMapper and deduplicated in the inbox (R38).
      Inbound HTTP events use sangam-api.yaml POST /events/{channel}.
    parameters:
      inboxTopic:
        description: The configured topic or queue
    messages:
      InboundEvent:
        $ref: '#/components/messages/InboundEvent'
operations:
  deliverWebhook:
    action: send
    channel:
      $ref: '#/channels/webhook'
    summary: Deliver an outbox event to a webhook subscription
    messages:
    - $ref: '#/channels/webhook/messages/WebhookCaseFileEvent'
    - $ref: '#/channels/webhook/messages/WebhookProgrammeReturnCampaignStarted'
    - $ref: '#/channels/webhook/messages/WebhookProgrammeReturnSubmitted'
    - $ref: '#/channels/webhook/messages/WebhookProgrammeReturnReasoned'
    - $ref: '#/channels/webhook/messages/WebhookProgrammeReturnAccepted'
    - $ref: '#/channels/webhook/messages/WebhookProgrammeAlertRaised'
    - $ref: '#/channels/webhook/messages/WebhookProgrammeAlertEscalated'
    - $ref: '#/channels/webhook/messages/WebhookProgrammeDashboardSnapshot'
    - $ref: '#/channels/webhook/messages/WebhookFieldEvent'
    - $ref: '#/channels/webhook/messages/WebhookHistoryEvent'
    - $ref: '#/channels/webhook/messages/WebhookPipelineEvent'
    - $ref: '#/channels/webhook/messages/WebhookProcessEvent'
    - $ref: '#/channels/webhook/messages/WebhookRegistryEvent'
    bindings:
      http:
        method: POST
        bindingVersion: 0.3.0
  publishChannelEvent:
    action: send
    channel:
      $ref: '#/channels/channel'
    summary: Publish an event-registry event on its outbound channel
    messages:
    - $ref: '#/channels/channel/messages/ChannelEvent'
  publishRollupEvent:
    action: send
    channel:
      $ref: '#/channels/rollupNational'
    summary: Forward an event to the national roll-up
    messages:
    - $ref: '#/channels/rollupNational/messages/RollupEvent'
    bindings:
      http:
        method: POST
        bindingVersion: 0.3.0
  sendCrossCellMessage:
    action: send
    channel:
      $ref: '#/channels/crossCell'
    summary: Send a business message to a tenant in another cell
    messages:
    - $ref: '#/channels/crossCell/messages/CrossCellMessage'
    bindings:
      http:
        method: POST
        bindingVersion: 0.3.0
  receiveInboundEvent:
    action: receive
    channel:
      $ref: '#/channels/inbox'
    summary: Receive an event from a broker
    messages:
    - $ref: '#/channels/inbox/messages/InboundEvent'
components:
  schemas:
    WebhookHeaders:
      type: object
      description: 'HTTP headers of a webhook delivery (HttpWebhookPublisher): the CloudEvents 1.0 attributes in binary mode (CloudEvents.attributes,
        `ce-` + name), the event id as Idempotency-Key and the HMAC signature. The endpoint''s own static headers are added. The body is the outbox
        payload JSON verbatim.'
      required:
      - ce-specversion
      - ce-id
      - ce-source
      - ce-type
      - Idempotency-Key
      - X-Sangam-Signature
      properties:
        ce-specversion:
          type: string
          description: '1.0'
        ce-id:
          type: string
          description: Outbox event id (UUIDv7); receivers deduplicate on it
        ce-source:
          type: string
          description: urn:sangam:<sangam.installation.id> (default urn:sangam:sangam)
        ce-type:
          type: string
          description: Outbox event type
        ce-subject:
          type: string
          description: Root id
        ce-datacontenttype:
          type: string
          description: application/json
        ce-sangamtenant:
          type: string
          description: Tenant id
        ce-sangamroot:
          type: string
          description: 'Root id: events of one root keep their order on ordered destinations (VI.2)'
        ce-sangamrootseq:
          type: string
          description: Sequence within the root, as a decimal string
        ce-sangamdestination:
          type: string
          description: The outbox destination, webhook:<name>
        Content-Type:
          type: string
          description: application/json
        Idempotency-Key:
          type: string
          description: The event id (same as ce-id)
        X-Sangam-Signature:
          type: string
          description: t=<epoch seconds>,v1=<hex HMAC-SHA256(secret, t + '.' + body)>, one v1 per configured secret (rotation); receivers allow
            5 minutes of clock skew (WebhookSignature)
    ChannelEventEnvelope:
      type: object
      description: Body of an event-registry outbound event with serializer `json` (OutboundEventSerializer.JSON). With serializer `json-payload`
        the body is `payload` alone.
      properties:
        eventKey:
          type: string
        tenantId:
          type: string
        messageId:
          type: string
          description: 'UUIDv5 over tenant, root, event key and operation scope: stable across retries'
        payload:
          type: object
          additionalProperties: true
          description: Only the fields the event definition declares
      required:
      - eventKey
      - tenantId
      - messageId
      - payload
    ChannelHttpHeaders:
      type: object
      description: HTTP headers of an event-registry event on an http or webhook channel (HttpOutboundAdapter).
      properties:
        Content-Type:
          type: string
        Idempotency-Key:
          type: string
          description: The messageId
        X-Sangam-Message-Id:
          type: string
        X-Sangam-Event-Key:
          type: string
        X-Sangam-Signature:
          type: string
          description: sha256=<hex HMAC-SHA256(secret, body)>, only when the channel has a secret (no timestamp)
      required:
      - Idempotency-Key
      - X-Sangam-Message-Id
      - X-Sangam-Event-Key
      additionalProperties: true
    RollupCloudEvent:
      type: object
      description: CloudEvents 1.0, structured JSON (SCALE-ARCHITECTURE section 8). Consumers deduplicate on `id`. A missing or too long id, type,
        sangamcell or sangamtenantpath rejects the event.
      required:
      - id
      - type
      - sangamcell
      - sangamtenantpath
      properties:
        specversion:
          type: string
          description: '1.0'
        id:
          type: string
          maxLength: 64
          description: The outbox event id
        source:
          type: string
          description: sangam://cell/<cell id>
        type:
          type: string
          minLength: 1
          description: The outbox event type, e.g. sangam.history.process.start
        time:
          type: string
          format: date-time
        subject:
          type: string
          description: The root id (same as sangamroot)
        datacontenttype:
          type: string
          description: application/json
        sangamcell:
          type: string
          minLength: 1
          maxLength: 16
          description: Publishing cell id
        sangamtenant:
          type: string
          description: Tenant code; the last path segment when absent
        sangamtenantpath:
          type: string
          minLength: 1
          maxLength: 256
          description: Hierarchy path from the root, /-separated (e.g. IN/RJ/RJ-JPR); every prefix is projected
        sangamroot:
          type: string
          description: 'Root id: per-root order (VI.2)'
        sangamrootseq:
          type: integer
          format: int64
          description: Sequence within the root
        sangamoperationid:
          type: string
          description: Operation id of a cross-cell business message (R36)
        data:
          type: object
          additionalProperties: true
          description: 'Only allow-listed payload fields leave the cell (RollupPublisher.DEFAULT_FIELDS: eventType, processDefinitionKey, taskDefinitionKey,
            activityType, incidentType, durationMs, outcome, amountMinor, currency, category, targetTenant, operationId); no personal data'
