components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Static service token from the app''s token list (`<token>:<ROLE>[,<ROLE>]`), compared in constant time. Roles: ADMIN (tenant
        and cell administration, moves, audit); CELL (register, heartbeat, route and cell reads); GATEWAY (route and cell reads); ROLLUP (route
        and cell reads).'
  responses:
    BadRequest:
      description: 'Invalid request: a body that does not bind, a missing or invalid parameter, or a rule the input breaks'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No bearer token, or a token the service does not know
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The token's roles do not include one of the operation's `x-sangam-roles`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The named resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The current state does not allow the operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details (Spring ProblemDetail). `type` is about:blank unless stated; extra members (for example `field`, the
        JSON path of a body field that does not bind) may follow.
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        field:
          type: string
      additionalProperties: true
    Route:
      type: object
      description: Routing answer for a tenant (org.sangam.controlplane.routing.Route). `routeEpoch` bumps on every change; a gateway drops cached
        routes with a lower epoch. `ttlSeconds` is the cache TTL hint.
      properties:
        tenantCode:
          type: string
        path:
          type: string
          description: The /-joined chain of tenant codes from the root
        cellId:
          type: string
        apiBaseUrl:
          type: string
        state:
          type: string
          enum:
          - ROUTABLE
          - DRAINING
          - MOVING
          - CELL_DOWN
          - UNPLACED
          description: ROUTABLE; DRAINING (writes answer 503 Retry-After); MOVING and CELL_DOWN (503); UNPLACED (no cell)
        routeEpoch:
          type: integer
          format: int64
        ttlSeconds:
          type: integer
          format: int64
        retryAfterSeconds:
          type: integer
          format: int32
    RouteSnapshot:
      type: object
      description: Every route changed after `sinceMs`, with the snapshot time to pass as the next `sinceMs`.
      properties:
        asOfMs:
          type: integer
          format: int64
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
    CellRegistration:
      type: object
      description: 'Cell registration (CellDirectory.Registration). Idempotent; residency is immutable. Capacity defaults: 500 starts/s, 2000
        tenants.'
      properties:
        region:
          type: string
        jurisdiction:
          type: string
        residency:
          type: string
        apiBaseUrl:
          type: string
        adminBaseUrl:
          type: string
        dbVendor:
          type: string
        capacityStartsPerSec:
          type: integer
          format: int32
        capacityTenants:
          type: integer
          format: int32
        version:
          type: string
        dedicatedTenant:
          type: string
          description: 'M-016: tenant code this cell is dedicated to (database-per-tenant instance); absent = shared. A cell registered with it
            hosts only that tenant, and the registration answer echoes it back (a dedicated cell never registers as a shared one)'
      required:
      - apiBaseUrl
      - jurisdiction
      - residency
    CellHeartbeat:
      type: object
      description: Cell heartbeat (CellDirectory.Heartbeat). Missing numbers count as 0.
      properties:
        status:
          type: string
          description: UP (default), DEGRADED or DRAINING, case-insensitive
        startsPerSec:
          type: number
          format: double
        p99CommandMs:
          type: number
          format: double
        activeNodes:
          type: integer
          format: int32
        dbPoolUsagePct:
          type: number
          format: double
        outboxFillPct:
          type: number
          format: double
        tenants:
          type: integer
          format: int64
        version:
          type: string
    Cell:
      type: object
      description: Cell directory entry (org.sangam.controlplane.cells.Cell). `status` is the reported status (UP, DEGRADED, DRAINING), DOWN (no
        heartbeat within the timeout) or RETIRED; `placementOpen` is the administrative switch.
      properties:
        cellId:
          type: string
        region:
          type: string
        jurisdiction:
          type: string
        residency:
          type: string
        apiBaseUrl:
          type: string
        adminBaseUrl:
          type: string
        dbVendor:
          type: string
        capacityStartsPerSec:
          type: integer
          format: int32
        capacityTenants:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - UP
          - DEGRADED
          - DRAINING
          - DOWN
          - RETIRED
        placementOpen:
          type: boolean
        startsPerSec:
          type: number
          format: double
        p99CommandMs:
          type: number
          format: double
        activeNodes:
          type: integer
          format: int32
        dbPoolUsagePct:
          type: number
          format: double
        outboxFillPct:
          type: number
          format: double
        tenantsReported:
          type: integer
          format: int64
        version:
          type: string
        lastHeartbeatMs:
          type: integer
          format: int64
        registeredAtMs:
          type: integer
          format: int64
        dedicatedTenant:
          type: string
          description: 'M-016: tenant code this cell is dedicated to (database-per-tenant instance); absent = shared. A cell registered with it
            hosts only that tenant, and the registration answer echoes it back (a dedicated cell never registers as a shared one)'
    CreateTenantRequest:
      type: object
      description: A new tenant node (ControlPlaneController.CreateTenant). jurisdiction and residency are inherited from the parent when absent
        and required for a root; residency must lie within the parent's. `place` (default true) places the tenant on a cell right away.
      properties:
        tenantCode:
          type: string
        parentCode:
          type: string
        levelKind:
          type: string
          description: Hierarchy level name (data, ADR-D-20); default ORG
        name:
          type: string
        jurisdiction:
          type: string
        residency:
          type: string
        sector:
          type: string
        expectedStartsPerSec:
          type: number
          format: double
        place:
          type: boolean
        isolation:
          type: string
          enum:
          - SHARED
          - SCHEMA
          - DATABASE
          description: 'M-016 (decision 97): SHARED (default), SCHEMA or DATABASE. A DATABASE tenant is placed only on the cell dedicated to it;
            SHARED and SCHEMA tenants on shared cells'
      required:
      - tenantCode
    Tenant:
      type: object
      description: A tenant node of the n-level hierarchy (org.sangam.controlplane.registry.Tenant). `cellId` is set for placed tenants.
      properties:
        tenantCode:
          type: string
        parentCode:
          type: string
        path:
          type: string
        depth:
          type: integer
          format: int32
        levelKind:
          type: string
        name:
          type: string
        jurisdiction:
          type: string
        residency:
          type: string
        sector:
          type: string
        expectedStartsPerSec:
          type: number
          format: double
        cellId:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - DRAINING
          - MOVING
          - RETIRED
        routeEpoch:
          type: integer
          format: int64
        createdAtMs:
          type: integer
          format: int64
        updatedAtMs:
          type: integer
          format: int64
        isolation:
          type: string
          enum:
          - SHARED
          - SCHEMA
          - DATABASE
          description: 'M-016 (decision 97): SHARED (default), SCHEMA or DATABASE. A DATABASE tenant is placed only on the cell dedicated to it;
            SHARED and SCHEMA tenants on shared cells'
    PlacementCandidate:
      type: object
      description: A cell that can host the tenant (PlacementService.Candidate), best first.
      properties:
        cell:
          $ref: '#/components/schemas/Cell'
        affinity:
          type: integer
          format: int32
        headroom:
          type: number
          format: double
        reason:
          type: string
    MoveRequest:
      type: object
      description: Start a tenant move (ControlPlaneController.MoveRequest). Without `targetCell` the placement service picks one; the reason
        is audited.
      properties:
        targetCell:
          type: string
        reason:
          type: string
      required:
      - reason
    TenantMove:
      type: object
      description: A tenant move (org.sangam.controlplane.move.TenantMove).
      properties:
        moveId:
          type: string
        tenantCode:
          type: string
        sourceCell:
          type: string
        targetCell:
          type: string
        state:
          type: string
          enum:
          - REQUESTED
          - PREPARING
          - DRAINING
          - COPYING
          - VERIFYING
          - CUT_OVER
          - RETAINING
          - COMPLETED
          - ROLLING_BACK
          - ROLLED_BACK
          - FAILED
        processInstanceId:
