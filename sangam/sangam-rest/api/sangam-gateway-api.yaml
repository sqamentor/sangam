x-sangam-gateway-problems:
- type: tenant-unresolved
  status: 400
  when: No tenant in the token claim, the host name or the tenant header
- type: tenant-unknown
  status: 404
  when: The tenant is not registered in the control plane
- type: tenant-unplaced
  status: 404
  when: The tenant has no cell (route state UNPLACED)
- type: tenant-overloaded
  status: 429
  when: 'More concurrent requests for the tenant than this gateway node allows (Retry-After: 1)'
- type: routing-unavailable
  status: 503
  when: The route is not cached and the control plane is unreachable
- type: tenant-draining
  status: 503
  when: A write while the tenant is being moved (route state DRAINING); reads still pass
- type: tenant-moving
  status: 503
  when: The tenant is being copied to another cell (route state MOVING)
- type: cell-down
  status: 503
  when: The tenant's cell is down (route state CELL_DOWN)
- type: cell-unreachable
  status: 503
  when: The cell did not answer (connect error or timeout)
- type: tenant-moved
  status: 503
  when: 'The cell answered 421: the tenant moved away; the cached route is dropped (Retry-After: 1)'
