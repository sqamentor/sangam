# SPDX-License-Identifier: Apache-2.0
# Sangam server defaults. Database-specific settings live in application-<profile>.yaml (h2, postgres, oracle, sqlserver, mysql).
server:
  port: ${SANGAM_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never

spring:
  application:
    name: sangam
  profiles:
    default: h2
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    # URL and credentials come from the database profile (SANGAM_DB_URL / SANGAM_DB_USER / SANGAM_DB_PASSWORD)
    hikari:
      # ARCHITECTURE 1.5: READ COMMITTED on every pool (also forced and verified by IsolationGuard)
      transaction-isolation: TRANSACTION_READ_COMMITTED
      auto-commit: true
      maximum-pool-size: ${SANGAM_DB_POOL_SIZE:20}
      pool-name: sangam
  # OIDC: activate the 'oidc' profile with SANGAM_OIDC_ISSUER (application-oidc.yaml), or set
  # spring.security.oauth2.resourceserver.jwt.issuer-uri / jwk-set-uri directly. Left unset here on purpose: an empty
  # issuer would make Spring Boot try to build a JWT decoder.
  servlet:
    # Aligned with sangam.content.max-bytes (audit PR-4/PR-5): one file may be as large as the content limit, the
    # request adds a little room for the other form fields; files above 1 MB spill to disk while the request is read.
    # JSON bodies have no servlet limit: inbound events are bounded by sangam.ports.events.max-payload-bytes (413
    # PAYLOAD_TOO_LARGE), every ports JSON read by Json.MAPPER's 16 MiB document limit, and the Idempotency-Key
    # fingerprint read by 16 MiB.
    multipart:
      max-file-size: ${SANGAM_CONTENT_MAX_FILE:256MB}
      max-request-size: ${SANGAM_CONTENT_MAX_REQUEST:260MB}
      file-size-threshold: 1MB

operaton:
  bpm:
    # VI.4: Operaton's built-in authorization has no deny-wins; Sangam's product authorization is used instead
    authorization:
      enabled: false
    history-level: full
    database:
      schema-update: false
    job-execution:
      # SANGAM_JOB_EXECUTOR_ENABLED=false for API-only pods; disabled automatically in one-shot Liquibase modes.
      # The executor stops on context close (graceful shutdown drains it).
      enabled: ${SANGAM_JOB_EXECUTOR_ENABLED:true}
      # SCALE IR-7: the same SANGAM_JOB_* variables and SCALE 3 defaults as sangam-engine's SangamEngineSettings
      # (engine README note 20), so the starter's executor and the engine settings never disagree.
      core-pool-size: ${SANGAM_JOB_CORE_POOL_SIZE:16}
      max-pool-size: ${SANGAM_JOB_MAX_POOL_SIZE:32}
      queue-capacity: ${SANGAM_JOB_QUEUE_CAPACITY:64}
      max-jobs-per-acquisition: ${SANGAM_JOB_MAX_JOBS_PER_ACQUISITION:20}
      wait-time-in-millis: ${SANGAM_JOB_WAIT_TIME_IN_MILLIS:500}
      max-wait: ${SANGAM_JOB_MAX_WAIT:5000}
      lock-time-in-millis: ${SANGAM_JOB_LOCK_TIME_IN_MILLIS:300000}
    default-serialization-format: application/json
    webapp:
      enabled: false
    generic-properties:
      properties:
        enforce-history-time-to-live: false
    # Operaton REST API stays at /engine-rest, behind Sangam authentication (SecurityConfig)

sangam:
  # Module wiring (config/*Wiring); false = the sangam-rest defaults stay active for that module.
  modules:
    engine:
      enabled: ${SANGAM_MODULE_ENGINE:true}
    security:
      enabled: ${SANGAM_MODULE_SECURITY:true}
    integration:
      enabled: ${SANGAM_MODULE_INTEGRATION:true}
    compliance:
      enabled: ${SANGAM_MODULE_COMPLIANCE:true}
  # sangam-compliance (DPDP Act 2023 / Rules 2025, CERT-In). Every key below sangam.compliance is passed to
  # ComplianceConfig (organisation-name, sector, entity-attributes, sla.*, retention.*, logs.*, ntp.*, hosting.*,
  # transfer.*, links.*, authority.<code>.recipients ...). Per tenant: sangam.compliance.tenant.<tenant>.<key>.
  compliance:
    jurisdictions: ${SANGAM_COMPLIANCE_JURISDICTIONS:}
    organisation-name: ${SANGAM_COMPLIANCE_ORGANISATION:}
    tenants: ${SANGAM_COMPLIANCE_TENANTS:${sangam.tenant.default:dev}}
    log-archive:
      root: ${SANGAM_COMPLIANCE_LOG_ARCHIVE:data/compliance-logs}
      country: ${SANGAM_COMPLIANCE_LOG_ARCHIVE_COUNTRY:}
    notify:
      sms-connector: ${SANGAM_COMPLIANCE_SMS_CONNECTOR:sms-dlt-sim}
      email-connector: ${SANGAM_COMPLIANCE_EMAIL_CONNECTOR:smtp}
    authority:
      email-connector: ${SANGAM_COMPLIANCE_AUTHORITY_EMAIL_CONNECTOR:smtp}
      http-connector: ${SANGAM_COMPLIANCE_AUTHORITY_HTTP_CONNECTOR:rest}
    schedule:
      enabled: ${SANGAM_COMPLIANCE_SCHEDULE:true}
      retention-batch: 500
  history:
    # Exactly one writer of history events to the outbox: integration (OutboxHistoryEventHandler, default) | engine
    # (sangam-engine EngineEventSink) | none. sangam-flowable-ports' PortsHistoryEventHandler only feeds the read model.
    outbox-handler: ${SANGAM_HISTORY_OUTBOX_HANDLER:integration}
    read-model-projection: ${SANGAM_HISTORY_READ_MODEL:true}
  engine:
    # sangam-engine settings (SangamEngineSettings); the server runs Liquibase, so no product schema from the engine
    apply-product-schema: false
    apply-engine-patches: true
  integration:
    simulators:
      enabled: false
    background:
      enabled: true
    # <topic>=<connectorId>:<operation> bindings for the connector external-task worker
    topics: ${SANGAM_INTEGRATION_TOPICS:}
    default-destinations: ${SANGAM_OUTBOX_DESTINATIONS:}
    outbox:
      retention: 7d
  outbound:
    # Air-gapped by default (ARCHITECTURE 1.9): no outbound calls from admin tooling (IdP discovery test)
    enabled: false
  # Flowable weakness audit (spike/results/FLOWABLE-WEAKNESS-AUDIT.md, PR-1..PR-5)
  content:
    # Upload limit (413 PAYLOAD_TOO_LARGE, partial object removed) and bound of every download read; default 256 MiB.
    # Keep spring.servlet.multipart.max-file-size equal to it (SANGAM_CONTENT_MAX_FILE).
    max-bytes: ${SANGAM_CONTENT_MAX_BYTES:268435456}
  ports:
    events:
      # Inbound event payload limit (FW-02); larger events are REJECTED with PAYLOAD_TOO_LARGE (413 on REST).
      max-payload-bytes: ${SANGAM_EVENTS_MAX_PAYLOAD_BYTES:1048576}
      # Inbound WEBHOOK/REST channels need config.secretRef (HMAC X-Sangam-Signature) unless this is true (FW-47).
      allow-unsigned-webhooks: false
  compat:
    flowable:
      # Flowable worker compatibility: true accepts calls without the echoed sangamLockVersion, but only with the
      # echoed sangamAttemptId, the lease resolved in the completion's transaction, and every call audited (FW-07).
      allow-unfenced: false
  rest:
    count-cap: 10000
    government-profile: false
    max-async-response-timeout: 30s
    default-lock-duration: 5m
    max-lock-duration: 24h
    batch-four-eyes-threshold: 100
    outbox-budget: 100000
    node: ${SANGAM_INSTANCE_ID:${HOSTNAME:sangam-node}}
  security:
    dev-token:
      enabled: false
    claims:
      audience: ${SANGAM_SECURITY_OIDC_AUDIENCE:sangam-server}
      tenant: ${SANGAM_SECURITY_OIDC_TENANT_CLAIM:tenant}
      roles: ${SANGAM_SECURITY_OIDC_ROLES_CLAIM:roles}
      seats: ${SANGAM_SECURITY_OIDC_SEATS_CLAIM:seats}
      principal: preferred_username
    cors:
      allowed-origins: ${SANGAM_CORS_ORIGINS:}
  # Consumed by sangam-integration (reconciliation scan at start-up, deploy README 4.3).
  reconcile-on-start: ${SANGAM_RECONCILE_ON_START:false}
  keys:
    directory: ${SANGAM_KEYS_DIRECTORY:}
  tenant:
    # Fallback tenant for the DEV TOKEN only; a JWT without a tenant claim is always 401.
    default: ${SANGAM_TENANT_DEFAULT:}
  liquibase:
    # startup | validate | migrate-only | update-sql | release-locks (env SANGAM_LIQUIBASE_MODE)
    mode: ${SANGAM_LIQUIBASE_MODE:startup}
    sql-file: ${SANGAM_LIQUIBASE_SQL_FILE:}
  db:
    require-rcsi: true
  persistence:
    changelog: classpath:db/changelog/sangam-master.yaml
    dev-schema: false
  # SCALE cell (sangam-cell README IR-2..IR-4). The cell is switched on by SANGAM_CELL_ID (sangam.cell.id); it is
  # deliberately not listed here, because an empty value would count as set.
  cell:
    region: ${SANGAM_CELL_REGION:}
    jurisdiction: ${SANGAM_CELL_JURISDICTION:IN}
    residency: ${SANGAM_CELL_RESIDENCY:${SANGAM_CELL_JURISDICTION:IN}}
    public-url: ${SANGAM_CELL_PUBLIC_URL:}
    admin-url: ${SANGAM_CELL_ADMIN_URL:}
    heartbeat-interval: ${SANGAM_CELL_HEARTBEAT_INTERVAL:10s}
    capacity:
      starts-per-sec: ${SANGAM_CELL_CAPACITY_STARTS:500}
      tenants: ${SANGAM_CELL_CAPACITY_TENANTS:2000}
    control-plane:
      url: ${SANGAM_CONTROL_PLANE_URL:}
      token: ${SANGAM_CONTROL_PLANE_TOKEN:}
    rollup:
      ingest-url: ${SANGAM_ROLLUP_INGEST_URL:}
      token: ${SANGAM_ROLLUP_TOKEN:}
    gateway-url: ${SANGAM_GATEWAY_URL:}
    service-token: ${SANGAM_SERVICE_TOKEN:}
    export-dir: ${SANGAM_CELL_EXPORT_DIR:data/cell-exports}
    export-ttl: ${SANGAM_CELL_EXPORT_TTL:2h}
  # IR-6 read replica for analytics, audit and history reads (empty = everything on the primary)
  datasource:
    replica:
      url: ${SANGAM_DB_REPLICA_URL:}
      username: ${SANGAM_DB_REPLICA_USER:${SANGAM_DB_USER:}}
      password: ${SANGAM_DB_REPLICA_PASSWORD:${SANGAM_DB_PASSWORD:}}
      maximum-pool-size: ${SANGAM_DB_REPLICA_POOL:10}

management:
  server:
    # Management (actuator) on its own port; the app stays on 8080
    port: ${SANGAM_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        # also /livez and /readyz on the app port
        add-additional-paths: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    distribution:
      # IR-2 heartbeat: p99 command latency of the cell
      percentiles:
        "[http.server.requests]": 0.99
  opentelemetry:
    resource-attributes:
      service.name: sangam
  otlp:
    tracing:
      # Air-gapped by default (ARCHITECTURE 1.9): no export unless an endpoint is configured
      endpoint: ${SANGAM_OTLP_TRACES_ENDPOINT:}
      export:
        enabled: ${SANGAM_OTLP_ENABLED:false}
    metrics:
      export:
        enabled: ${SANGAM_OTLP_ENABLED:false}

# JSON (ECS) console logs are switched on by the database profiles (postgres, oracle, sqlserver, mysql); h2 keeps plain text.
logging:
  level:
    org.sangam: INFO
    org.operaton.bpm: WARN
