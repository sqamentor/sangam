# Test classpath only (never packaged). Decision 143 (RM-06): every installation states its environment explicitly;
# a start without sangam.security.production is refused. The server test contexts of this module run as a development
# or test installation (the h2 default profile), so they state false here. A test that starts a production context
# passes --sangam.security.production=true as a command-line argument, which outranks this file
# (ProductionStartupFailFastTest); a test of the refusal itself uses the resolver directly (EnvironmentPolicyTest,
# ProductionEnvironmentPolicyTest).
sangam.security.production=false
