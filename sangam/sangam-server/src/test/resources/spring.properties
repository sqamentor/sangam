# SL-67, FLOWABLE-INTO-OPERATON D-10 (one engine per JVM: Operaton's ClockUtil is static). Test classpath only.
#
# Every server test context of this module starts the engine, and the engine refuses to start while another one is
# live in the JVM. Surefire runs all test classes of the module in one JVM, and the test context cache keeps up to 32
# contexts alive by default: one test class that left its context cached made every later class with another
# configuration fail ("a second Sangam engine in one JVM", CI run 42547172757).
#
# So the cache holds ONE context: before it loads another one, Spring closes the least recently used context, which
# releases its engine slot. This holds whether or not a class declares @DirtiesContext. Classes with the same
# configuration still share their context (the acceptance ITs share one per JVM, AbstractAcceptanceIT). A test that
# starts server contexts outside the cache loads an engine-less test context first (EngineSlotReleasedOnContextCloseTest).
spring.test.context.cache.maxSize=1
