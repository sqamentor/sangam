# SPDX-License-Identifier: Apache-2.0
# M-090: makes a SangamInstallation a SCALE cell (sangam-cell IR-1..IR-4; SCALE-ARCHITECTURE.md). Same settings as
# the Helm chart's scale.cell; no product default for the jurisdiction (SL-104). The cell id is immutable once bound.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sangamcells.sangam.io
spec:
  group: sangam.io
  scope: Namespaced
  names:
    kind: SangamCell
    listKind: SangamCellList
    plural: sangamcells
    singular: sangamcell
    shortNames: [sgc]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Cell, type: string, jsonPath: .spec.cellId }
        - { name: Installation, type: string, jsonPath: .spec.installationRef }
        - { name: Phase, type: string, jsonPath: .status.phase }
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [installationRef, cellId, jurisdiction, publicUrl, controlPlaneUrl, rollupIngestUrl, gatewayUrl, existingSecret]
              x-kubernetes-validations:
                - rule: "!has(oldSelf.cellId) || self.cellId == oldSelf.cellId"
                  message: "cellId is immutable: cell ids are never changed or reused"
              properties:
                installationRef: { type: string, description: "Name of the SangamInstallation in this namespace" }
                cellId: { type: string, description: "SANGAM_CELL_ID; format checked by the server (CellId)" }
                region: { type: string }
                jurisdiction: { type: string }
                residency: { type: string, description: "Defaults to the jurisdiction" }
                publicUrl: { type: string }
                adminUrl: { type: string, description: "Defaults to publicUrl" }
                capacity:
                  type: object
                  properties:
                    startsPerSec: { type: integer, minimum: 1, default: 500 }
                    tenants: { type: integer, minimum: 1, default: 2000 }
                controlPlaneUrl: { type: string }
                rollupIngestUrl: { type: string }
                gatewayUrl: { type: string }
                existingSecret: { type: string, description: "Secret with keys controlPlaneToken, rollupToken, serviceToken" }
            status:
              type: object
              properties:
                phase: { type: string, description: "Bound, Unbound, Invalid" }
                message: { type: string }
                observedGeneration: { type: integer }
                cellId: { type: string }
