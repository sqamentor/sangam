#
# Optional example (decision 220): the operations backup console runs YOUR backup scripts on the server host (script
# mode, deploy/README.md section 1.3). Off by default, also with this file: set SANGAM_BACKUP_CONSOLE_SCRIPT_ENABLED=true
# in .env to switch it on.
#
#   docker compose -f docker-compose.yml -f docker-compose.backup-console.yml --profile postgres up -d
#
# What this file adds to the four server services:
#   - the shared run history on the existing backup volume (/backup/console-history, one JSON and one .log per run,
#     the newest 100 per target, a lock file per target); backup-console-init creates it once, owned by the server
#     user (uid 10001) with mode 0770, so it is not writable by others;
#   - your scripts, read-only, at /opt/sangam/backup-scripts (SANGAM_BACKUP_SCRIPTS_DIR, default ./backup-scripts).
# The targets themselves (targets[i].id/name/command[j]/schedule/timeout) go in config/server/application.yaml; the
# README has an example. Sangam ships no backup scripts. Commands run with the server's privileges, so the scripts and
# their directory must not be writable by anyone but their owner. The stock server image has no database client tools
# (pg_dump, mysqldump, sqlcmd, RMAN): build your own image FROM sangam-server with the client your script needs.
# Kubernetes uses the Job mode instead (Helm backup.console); script mode and Kubernetes mode cannot both be on.

x-backup-console-client: &backup-console-client
  depends_on:
    backup-console-init:
      condition: service_completed_successfully
      required: false
  environment:
    SANGAM_BACKUP_CONSOLE_SCRIPT_ENABLED: ${SANGAM_BACKUP_CONSOLE_SCRIPT_ENABLED:-false}
    SANGAM_BACKUP_CONSOLE_SCRIPT_HISTORYDIR: /backup/console-history
    # Comma-separated names of extra environment variables the scripts receive (PATH, HOME, LANG, TZ and the temp
    # variables always pass); empty = none. Never pass a variable that holds a secret the script does not need.
    SANGAM_BACKUP_CONSOLE_SCRIPT_ENVPASSTHROUGH: ${SANGAM_BACKUP_CONSOLE_SCRIPT_ENV_PASSTHROUGH:-}
  volumes:
    - backup:/backup
    - ${SANGAM_BACKUP_SCRIPTS_DIR:-./backup-scripts}:/opt/sangam/backup-scripts:ro

services:
  # One-shot: the shared history directory, owned by the server user (uid 10001, gid 0), mode 0770.
  backup-console-init:
    image: postgres:17
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c", "mkdir -p /backup/console-history && chown 10001:0 /backup/console-history && chmod 0770 /backup/console-history"]
    volumes:
      - backup:/backup
    network_mode: none

  server-postgres: *backup-console-client
  server-oracle: *backup-console-client
  server-sqlserver: *backup-console-client
  server-mysql: *backup-console-client
