# M-091: Sangam alert rules for the compose observability profile (prometheus.yml rule_files). The Helm chart renders
# the same rules as a PrometheusRule (templates/prometheusrule.yaml, thresholds in metrics.prometheusRule.thresholds,
# whose defaults are the literals below); PrometheusAlertRulesTraceTest keeps the two equal. The chart adds a
# cert-manager certificate-expiry rule, which compose has no source for.
# The database gauges report the same value on every server pod, so those rules aggregate with max(); the relay
# heartbeat is per pod and is alerted per instance (NaN when a pod runs no relay, which never fires).
groups:
  - name: sangam
    rules:
      - alert: SangamServerDown
        expr: 'up{job="sangam-server"} == 0'
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The Prometheus scrape of a Sangam server failed for 5 minutes.
      - alert: SangamOutboxDeliveryStale
        expr: 'max(sangam_outbox_oldest_age_seconds{job="sangam-server"}) > 300'
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The oldest undelivered outbox event is older than the threshold.
          description: >-
            The relay is not draining, a destination is down, or an ordered delivery is PARKED and blocks its line
            (SANGAM.md VI.2.3; PARKED rows count as undelivered). Repair a PARKED delivery with requeue or skip.
      - alert: SangamOutboxCapacityHigh
        expr: 'max(sangam_outbox_capacity_used_ratio{job="sangam-server"}) >= 0.5'
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The outbox uses at least the alert share of outboxMaxBytes (R40, SANGAM.md VI.2.4).
          description: >-
            At 0.8 new process starts and inbound events get 503 BACKPRESSURE; at 0.95 only completions and
            cancellations are accepted. Find why the relay does not drain (destinations, PARKED lines) before then.
      - alert: SangamOutboxBackpressure
        expr: 'max(sangam_outbox_capacity_used_ratio{job="sangam-server"}) >= 0.8'
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The outbox is at the BACKPRESSURE level; new starts and inbound events are refused (R40).
      - alert: SangamOutboxDeliveryParked
        expr: 'max(sangam_outbox_parked{job="sangam-server"}) > 0'
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: An ordered outbox delivery is PARKED and blocks later events of its root for that destination.
          description: >-
            SANGAM.md VI.2.3: after the last attempt an ordered delivery is PARKED until an operator repairs it with
            requeue or skip (audited).
      - alert: SangamRelayStalled
        expr: 'sangam_relay_last_cycle_age_seconds{job="sangam-server"} > 60'
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: The outbox relay of one server pod has not completed a cycle within the threshold.
          description: >-
            Per pod. A healthy relay completes a cycle within its 30 s claim lease and then waits at most the 1 s poll
            interval; a failing claim (for example a lost database) does not complete a cycle.
      - alert: SangamRootLockWaitHigh
        expr: 'max by (process) (sangam_engine_root_lock_wait_seconds_max{job="sangam-server"}) > 1'
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A process definition waits on its root lock for more than the threshold.
          description: >-
            A hot root (SANGAM.md VI.1, R3): one root is serialized and is not designed for more than about 50
            state-changing commands per second. Split the busy root, for example with message-started child processes.
      - alert: SangamIncidentsOpen
        expr: 'max(sangam_incidents_open{job="sangam-server"}) > 0'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Operaton incidents are open.
      - alert: SangamReconciliationItemsOpen
        expr: 'max(sangam_reconciliation_items{job="sangam-server", state="OPEN"}) > 0'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Reconciliation items are waiting for an operator.
