#
# Owner decision 113: the admin password of the keycloak-broker-otp one-shot from a compose SECRET FILE instead of the
# KEYCLOAK_ADMIN_PASSWORD variable. Use it for every stack other than local development:
#
#   KEYCLOAK_ADMIN_PASSWORD_SECRET=/secure/path/keycloak-admin-password \
#     docker compose -f docker-compose.yml -f docker-compose.keycloak-secret.yml --profile postgres up -d
#
# The file holds the password of the Keycloak admin user KEYCLOAK_ADMIN (one line, no trailing newline needed) and
# stays outside the repository. It must match the admin account in Keycloak: on the very first start of an empty
# Keycloak the keycloak service still creates that account from KC_BOOTSTRAP_ADMIN_PASSWORD, so set
# KEYCLOAK_ADMIN_PASSWORD to the same value for that first start (or manage the admin in Keycloak itself).
# The script reads KEYCLOAK_ADMIN_PASSWORD_FILE first; the dev fallback variable is blanked here so it is never used.

services:
  keycloak-broker-otp:
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ""
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/keycloak-admin-password
    secrets:
      - keycloak-admin-password

secrets:
  keycloak-admin-password:
    file: ${KEYCLOAK_ADMIN_PASSWORD_SECRET:?set KEYCLOAK_ADMIN_PASSWORD_SECRET to the host path of the Keycloak admin password file}
