# SPDX-License-Identifier: Apache-2.0
# Default values for the Sangam chart. Secrets are NEVER written here: every credential comes from an
# existing Kubernetes Secret (existingSecret) that the operator creates (or that an external secrets operator
# / sealed secret provides).

global:
  # Air-gapped installs: point at the internal registry the bundle was loaded into (deploy/airgap/load-images.*).
  imageRegistry: ""
  imagePullSecrets: []
  # Extra labels on every object.
  labels: {}

nameOverride: ""
fullnameOverride: ""

# ------------------------------------------------------------------------------------------------ database
database:
  # postgres | oracle | sqlserver | mysql  (the four Tier-1 databases, ARCHITECTURE.md 1.5)
  type: postgres
  host: ""
  # 0 = the default port of the type (5432, 1521, 1433, 3306)
  port: 0
  # PostgreSQL/SQL Server/MySQL: database name. Oracle: service name (e.g. FREEPDB1, SANGAMPDB).
  name: sangam
  # Full JDBC URL override (wins over host/port/name).
  jdbcUrl: ""
  # Extra JDBC parameters appended to the generated URL (without leading ? or ;).
  params: ""
  # REQUIRED: Secret holding the application user's credentials.
  existingSecret: ""
  usernameKey: username
  passwordKey: password
  pool:
    maximumPoolSize: 30
    minimumIdle: 5
    # SL-59 / SCALE-ARCHITECTURE 1.6: wait at most this long for a free connection, then 503 DATABASE_UNAVAILABLE
    # with Retry-After (the server default, application.yaml). 0 (wait for ever) is refused by the server.
    connectionTimeoutMs: 2000
    maxLifetimeMs: 1500000
    # SL-168 / X1-05: the three leaf pools (separate HikariCP pools on the same database, with the main pool's settings).
    # Each is ON TOP of maximumPoolSize on every pod: budget max_connections >= pods x (maximumPoolSize + the three) +
    # admin/replication slots (deploy/README.md section 1.6). Defaults are the server's.
    leafPools:
      # SANGAM_QUOTA_POOL_SIZE: sangam.quotas.pool.maximum-size, quota counting and audit (SL-43), default 4
      quota: 4
      # SANGAM_SECURITY_DENIAL_AUDIT_POOL_SIZE: sangam.security.denial-audit.pool.maximum-size (SL-132; also the tenant
      # data-key store, SL-161: keep it at 2 or more), default 2
      securityDenialAudit: 2
      # SANGAM_COMPLIANCE_DENIAL_AUDIT_POOL_SIZE: sangam.compliance.denial-audit.pool.maximum-size (SL-137), default 2
      complianceDenialAudit: 2
  # SL-59, optional (empty = the server default). Socket read bound on every pooled connection, a duration such as
  # 300s (server default 300s; 0 disables it): SANGAM_DB_NETWORK_TIMEOUT.
  networkTimeout: ""
  # Retry-After of the 503 DATABASE_UNAVAILABLE answer, e.g. 2s (server default 2s): SANGAM_DB_UNAVAILABLE_RETRY_AFTER.
  unavailableRetryAfter: ""
  # IR-6 read replica for analytics, audit and history reads (empty = everything on the primary).
  replica:
    jdbcUrl: ""
    # Secret with the replica user's credentials (same keys as above); empty = the primary's credentials.
    existingSecret: ""
    poolSize: 10
  sqlserver:
    # The server refuses SQL Server without READ_COMMITTED_SNAPSHOT ON (VI.1.6); TLS on by default.
    encrypt: true
    trustServerCertificate: false

# Bring-your-own JDBC driver (LIC-2/3/4): Oracle (ojdbc11/ojdbc17) and Db2 drivers are never shipped.
# Exactly one source; jars land in /opt/sangam/drivers (on loader.path). Steps: deploy/README.md §1.5.
# initImage must contain /bin/sh and cp (e.g. FROM busybox) because the init container runs `cp`.
drivers:
  # A PVC (ReadOnlyMany or ReadWriteOnce) holding the jar(s).
  existingClaim: ""
  # Or an image you build that contains the jar(s) under initImageDir; copied by an init container.
  initImage: ""
  initImageDir: /drivers
  initImagePullPolicy: IfNotPresent

# ------------------------------------------------------------------------------------------------ Liquibase (R12)
liquibase:
  # job     : a single Helm pre-install/pre-upgrade hook Job runs the migrations (Liquibase session lock + Operaton
  #           schema update) before any new server pod starts; server pods only validate. Recommended (R12).
  # startup : every server pod runs migrations at start-up (the Liquibase lock serialises them). Dev/small installs.
  # none    : the DBA applies the SQL produced by `SANGAM_LIQUIBASE_MODE=update-sql` out of band; pods validate.
  mode: job
  job:
    activeDeadlineSeconds: 1800
    # 0 on purpose: a failed migration is NOT retried automatically (see deploy/README.md "Failed migration").
    backoffLimit: 0
    ttlSecondsAfterFinished: 86400
    resources:
      requests: { cpu: 250m, memory: 768Mi }
      limits: { memory: 1536Mi }
    extraEnv: []

# ------------------------------------------------------------------------------------------------ identity (OIDC)
oidc:
  # The `iss` the tokens carry (public URL of the realm / Parichay / state IdP broker).
  issuerUri: ""
  # Optional internal JWKS URL (when the pods cannot reach the public issuer URL).
  jwkSetUri: ""
  # SL-70: issuer(s) of the separate PLATFORM realm, comma-separated. Only their tokens are platform identities
  # (sangam-admin = platform administrator); sangam-admin in a tenant token = tenant administrator. Empty = nobody is
  # platform administrator. Must differ from issuerUri.
  platformIssuerUri: ""
  # Optional internal JWKS URL of the platform realm (exactly one platform issuer).
  platformJwkSetUri: ""
  audience: sangam-server
  tenantClaim: tenant
  rolesClaim: roles
  seatsClaim: seats
  # Public client used by the browser (PKCE).
  uiClientId: sangam-ui
  # OPEN POINT (owner decision 113): brokered sign-ins need the post-broker-login OTP flow and the amr mapper that
  # deploy/compose/keycloak/configure-broker-otp.sh adds with kcadm. This chart deploys no Keycloak (the IdP is
  # external), so it has no post-install Job for it: run the script once against the production Keycloak (same
  # variables: KEYCLOAK_URL, KEYCLOAK_ADMIN, KEYCLOAK_ADMIN_PASSWORD_FILE, BROKER_ALIASES, AMR_CLIENTS) after each
  # realm change, or have the IdP operator configure the same flow.

# ------------------------------------------------------------------------------------------------ telemetry (R13, R56)
otel:
  # Off by default: no outbound telemetry unless configured (R56).
  enabled: false
  endpoint: http://otel-collector.observability:4318
  protocol: http/protobuf
  samplerRatio: "0.1"
  resourceAttributes: ""
  # SL-168 / M-062: engine spans, one per engine command, jobs as root spans (SANGAM_TRACING_ENGINE_ENABLED,
  # sangam.tracing.engine.enabled). Off by default; the spans leave the pod only when enabled above is true.
  engineTracing: false

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # M-091: PrometheusRule (Prometheus Operator CRD) with the Sangam alert rules. The same rules, with these defaults,
  # are in deploy/compose/observability/rules/sangam-alerts.yml (PrometheusAlertRulesTraceTest keeps them equal).
  prometheusRule:
    enabled: false
    # Extra labels, e.g. the ruleSelector of the Prometheus instance (release: kube-prometheus-stack).
    labels: {}
    thresholds:
      # Oldest undelivered outbox event (sangam_outbox_oldest_age_seconds): relay stalled, destination down or an
      # ordered delivery PARKED (VI.2.3; PARKED rows count as undelivered).
      outboxOldestAgeSeconds: 300
      # Outbox used bytes / outboxMaxBytes (sangam_outbox_capacity_used_ratio): R40 alerts at 50%. The BACKPRESSURE
      # rule at 0.8 is fixed: it is the level at which the server starts refusing (OutboxCapacityMonitor).
      outboxCapacityRatio: 0.5
      # PARKED ordered deliveries (sangam_outbox_parked) above this count; each blocks its line until repaired.
      outboxParked: 0
      # Per-pod relay heartbeat (sangam_relay_last_cycle_age_seconds). A healthy cycle ends within the 30 s claim
      # lease (Relay.Config) and the next starts within the 1 s poll interval (OutboxRelayService.Settings): 2 x lease.
      relayLastCycleAgeSeconds: 60
      # Worst root-lock wait per process definition (sangam_engine_root_lock_wait_seconds_max): half of the 2 s
      # lock_timeout (R3, VI.1 hot roots).
      rootLockWaitSeconds: 1
      # Open Operaton incidents (sangam_incidents_open) above this count.
      incidentsOpen: 0
      # OPEN reconciliation items (sangam_reconciliation_items{state="OPEN"}) above this count.
      reconciliationOpen: 0
      # Days before a cert-manager Certificate in the release namespace expires.
      certExpiryDays: 14
    # Certificate expiry from cert-manager's certmanager_certificate_expiration_timestamp_seconds (deploy README:
    # TLS is renewed by cert-manager). Without cert-manager the rule has no series and never fires.
    certManager:
      enabled: true
      # PromQL label matchers that narrow the certificates, e.g. namespace="sangam" (or exported_namespace="sangam"
      # when the scrape renames cert-manager's own namespace label). Empty = every certificate Prometheus sees.
      selector: ""

# ------------------------------------------------------------------------------------------------ server
server:
  # SL-18, decisions 143 and 198: SANGAM_SECURITY_PRODUCTION, always rendered explicitly. true refuses dev
  # tokens/bootstrap and loopback/unset externally used URLs at start-up; a dev profile in springProfiles is then ignored
  # with a warning. Keep true for every cluster install; false is for local development stacks only.
  production: true
  # Decision 144: SANGAM_ENGINE_SYSTEM_AUDIT_SCOPE (sangam.engine.system-audit-scope), the audit scope of shared and
  # system-owned engine work. Required: system:<name>, name [a-z0-9][a-z0-9._-]{0,47}; anything else, or empty, and
  # the server refuses to start. It can never be a customer tenant (tenant ids have no ':').
  systemAuditScope: "system:platform"
  # Decision 247 (170, 207): SANGAM_AI_KB_VECTOR_INDEX (sangam.ai.kb.vector-index), the knowledge-base ranking index.
  # portable (default, every database) | pgvector (PostgreSQL with the pgvector column) | oracle (Oracle AI Database 23ai
  # or later: the server applies the separate changelog db/changelog/sangam-oracle-vector.xml, context oracle-vector, and
  # refuses to start on Oracle below 23ai). Anything else stops the start. See deploy/README.md section 2.
  aiKbVectorIndex: portable
  # Decision 259: SANGAM_DSC_OCSP_MAX_AGE (sangam.dsc.ocsp-max-age), used only with the eSign/DSC add-on. An OCSP answer
  # whose thisUpdate is older than this is INDETERMINATE (the signing step refuses), even with a matching nonce; the
  # clock-skew allowance stays. A positive duration with one unit: ms, s, m, h or d (24h), or ISO-8601 (PT24H, P1D).
  dscOcspMaxAge: 24h
  # Decision 290: SANGAM_INTEGRATION_RECONCILIATION_MAX_REDISPATCHES (sangam.integration.reconciliation.max-redispatches).
  # Automatic re-dispatches of a pack operation that has no process instance (a REST-backed record create) before
  # reconciliation hands it to a person. A positive integer; any other value refuses the server start.
  integrationReconciliationMaxRedispatches: 3
  # CIDRs of the ingress controller / edge proxies whose X-Forwarded-*/Forwarded headers are trusted. Empty = none.
  trustedProxies: []
  # Client-IP headers in priority order (read only from trustedProxies), e.g. [CF-Connecting-IP, X-Forwarded-For].
  clientIpHeaders: [X-Forwarded-For]
  # Add-ons are built into the image, not switched on here (deploy/README.md): NATS (decision 232, server.Dockerfile
  # WITH_NATS=true; without it the server refuses NATS settings at start) or eSign/DSC (decision 217, WITH_ESIGN=true).
  # A 0.1.0 server runs NATS or eSign, never both (decision 235: two Bouncy Castle provider jars with the same packages;
  # revisited when jnats moves to bcprov-jdk18on). Health connectors with Fidelius (decision 243) use the eSign add-on's
  # bcprov-jdk18on 1.84 (the same jar), so health never runs with the NATS add-on either. Point image.repository/tag/
  # digest at such an image.
  image:
    registry: ghcr.io
    repository: sqamentor/sangam-server
    tag: ""            # defaults to .Chart.AppVersion
    digest: ""         # set in production / air-gapped installs (sha256:...)
    pullPolicy: IfNotPresent
  replicaCount: 2
  springProfiles: ""   # extra profiles, appended after "<database.type>,oidc" (e.g. prod)
  # keep -Duser.timezone=UTC: the server refuses to start in any other JVM zone (SL-53); timer business zone =
  # sangam.engine.timer-zone (e.g. server.env / envFrom SANGAM_ENGINE_TIMERZONE=Asia/Kolkata)
  javaToolOptions: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -XX:+UseG1GC -Duser.timezone=UTC -Dfile.encoding=UTF-8"
  defaultTenant: ""
  environment: ""      # SL-42 SANGAM_ONBOARDING_ENVIRONMENT (sandbox, uat, prod ...); optional, empty = no promotion
  corsOrigins: ""      # SANGAM_CORS_ORIGINS; empty = same origin only (UI behind the same ingress host)
  # M-081 (decisions 94, 95): SANGAM_PDF_FONTS, the fonts the PDF/A and PDF/UA renderer embeds. Default = the Noto
  # fonts shipped in the image under /opt/sangam/fonts (SIL OFL 1.1). Override only to point at other licensed fonts
  # mounted into the pod (comma-separated); empty = not rendered, the image's own SANGAM_PDF_FONTS applies. Without a
  # usable font the renderer reports not ready and PDF output stays off.
  pdfFonts: "/opt/sangam/fonts/NotoSans-Regular.ttf,/opt/sangam/fonts/NotoSansDevanagari-Regular.ttf"
  jobExecutor:
    enabled: true      # false for API-only pods
    corePoolSize: 16
    maxPoolSize: 32
    maxJobsPerAcquisition: 20
    # SANGAM_JOB_EXCLUSIVE_OVER_PROCESS_HIERARCHIES (SANGAM.md 4.3 item 3, on by default): exclusive jobs are grouped
    # per root instance (the whole call-activity tree); false = Operaton's per-instance rule
    exclusiveOverProcessHierarchies: true
    # SANGAM_JOB_VIRTUAL_THREADS (M-054, off by default): job executor pool threads are JDK virtual threads; pool size,
    # queue and rejection unchanged. Keep false until the soak evidence (R30) supports a change.
    virtualThreads: false
  content:             # upload limits (sangam.content.max-bytes = multipart max-file-size)
    maxBytes: "268435456"
    maxFile: 256MB
    maxRequest: 260MB
  # In-process connector simulators (sangam-integration SimulatorProfile). Never true in production.
  simulators: false
  integrationTopics: ""     # <topic>=<connectorId>:<operation>,... (connector external-task worker)
  outboxDestinations: ""    # default outbox destinations; "rollup:national" is added when scale.cell.id is set
  # Writable state at /var/lib/sangam: compliance log archive (R51: >= 180 days, India-resident, CERT-In) and
  # cell exports. Several replicas share it: use ReadWriteMany storage.
  state:
    existingClaim: ""
    create: true
    storageClass: ""
    size: 50Gi
    accessModes: [ReadWriteMany]
  # Key material (draft encryption keys, audit/package signing keys, connector client certificates). Mounted
  # read-only at /opt/sangam/secrets. Rotation: deploy/README.md "Key rotation".
  keys:
    existingSecret: ""
  # Extra Spring configuration (rendered to /opt/sangam/config/application-helm.yaml). No secrets: secret values are
  # secret:// references resolved by the platform secret providers (secrets.*). Optional integrations stay off until
  # configured here, for example (W4-H; all off by default, nothing is called):
  #   sangam.history.projection.datalake: { endpoint: https://s3.example, bucket: lake, access-key-ref: secret://lake/access,
  #                                         secret-key-ref: secret://lake/secret }
  #   sangam.connectors.s3.tenants.<tenant>.<id>: { endpoint: ..., bucket: ... }
  #   sangam.connectors.graphql.tenants.<tenant>.<id>: { base-url: ..., documents: { <name>: "query { ... }" } }
  #   sangam.connectors.jdbc.tenants.<tenant>.<id>: { url: ..., username: ..., password-ref: secret://..., statements: ... }
  # Each needs a networkPolicy.extraEgress rule to its endpoint (air-gapped default: none).
  config: {}
  env: []
  envFrom: []
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { memory: 3Gi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: [ALL] }
  service:
    type: ClusterIP
    port: 8080
    managementPort: 8081
    annotations: {}
  probes:
    startup:   { path: /actuator/health/liveness,  periodSeconds: 5,  failureThreshold: 72, timeoutSeconds: 3 }
    liveness:  { path: /actuator/health/liveness,  periodSeconds: 10, failureThreshold: 6,  timeoutSeconds: 3 }
    readiness: { path: /actuator/health/readiness, periodSeconds: 5,  failureThreshold: 3,  timeoutSeconds: 3 }
  # Job executor drain: the server stops acquiring jobs on SIGTERM and finishes running ones.
  terminationGracePeriodSeconds: 90
  preStopSleepSeconds: 10
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 0
  pdb:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread: true
  podAnnotations: {}
  podLabels: {}

# ------------------------------------------------------------------------------------------------ malware scanning (M-082)
# Uploads are scanned before they are stored (sangam.malware.*, sangam-server MalwareScanWiring). scanner none = no
# scanner (the server default). Rendered into the server environment as SANGAM_MALWARE_*.
malware:
  # none | clamd | icap (SANGAM_MALWARE_SCANNER)
  scanner: none
  # A scanner error or timeout refuses the upload (SANGAM_MALWARE_FAIL_CLOSED); with a scanner on it is also the
  # default of sangam.content.require-clean. Server default true.
  failClosed: true
  # Time limit of one scan, a duration (SANGAM_MALWARE_TIMEOUT). Server default 30s.
  timeout: 30s
  # Bytes of one upload sent to the scanner (SANGAM_MALWARE_MAX_BYTES), a string so helm keeps the digits. Server
  # default 26214400 (25 MiB).
  maxBytes: "26214400"
  clamd:
    # SANGAM_MALWARE_CLAMD_HOST. Empty = this release's ClamAV service (malware.clamav.enabled); with scanner clamd and
    # no ClamAV service in this release it is required.
    host: ""
    # SANGAM_MALWARE_CLAMD_PORT. Server default 3310.
    port: 3310
  icap:
    # SANGAM_MALWARE_ICAP_URI, required with scanner icap, e.g. icap://icap.example.internal:1344/avscan. Allow the
    # ICAP server in networkPolicy.extraEgress.
    uri: ""
  # Optional ClamAV service in this release (owner decision 71): image clamav/clamav (GPL-2.0) as a SEPARATE service,
  # never linked into Sangam, with a pinned tag; pulled only in the test phase. Off by default. clamd answers on 3310
  # inside the cluster only (no Ingress). freshclam inside the image fetches signatures: allow the mirror in
  # malware.clamav.egress (air-gapped: a private mirror, set through extraEnv / a mounted freshclam.conf).
  clamav:
    enabled: false
    image:
      registry: docker.io
      repository: clamav/clamav
      # Pinned (approval line in the W3-M report); never empty, never "latest".
      tag: "1.4.3"
      digest: ""
      pullPolicy: IfNotPresent
    replicaCount: 1
    port: 3310
    # Signature database (/var/lib/clamav), an emptyDir refilled by freshclam at start.
    databaseSizeLimit: 2Gi
    # Egress of the ClamAV pods besides DNS (NetworkPolicyEgressRule items), e.g. the signature mirror on 443.
    egress: []
    extraEnv: []
    # clamd keeps the whole signature set in memory.
    resources:
      requests: { cpu: 250m, memory: 2Gi }
      limits: { memory: 4Gi }
    # The image starts as root and drops to its clamav user; no product default is forced here.
    podSecurityContext: {}
    securityContext:
      allowPrivilegeEscalation: false
    nodeSelector: {}
    tolerations: []
    affinity: {}

# ------------------------------------------------------------------------------------------------ secret providers (M-075)
# The platform SecretResolver (sangam-server SecretsWiring): only when providers is set; empty = no resolver bean and
# every connector keeps reading its secret:// references from the environment (R56: no outbound call by default).
# Every *Ref below is a secret:// REFERENCE resolved by the file and env providers only, never a value.
# Rendered as SANGAM_SECRETS_*; outbound providers (vault, aws, azure, gcp) need networkPolicy.extraEgress.
secrets:
  # Comma list, asked in order: file, vault, aws, azure, gcp, env (SANGAM_SECRETS_PROVIDERS).
  providers: ""
  # Cache time of a resolved secret, a duration (SANGAM_SECRETS_CACHE_TTL). Empty = server default 300s.
  cacheTtl: ""
  file:
    # Directory of the file provider, one file per secret (SANGAM_SECRETS_FILE_ROOT).
    root: /var/run/sangam/secrets
    # Kubernetes Secret mounted read-only at file.root (each key becomes a file). Empty = nothing mounted.
    existingSecret: ""
  vault:
    url: ""
    mount: ""
    pathPrefix: ""
    namespace: ""
    tokenRef: ""
    # Allow a private or loopback Vault address (SSRF guard; off by default).
    allowPrivate: false
  aws:
    region: ""
    endpoint: ""
    namePrefix: ""
    accessKeyRef: ""
    secretKeyRef: ""
    sessionTokenRef: ""
  azure:
    vaultUrl: ""
    tenantId: ""
    clientId: ""
    clientSecretRef: ""
    authority: ""
  gcp:
    project: ""
    serviceAccountKeyRef: ""
    namePrefix: ""
    endpoint: ""

# ------------------------------------------------------------------------------------------------ script worker (M-061)
# BPMN script tasks run outside the engine JVM (owner decision 53): an SDK worker on the lease protocol starts each
# script as a Node.js or CPython child inside nsjail (tools/sangam-script-worker/README.md). Off by default. The pod
# holds only the worker: no database credentials, no ingress. It calls the server API as a labelled API client.
scriptWorker:
  enabled: false
  image:
    registry: ghcr.io
    repository: sqamentor/sangam-script-worker
    tag: ""            # defaults to .Chart.AppVersion
    digest: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  # SANGAM_URL; empty = this release's server (or gateway when scale.gateway.enabled).
  url: ""
  # Credentials: a Secret with key `token` (SANGAM_TOKEN), or OIDC client credentials (oidcTokenUrl + clientId and
  # the Secret key `clientSecret`, SANGAM_CLIENT_SECRET). Never a value in this file.
  existingSecret: ""
  oidcTokenUrl: ""
  clientId: ""
  # Languages and limits (tools/sangam-script-worker README "Limits"); empty = the worker default.
  languages: javascript,python
  maxConcurrency: ""
  cpuSeconds: ""
  wallTime: ""
  memoryBytes: ""
  maxProcesses: ""
  extraEnv: []
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { memory: 2Gi }
  # Owner decision 78: nsjail creates namespaces and cgroups per script, so the CONTAINER runs as root with
  # SYS_ADMIN and with seccomp and AppArmor unconfined at container level; nsjail applies its own per-script seccomp
  # policy, and every script runs as nobody in its own user namespace with no capabilities. The worker container
  # needs a private cgroup namespace (the default with cgroup v2) and, where the runtime masks /proc paths, an
  # unmasked /proc (procMount: Unmasked, which Kubernetes allows only with hostUsers: false).
  # OPEN POINT (integrator, round 2): whether the chart must also set securityContext.procMount: Unmasked with
  # hostUsers: false (the Kubernetes counterpart of compose security_opt systempaths=unconfined) is checked when the
  # image is first run in the test phase; until then neither is rendered.
  podSecurityContext:
    seccompProfile: { type: Unconfined }
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    allowPrivilegeEscalation: true
    readOnlyRootFilesystem: false
    capabilities: { add: [SYS_ADMIN], drop: [] }
    seccompProfile: { type: Unconfined }
    appArmorProfile: { type: Unconfined }
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ------------------------------------------------------------------------------------------------ sidecars (M-081, M-103)
# Owner decisions 114, 153 and 167: the PDF validator (veraPDF, the only distribution with Rhino) and the OCR sidecar
# (Tesseract) run as separate, optional Deployments. Off by default: without them PDF output answers 422
# FORMAT_NOT_AVAILABLE and OCR is unavailable (fail closed). Each one:
#   - accepts only the bearer tokens of its Secret key `token` (one per line; list old and new while rotating), mounted
#     as a file; the server sends the first line of the client Secret's key `token` (clientExistingSecret, default the
#     same Secret). There is no unauthenticated mode.
#   - transport tls (default): Secret keys `keystore.p12` (PKCS#12, certificate SAN = <release fullname>-pdf-validator
#     or -ocr and its namespace FQDN) and `keystore-password`; the server trusts it through sidecarTrustStore. mesh:
#     plain HTTP, only behind an authenticated service mesh, no key store.
#   - NetworkPolicy: ingress from this release's server pods only, on its port; no egress at all.
# Secrets are never values in this file. Demo secrets for local use are generated by deploy/compose only.
pdfValidator:
  enabled: false
  image:
    registry: ghcr.io
    repository: sqamentor/sangam-pdf-validator
    tag: ""            # defaults to .Chart.AppVersion
    digest: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8085
  transport: tls       # tls | mesh
  existingSecret: ""   # keys token, keystore.p12, keystore-password (tls)
  clientExistingSecret: ""   # key token for the server; empty = existingSecret
  # SANGAM_PDF_VALIDATOR_URL for the server; empty = https://<fullname>-pdf-validator:<port> (http with mesh)
  url: ""
  timeoutMs: ""        # server side SANGAM_PDF_VALIDATOR_TIMEOUT_MS; empty = 30000
  # Sidecar limits (SANGAM_PDF_VALIDATOR_*); empty = the image default
  threads: ""
  maxBytes: ""
  processingTimeoutMs: ""
  extraEnv: []
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { memory: 1536Mi }
  tmpSizeLimit: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: [ALL] }
  nodeSelector: {}
  tolerations: []
  affinity: {}

ocr:
  enabled: false
  image:
    registry: ghcr.io
    repository: sqamentor/sangam-ocr
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8086
  transport: tls       # tls | mesh
  existingSecret: ""   # keys token, keystore.p12, keystore-password (tls)
  clientExistingSecret: ""   # key token for the server; empty = existingSecret
  # SANGAM_OCR_URL for the server; empty = https://<fullname>-ocr:<port> (http with mesh)
  url: ""
  timeoutMs: ""        # server side SANGAM_OCR_TIMEOUT_MS; empty = the client default
  # Sidecar limits (SANGAM_OCR_*); empty = the image default (languages eng,hin; each must be installed in the image)
  threads: ""
  maxBytes: ""
  maxPixels: ""
  processingTimeoutMs: ""
  languages: ""
  extraEnv: []
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
  tmpSizeLimit: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: [ALL] }
  nodeSelector: {}
  tolerations: []
  affinity: {}

# The server's trust store for the sidecars on transport tls: a Secret with keys `truststore.p12` (PKCS#12 holding the
# CA that signed the sidecar certificates, plus any public CAs the server also needs, because it replaces the JVM default
# trust store) and `password`. Required when a sidecar is enabled with transport tls. Passed to the JVM through
# JDK_JAVA_OPTIONS, so server.javaToolOptions stays as it is.
sidecarTrustStore:
  existingSecret: ""

# ------------------------------------------------------------------------------------------------ compliance
# sangam-compliance: DPDP Act 2023 / Rules 2025, CERT-In Directions 2022 (jurisdiction pack IN).
compliance:
  enabled: true
  jurisdictions: IN
  organisation: ""          # the data fiduciary / department name printed on notices and reports
  tenants: ""               # comma-separated tenants the scheduler covers; empty = the default tenant
  schedule: true            # retention, log sealing, NTP check, integrity verification jobs
  logArchive:
    country: IN             # residency check of the archive location (R51)
  connectors:
    sms: sms-dlt
    email: smtp
    authorityEmail: smtp
    authorityHttp: rest

# ------------------------------------------------------------------------------------------------ SCALE (cells)
# SCALE-ARCHITECTURE.md: the server as a cell + optional control plane, gateway and national roll-up.
scale:
  cell:
    id: ""                  # setting it switches the cell on (SANGAM_CELL_ID); ids are immutable, never reused
    region: ""
    jurisdiction: ""        # required with scale.cell.id (SL-104: no product default)
    residency: ""           # defaults to jurisdiction
    publicUrl: ""
    adminUrl: ""
    capacity: { startsPerSec: 500, tenants: 2000 }
    # empty = this release's control-plane / rollup / gateway services
    controlPlaneUrl: ""
    rollupIngestUrl: ""
    gatewayUrl: ""
    # Secret with keys controlPlaneToken, rollupToken, serviceToken
    existingSecret: ""
  # Each component is a separate Spring Boot app built from deploy/docker/server.Dockerfile (APP_MODULE).
  controlPlane:
    enabled: false
    image: { registry: ghcr.io, repository: sqamentor/sangam-control-plane, tag: "", digest: "", pullPolicy: IfNotPresent }
    replicaCount: 2
    port: 8090
    managementPort: 8091
    # Own database (never a cell database). Secret keys: url, username, password, tokens (comma-separated
    # <token>:<ROLE> entries; ADMIN, CELL, GATEWAY, ROLLUP), cellAdminToken.
    existingSecret: ""
    resources: { requests: { cpu: 250m, memory: 768Mi }, limits: { memory: 1536Mi } }
  gateway:
    enabled: false
    image: { registry: ghcr.io, repository: sqamentor/sangam-gateway, tag: "", digest: "", pullPolicy: IfNotPresent }
    replicaCount: 2
    port: 8000
    managementPort: 8001
    hostSuffix: ""
    tenantClaim: tenant
    # Secret key: controlPlaneToken (role GATEWAY)
    existingSecret: ""
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
  rollup:
    enabled: false
    image: { registry: ghcr.io, repository: sqamentor/sangam-rollup, tag: "", digest: "", pullPolicy: IfNotPresent }
    replicaCount: 2
    port: 8095
    managementPort: 8096
    # Own database. Secret keys: url, username, password, tokens (<token>:CELL,<token>:DASHBOARD)
    existingSecret: ""
    resources: { requests: { cpu: 250m, memory: 768Mi }, limits: { memory: 1536Mi } }

# ------------------------------------------------------------------------------------------------ UI
ui:
  enabled: true
  image:
    registry: ghcr.io
    repository: sqamentor/sangam-ui
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  environmentLabel: production
  defaultLocale: en
  locales: en,hi
  cspConnectExtra: ""
  # M-044 (owner decision 57): link to the operator's trace viewer with the placeholder {traceId}, e.g.
  # https://tracing.example.gov.in/trace/{traceId} (SANGAM_TRACE_URL_TEMPLATE, served in /config.json). Empty = no
  # trace links; the UI links only http(s) results.
  traceUrlTemplate: ""
  # Decision 213: Microsoft Teams personal tab (/teams.html). enabled false keeps it unframeable like every page.
  # frameAncestors: space-separated https origins (https://host[:port] or https://*.host) allowed to frame it; empty =
  # the image's built-in Microsoft list. Register https://<ui host>/teams.html as a redirect URI of oidc.uiClientId.
  teams:
    enabled: false
    frameAncestors: ""
  # Decision 165: SANGAM_DSC_AGENT_ORIGIN, the DSC signing agent on the signer's computer (dsc.agentUrl, connect-src).
  # Empty = DSC not set up; else exactly http://127.0.0.1:<port> or http://localhost:<port> (no path; IPv4 loopback only, never [::1]).
  dscAgentOrigin: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: [ALL] }
  service:
    type: ClusterIP
    port: 8080
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# ------------------------------------------------------------------------------------------------ ingress
ingress:
  enabled: false
  # The public ingress class. With private.enabled=true it must stay empty: the schema and the template refuse it.
  className: ""
  annotations: {}
  host: sangam.example.gov.in
  tls:
    enabled: true
    secretName: ""
  # UI at /, API at /api and /engine-rest (server). With ui.enabled=false everything goes to the server.
  # SG-39 (owner decision Q-09): private ingress. With private.enabled=true (and enabled=true) the Ingress uses the
  # internal class and the internal-load-balancer annotations of the chosen preset; ingress.className is refused.
  private:
    enabled: false
    # Internal IngressClass. Empty = the preset's className. Required with preset "" (e.g. an internal nginx class).
    className: ""
    # "" (no cloud preset), aws, azure or gcp.
    preset: ""
    # Schema-validated: each preset's internal-load-balancer annotation is fixed to its internal value, and the
    # preset annotations replace the same keys in ingress.annotations.
    presets:
      aws:
        # AWS Load Balancer Controller: an internal ALB (scheme internal is its default; set explicitly).
        className: alb
        annotations:
          alb.ingress.kubernetes.io/scheme: internal
      azure:
        # Application Gateway Ingress Controller: listen on the gateway's private IP.
        className: azure-application-gateway
        annotations:
          appgw.ingress.kubernetes.io/use-private-ip: "true"
      gcp:
        # GKE Ingress takes its class only from this annotation (not spec.ingressClassName); gce-internal is the
        # internal Application Load Balancer. An Ingress without it is external.
        className: ""
        annotations:
          kubernetes.io/ingress.class: gce-internal

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

# ------------------------------------------------------------------------------------------------ network policies
networkPolicy:
  enabled: true
  # Namespace of the ingress controller (matched by kubernetes.io/metadata.name).
  ingressControllerNamespace: ingress-nginx
  # Namespace allowed to scrape :8081 (Prometheus).
  monitoringNamespace: monitoring
  # Pods (any namespace in clientNamespaces, or this namespace) labelled sangam.io/api-client=true may call the API
  # (external-task workers, integrations).
  clientNamespaces: []
  # Source CIDRs of an edge load balancer that reaches the pods directly, not through a controller pod in
  # ingressControllerNamespace: e.g. the subnets of an AWS ALB in IP target mode, or an internal load balancer's
  # subnet. Allowed on the ports the Ingress serves (server or gateway, UI). Empty = none.
  ingressFrom:
    cidrs: []
  dns:
    namespace: kube-system
    podLabels: { k8s-app: kube-dns }
  # Where the database lives: CIDRs (VM / managed DB) and/or in-cluster selectors.
  database:
    cidrs: []
    namespaceSelector: {}
    podSelector: {}
  # Identity provider (JWKS fetch), when outside the cluster.
  oidc:
    cidrs: []
    ports: [443]
  otelCollector:
    namespace: observability
    podLabels: {}
  # Connector targets (IFMS/PFMS SFTP, eSign ESP, DLT SMS, DigiLocker, payment gateways, SMTP). Air-gapped
  # default: none. Each item is a NetworkPolicyEgressRule.
  extraEgress: []

# ------------------------------------------------------------------------------------------------ backups (ADR-D-12)
# EXAMPLES that meet RPO <= 5 min / RTO <= 1 h together with asynchronous replication to the DR site
# (deploy/README.md "Backup and restore", "Disaster recovery"). Review them with the DBA before production.
backup:
  enabled: false
  # Decision 155 (W4-I): the backup console in the server lists the backup CronJobs and Jobs of this release and starts
  # a Job from a CronJob. Off by default. With backup.enabled and console.enabled: a Role <fullname>-backup-console
  # (batch cronjobs get/list, jobs get/list/create) bound to the server ServiceAccount, the server pod's service
  # account token mounted (automountServiceAccountToken true for the server pod only) and, with networkPolicy.enabled,
  # server egress to the Kubernetes API server (apiServer.cidrs is then required: the API server's addresses, e.g.
  # the kubernetes Service endpoints, `kubectl get endpoints kubernetes`).
  console:
    enabled: false
    apiServer:
      cidrs: []
      ports: [443, 6443]
  # Credentials of a backup user (keys: username, password). Defaults to database.existingSecret.
  existingSecret: ""
  retentionDays: 14
  persistence:
    existingClaim: ""
    create: true
    storageClass: ""
    size: 200Gi
    # The CronJobs (and pg-receivewal) may land on different nodes: use ReadWriteMany storage (NFS/CephFS),
    # or keep ReadWriteOnce and pin all backup pods to one node.
    accessModes: [ReadWriteOnce]
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  postgres:
    image: postgres:17
    fullSchedule: "15 1 * * *"          # daily base backup (pg_basebackup, tar + gzip, WAL streamed)
    logicalSchedule: "45 2 * * 0"       # weekly pg_dump -Fc (portable, for restore tests)
    # Continuous WAL archive with pg_receivewal (a Deployment, not a CronJob): RPO = seconds.
    walReceiver:
      enabled: true
      slot: sangam_backup
  oracle:
    # RMAN is not redistributable: supply an image with the Oracle client + rman (LIC-2).
    image: ""
    fullSchedule: "15 1 * * 0"          # weekly level 0
    incrementalSchedule: "15 1 * * 1-6" # daily level 1
    archivelogSchedule: "*/5 * * * *"   # archive log backup every 5 min
    connectAs: "AS SYSBACKUP"
  sqlserver:
    # Decision 129 (RM-34): no default. Supply an image with sqlcmd (mssql-tools) that your organisation is licensed
    # to run; the chart never picks a vendor image or accepts its terms for you. Required when backup is enabled.
    image: ""
    fullSchedule: "15 1 * * *"
    diffSchedule: "15 */6 * * *"
    logSchedule: "*/5 * * * *"
    # Path as seen BY THE SQL SERVER host (BACKUP ... TO DISK runs on the server), or a URL (S3-compatible, 2022).
    destination: /var/opt/mssql/backup
    destinationType: DISK               # DISK | URL
    urlCredential: ""                   # name of the SQL Server CREDENTIAL for TO URL
  mysql:
    # Decision 129 (RM-34): no default. Supply an image with the MySQL 8.4 client tools (mysqldump, mysqlbinlog) that
    # your organisation is licensed to run. Required when backup is enabled.
    image: ""
    fullSchedule: "15 1 * * *"          # mysqldump --single-transaction (consistent, GTIDs recorded)
    binlogSchedule: "*/5 * * * *"       # FLUSH BINARY LOGS + copy closed binlogs (RPO <= 5 min)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile: { type: RuntimeDefault }

extraObjects: []
