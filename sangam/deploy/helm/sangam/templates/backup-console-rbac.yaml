{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- /* Decision 155 (W4-I): the server's backup console lists this release's backup CronJobs and Jobs and starts a Job
       from a CronJob. Rendered only with backup.enabled and backup.console.enabled; off by default. The namespace is
       read by the server from its service-account namespace file. */ -}}
{{- if eq (include "sangam.backup.consoleEnabled" .) "true" }}
{{- $fullname := include "sangam.fullname" . -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-backup-console
  labels:
    {{- include "sangam.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
rules:
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-backup-console
  labels:
    {{- include "sangam.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-backup-console
subjects:
  - kind: ServiceAccount
    name: {{ include "sangam.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
