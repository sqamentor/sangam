{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- include "sangam.drivers.check" . -}}
{{- $c := .Values.compliance -}}
{{- $cell := .Values.scale.cell -}}
# Environment of the server pods. Names follow sangam-server/src/main/resources/application*.yaml (SANGAM_*).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sangam.fullname" . }}-server-env
  labels:
    {{- include "sangam.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  TZ: UTC
  # SL-18: production posture (no dev tokens/bootstrap, no loopback URL defaults, keys required)
  SANGAM_SECURITY_PRODUCTION: {{ .Values.server.production | quote }}
  # Decision 144: system audit scope of shared and system-owned engine work (required; refused at start if invalid)
  SANGAM_ENGINE_SYSTEM_AUDIT_SCOPE: {{ required "server.systemAuditScope is required (decision 144)" .Values.server.systemAuditScope | quote }}
  {{- $ke := .Values.server.keyEnvironment | default dict }}
  {{- with $ke.name }}
  # Decision 385 (3): one key per environment (the start refuses a key of another environment; in production a list)
  SANGAM_KEYS_ENVIRONMENT: {{ . | quote }}
  SANGAM_KEYS_FINGERPRINT_EXPORT: /var/lib/sangam/key-fingerprints.txt
  {{- end }}
  {{- if $ke.foreignFingerprints }}
  SANGAM_KEYS_FOREIGN_FINGERPRINTS: /opt/sangam/config/key-fingerprints.txt
  {{- end }}
  # Decision 247: knowledge-base ranking index (portable, pgvector, oracle); also set on the migrate Job
  SANGAM_AI_KB_VECTOR_INDEX: {{ .Values.server.aiKbVectorIndex | quote }}
  # Decision 259: maximum age of an OCSP answer's thisUpdate (DSC add-on only)
  SANGAM_DSC_OCSP_MAX_AGE: {{ .Values.server.dscOcspMaxAge | quote }}
  # Decision 290: automatic re-dispatches of a pack operation with no process instance (positive integer)
  SANGAM_INTEGRATION_RECONCILIATION_MAX_REDISPATCHES: {{ .Values.server.integrationReconciliationMaxRedispatches | int | quote }}
  # Decisions 304, 305: India DLT SMS delivery reports, status lookups, registration refresh (deploy/README.md section 1.8)
  SANGAM_DLT_DELIVERY_REPORT_TOLERANCE: {{ .Values.server.dlt.deliveryReportTolerance | quote }}
  SANGAM_DLT_DELIVERY_STATUS_ENABLED: {{ .Values.server.dlt.deliveryStatus.enabled | quote }}
  SANGAM_DLT_DELIVERY_STATUS_INTERVAL: {{ .Values.server.dlt.deliveryStatus.interval | quote }}
  SANGAM_DLT_REGISTRATION_REFRESH_INTERVAL: {{ .Values.server.dlt.registrationRefreshInterval | quote }}
  SANGAM_TRUSTED_PROXIES: {{ join "," .Values.server.trustedProxies | quote }}
  SANGAM_CLIENT_IP_HEADERS: {{ join "," .Values.server.clientIpHeaders | quote }}
  SANGAM_PORT: {{ .Values.server.service.port | quote }}
  SANGAM_MANAGEMENT_PORT: {{ .Values.server.service.managementPort | quote }}
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: {{ printf "%ds" (int (sub .Values.server.terminationGracePeriodSeconds 20)) | quote }}
  SANGAM_LIQUIBASE_MODE: {{ include "sangam.liquibase.serverMode" . | quote }}
  {{- with .Values.server.defaultTenant }}
  SANGAM_TENANT_DEFAULT: {{ . | quote }}
  {{- end }}
  {{- with .Values.server.environment }}
  SANGAM_ONBOARDING_ENVIRONMENT: {{ . | quote }}
  {{- end }}
  {{- with .Values.server.pdfFonts }}
  # M-081: fonts the PDF/A and PDF/UA renderer embeds (image default /opt/sangam/fonts, SIL OFL 1.1)
  SANGAM_PDF_FONTS: {{ . | quote }}
  {{- end }}
  SANGAM_DB_POOL_SIZE: {{ .Values.database.pool.maximumPoolSize | quote }}
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: {{ .Values.database.pool.minimumIdle | quote }}
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: {{ .Values.database.pool.connectionTimeoutMs | quote }}
  SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: {{ .Values.database.pool.maxLifetimeMs | quote }}
  # SL-168 / X1-05: leaf pools, each on top of SANGAM_DB_POOL_SIZE per pod (deploy/README.md section 1.6)
  SANGAM_QUOTA_POOL_SIZE: {{ .Values.database.pool.leafPools.quota | quote }}
  SANGAM_SECURITY_DENIAL_AUDIT_POOL_SIZE: {{ .Values.database.pool.leafPools.securityDenialAudit | quote }}
  SANGAM_COMPLIANCE_DENIAL_AUDIT_POOL_SIZE: {{ .Values.database.pool.leafPools.complianceDenialAudit | quote }}
  SANGAM_CONFIG_STORE_POOL_SIZE: {{ .Values.database.pool.leafPools.configStore | quote }}
  {{- with .Values.database.networkTimeout }}
  # SL-59: socket read bound on every pooled connection
  SANGAM_DB_NETWORK_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- with .Values.database.unavailableRetryAfter }}
  # SL-59: Retry-After of 503 DATABASE_UNAVAILABLE
  SANGAM_DB_UNAVAILABLE_RETRY_AFTER: {{ . | quote }}
  {{- end }}
  {{- with .Values.database.replica.jdbcUrl }}
  # IR-6 read replica for analytics, audit and history reads
  SANGAM_DB_REPLICA_URL: {{ . | quote }}
  SANGAM_DB_REPLICA_POOL: {{ $.Values.database.replica.poolSize | quote }}
  {{- end }}
  # Job executor (SANGAM_JOB_*, sangam-engine SangamEngineSettings)
  SANGAM_JOB_EXECUTOR_ENABLED: {{ .Values.server.jobExecutor.enabled | quote }}
  SANGAM_JOB_CORE_POOL_SIZE: {{ .Values.server.jobExecutor.corePoolSize | quote }}
  SANGAM_JOB_MAX_POOL_SIZE: {{ .Values.server.jobExecutor.maxPoolSize | quote }}
  SANGAM_JOB_MAX_JOBS_PER_ACQUISITION: {{ .Values.server.jobExecutor.maxJobsPerAcquisition | quote }}
  # M-055 / SANGAM.md 4.3 item 3: exclusive jobs grouped per root instance (false = per process instance)
  SANGAM_JOB_EXCLUSIVE_OVER_PROCESS_HIERARCHIES: {{ .Values.server.jobExecutor.exclusiveOverProcessHierarchies | quote }}
  # M-054: job executor pool on JDK virtual threads (default false)
  SANGAM_JOB_VIRTUAL_THREADS: {{ .Values.server.jobExecutor.virtualThreads | quote }}
  # OIDC (profile "oidc"): SANGAM_OIDC_ISSUER is the iss the tokens carry; jwk-set-uri optional (internal JWKS URL)
  SANGAM_OIDC_ISSUER: {{ required "oidc.issuerUri is required" .Values.oidc.issuerUri | quote }}
  {{- with .Values.oidc.jwkSetUri }}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: {{ . | quote }}
  {{- end }}
  {{- with .Values.oidc.platformIssuerUri }}
  SANGAM_SECURITY_PLATFORM_ISSUER: {{ . | quote }}
  {{- end }}
  {{- with .Values.oidc.platformJwkSetUri }}
  SANGAM_SECURITY_PLATFORM_JWK_SET_URI: {{ . | quote }}
  {{- end }}
  SANGAM_SECURITY_OIDC_AUDIENCE: {{ .Values.oidc.audience | quote }}
  SANGAM_SECURITY_OIDC_TENANT_CLAIM: {{ .Values.oidc.tenantClaim | quote }}
  SANGAM_SECURITY_OIDC_ROLES_CLAIM: {{ .Values.oidc.rolesClaim | quote }}
  SANGAM_SECURITY_OIDC_SEATS_CLAIM: {{ .Values.oidc.seatsClaim | quote }}
  {{- with .Values.server.corsOrigins }}
  SANGAM_CORS_ORIGINS: {{ . | quote }}
  {{- end }}
  # Upload limits (sangam.content.max-bytes and the servlet multipart limits move together)
  SANGAM_CONTENT_MAX_BYTES: {{ .Values.server.content.maxBytes | quote }}
  SANGAM_CONTENT_MAX_FILE: {{ .Values.server.content.maxFile | quote }}
  SANGAM_CONTENT_MAX_REQUEST: {{ .Values.server.content.maxRequest | quote }}
  # Telemetry: off by default (R56); OTLP via the Spring Boot OpenTelemetry starter
  SANGAM_OTLP_ENABLED: {{ .Values.otel.enabled | quote }}
  # SL-168 / M-062: engine spans (sangam.tracing.engine.enabled), exported only when OTLP is enabled
  SANGAM_TRACING_ENGINE_ENABLED: {{ .Values.otel.engineTracing | quote }}
  {{- if .Values.otel.enabled }}
  SANGAM_OTLP_TRACES_ENDPOINT: {{ printf "%s/v1/traces" (trimSuffix "/" .Values.otel.endpoint) | quote }}
  MANAGEMENT_OTLP_METRICS_EXPORT_URL: {{ printf "%s/v1/metrics" (trimSuffix "/" .Values.otel.endpoint) | quote }}
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: {{ .Values.otel.samplerRatio | quote }}
  {{- end }}
  {{- with .Values.server.keys.existingSecret }}
  SANGAM_KEYS_DIRECTORY: /opt/sangam/secrets
  {{- end }}
  # sangam-integration
  SANGAM_INTEGRATION_SIMULATORS_ENABLED: {{ .Values.server.simulators | quote }}
  {{- with .Values.server.integrationTopics }}
  SANGAM_INTEGRATION_TOPICS: {{ . | quote }}
  {{- end }}
  {{- $dest := .Values.server.outboxDestinations -}}
  {{- if and $cell.id (not (contains "rollup:national" $dest)) -}}
  {{- $dest = trimPrefix "," (printf "%s,rollup:national" $dest) -}}
  {{- end }}
  {{- with $dest }}
  SANGAM_OUTBOX_DESTINATIONS: {{ . | quote }}
  {{- end }}
  # sangam-compliance (DPDP Act 2023 / Rules 2025, CERT-In 2022). Log archive: R51, >= 180 days, India-resident.
  SANGAM_MODULE_COMPLIANCE: {{ $c.enabled | quote }}
  SANGAM_COMPLIANCE_JURISDICTIONS: {{ $c.jurisdictions | quote }}
  SANGAM_COMPLIANCE_ORGANISATION: {{ $c.organisation | quote }}
  {{- with $c.tenants }}
  SANGAM_COMPLIANCE_TENANTS: {{ . | quote }}
  {{- end }}
  SANGAM_COMPLIANCE_LOG_ARCHIVE: /var/lib/sangam/compliance-logs
  SANGAM_COMPLIANCE_LOG_ARCHIVE_COUNTRY: {{ $c.logArchive.country | quote }}
  SANGAM_COMPLIANCE_SCHEDULE: {{ $c.schedule | quote }}
  SANGAM_COMPLIANCE_SMS_CONNECTOR: {{ $c.connectors.sms | quote }}
  SANGAM_COMPLIANCE_EMAIL_CONNECTOR: {{ $c.connectors.email | quote }}
  SANGAM_COMPLIANCE_AUTHORITY_EMAIL_CONNECTOR: {{ $c.connectors.authorityEmail | quote }}
  SANGAM_COMPLIANCE_AUTHORITY_HTTP_CONNECTOR: {{ $c.connectors.authorityHttp | quote }}
  {{- with $c.principalKeyRef }}
  # Decisions 369, 371: the compliance principal key reference (required in production; a secret:// reference only)
  SANGAM_COMPLIANCE_PRINCIPAL_KEY_REF: {{ . | quote }}
  {{- end }}
  SANGAM_CELL_EXPORT_DIR: /var/lib/sangam/cell-exports
  # Document content store (ContentService); on the shared state volume, never the read-only root filesystem
  SANGAM_CONTENT_ROOT: /var/lib/sangam/content
  {{- $mw := .Values.malware }}
  # M-082: upload malware scanning (sangam.malware.*); none = no scanner
  SANGAM_MALWARE_SCANNER: {{ $mw.scanner | quote }}
  SANGAM_MALWARE_FAIL_CLOSED: {{ $mw.failClosed | quote }}
  SANGAM_MALWARE_TIMEOUT: {{ $mw.timeout | quote }}
  SANGAM_MALWARE_MAX_BYTES: {{ $mw.maxBytes | quote }}
  {{- if eq $mw.scanner "clamd" }}
  {{- $clamdHost := $mw.clamd.host }}
  {{- if and (not $clamdHost) $mw.clamav.enabled }}
  {{- $clamdHost = printf "%s-clamav" (include "sangam.fullname" .) }}
  {{- end }}
  SANGAM_MALWARE_CLAMD_HOST: {{ required "malware.clamd.host is required with malware.scanner=clamd unless malware.clamav.enabled" $clamdHost | quote }}
  SANGAM_MALWARE_CLAMD_PORT: {{ $mw.clamd.port | quote }}
  {{- end }}
  {{- if eq $mw.scanner "icap" }}
  SANGAM_MALWARE_ICAP_URI: {{ required "malware.icap.uri is required with malware.scanner=icap" $mw.icap.uri | quote }}
  {{- end }}
  {{- $sec := .Values.secrets }}
  {{- with $sec.providers }}
  # M-075: platform secret providers (sangam.secrets.*); only rendered when providers is set (no bean otherwise)
  SANGAM_SECRETS_PROVIDERS: {{ . | quote }}
  {{- with $sec.cacheTtl }}
  SANGAM_SECRETS_CACHE_TTL: {{ . | quote }}
  {{- end }}
  {{- with $sec.file.root }}
  SANGAM_SECRETS_FILE_ROOT: {{ . | quote }}
  {{- end }}
  {{- range $k, $v := dict "URL" $sec.vault.url "MOUNT" $sec.vault.mount "PATH_PREFIX" $sec.vault.pathPrefix "NAMESPACE" $sec.vault.namespace "TOKEN_REF" $sec.vault.tokenRef }}
  {{- if $v }}
  SANGAM_SECRETS_VAULT_{{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  SANGAM_SECRETS_VAULT_ALLOW_PRIVATE: {{ $sec.vault.allowPrivate | quote }}
  {{- range $k, $v := dict "REGION" $sec.aws.region "ENDPOINT" $sec.aws.endpoint "NAME_PREFIX" $sec.aws.namePrefix "ACCESS_KEY_REF" $sec.aws.accessKeyRef "SECRET_KEY_REF" $sec.aws.secretKeyRef "SESSION_TOKEN_REF" $sec.aws.sessionTokenRef }}
  {{- if $v }}
  SANGAM_SECRETS_AWS_{{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- range $k, $v := dict "VAULT_URL" $sec.azure.vaultUrl "TENANT_ID" $sec.azure.tenantId "CLIENT_ID" $sec.azure.clientId "CLIENT_SECRET_REF" $sec.azure.clientSecretRef "AUTHORITY" $sec.azure.authority }}
  {{- if $v }}
  SANGAM_SECRETS_AZURE_{{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- range $k, $v := dict "PROJECT" $sec.gcp.project "SERVICE_ACCOUNT_KEY_REF" $sec.gcp.serviceAccountKeyRef "NAME_PREFIX" $sec.gcp.namePrefix "ENDPOINT" $sec.gcp.endpoint }}
  {{- if $v }}
  SANGAM_SECRETS_GCP_{{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $cell.id }}
  # SCALE cell (sangam-cell IR-1..IR-4). SANGAM_CELL_ID switches the cell on, so it is only rendered when set.
  SANGAM_CELL_ID: {{ $cell.id | quote }}
  SANGAM_CELL_REGION: {{ $cell.region | quote }}
  SANGAM_CELL_JURISDICTION: {{ required "scale.cell.jurisdiction is required with scale.cell.id (SL-104: no product default)" $cell.jurisdiction | quote }}
  SANGAM_CELL_RESIDENCY: {{ default $cell.jurisdiction $cell.residency | quote }}
  SANGAM_CELL_PUBLIC_URL: {{ required "scale.cell.publicUrl is required with scale.cell.id" $cell.publicUrl | quote }}
  SANGAM_CELL_ADMIN_URL: {{ default $cell.publicUrl $cell.adminUrl | quote }}
  SANGAM_CELL_CAPACITY_STARTS: {{ $cell.capacity.startsPerSec | quote }}
  SANGAM_CELL_CAPACITY_TENANTS: {{ $cell.capacity.tenants | quote }}
  SANGAM_CONTROL_PLANE_URL: {{ default (printf "http://%s-control-plane:8090" (include "sangam.fullname" .)) $cell.controlPlaneUrl | quote }}
  SANGAM_ROLLUP_INGEST_URL: {{ default (printf "http://%s-rollup:8095/api/v1/ingest" (include "sangam.fullname" .)) $cell.rollupIngestUrl | quote }}
  SANGAM_GATEWAY_URL: {{ default (printf "http://%s-gateway:8000" (include "sangam.fullname" .)) $cell.gatewayUrl | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sangam.fullname" . }}-server-config
  labels:
    {{- include "sangam.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  application-helm.yaml: |
    # Rendered from .Values.server.config (no secrets).
    {{- if .Values.server.config }}
    {{- toYaml .Values.server.config | nindent 4 }}
    {{- else }}
    {}
    {{- end }}
  {{- with (.Values.server.keyEnvironment | default dict).foreignFingerprints }}
  # Decision 385 (3): the key fingerprints of the other environments (no key, no secret)
  key-fingerprints.txt: |
    {{- . | nindent 4 }}
  {{- end }}
