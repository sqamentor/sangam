{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}
{{- if .Values.ingress.enabled }}
{{- $fullname := include "sangam.fullname" . -}}
{{- /* With the SCALE gateway enabled, API traffic enters through it (tenant -> cell routing). */ -}}
{{- $api := ternary (printf "%s-gateway" $fullname) (printf "%s-server" $fullname) .Values.scale.gateway.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "sangam.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ default (printf "%s-tls" $fullname) .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $api }}
                port: { name: http }
          - path: /engine-rest
            pathType: Prefix
            backend:
              service:
                name: {{ $api }}
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ if .Values.ui.enabled }}{{ $fullname }}-ui{{ else }}{{ $fullname }}-server{{ end }}
                port: { name: http }
{{- end }}
