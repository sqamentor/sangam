# National roll-up read model. Its own database; only counts and identifiers (no personal data, section 9).
server:
  port: ${SANGAM_RU_PORT:8095}
  shutdown: graceful
  error:
    include-stacktrace: never

spring:
  application:
    name: sangam-rollup
  datasource:
    url: ${SANGAM_RU_DB_URL:jdbc:h2:file:./data/rollup;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SANGAM_RU_DB_USER:sa}
    password: ${SANGAM_RU_DB_PASSWORD:}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      maximum-pool-size: ${SANGAM_RU_DB_POOL_SIZE:30}
      pool-name: sangam-rollup

sangam:
  rollup:
    tokens: ${SANGAM_RU_TOKENS:}
    shards: 16
    dedup-retention: 30d
    per-definition-metrics: true
    max-batch: 500
    # M-063 (SCALE-ARCHITECTURE 8.4 b): an ingest array is one transaction, deltas summed per (node, metric, day)
    pre-aggregate: ${SANGAM_RU_PRE_AGGREGATE:true}
    # M-063 (8.4 a) state-level tier: the node this instance serves (e.g. IN/RJ); empty = everything (national)
    scope: ${SANGAM_RU_SCOPE:}
    upstream:
      # ingest URL of the upper roll-up; empty = this is the top tier
      url: ${SANGAM_RU_UPSTREAM_URL:}
      token: ${SANGAM_RU_UPSTREAM_TOKEN:}
      instance-id: ${SANGAM_RU_INSTANCE_ID:}
      # deepest level forwarded (0 = root); empty = one level below the scope
      depth: ${SANGAM_RU_UPSTREAM_DEPTH:}
      interval: ${SANGAM_RU_UPSTREAM_INTERVAL:PT1M}
      send-interval: ${SANGAM_RU_UPSTREAM_SEND_INTERVAL:PT5S}
      max-batch: 200
      timeout: 10s

# Console logs are structured (ECS JSON), one JSON object per line: the encoder escapes every value, so text that
# reaches a log message from a request cannot start a second, forged log line (code scanning java/log-injection).
logging:
  structured:
    format:
      console: ecs

management:
  server:
    port: ${SANGAM_RU_MANAGEMENT_PORT:8096}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
