# DPDP Act 2023 s.5 and DPDP Rules 2025 Rule 3 notice template (English). Placeholders: {organisation}.
# Translations for the other Eighth Schedule languages: copy this file to notice_<code>.properties
# (as, bn, brx, doi, gu, hi, kn, ks, kok, mai, ml, mni, mr, ne, or, pa, sa, sat, sd, ta, te, ur)
# and load it with NoticeCatalogue.loadDirectory or NoticeCatalogue.register.
title=Notice for processing of your personal data
intro={organisation} will process the personal data listed below, only for the purposes stated. This notice stands on its own; please read it before you give consent.
data.heading=Personal data we will process
purposes.heading=Why we need it and what it enables
withdraw=You can withdraw your consent at any time, as easily as you gave it, at
rights=To access, correct, complete, update or erase your data, to nominate a person, or to raise a grievance, use
complaint=If your grievance is not resolved, you may complain to the Data Protection Board of India at
contact.heading=Contact for questions about the processing of your personal data
consent.action=I agree to the processing of my personal data for the purposes I have selected above.
guardian=This consent is being given by the parent or lawful guardian of the Data Principal.
intimation.title=Intimation of processing of your personal data
intimation.intro={organisation} is processing your personal data under section 7(b) of the Digital Personal Data Protection Act, 2023 to provide the benefit, service, certificate, licence or permit described below.
policy.title=Privacy policy
policy.intro=This policy describes how {organisation} processes personal data.
policy.activities=Processing activities
policy.security=We protect personal data with reasonable security safeguards, including encryption, access control, logging and monitoring, and backups.
erasure.subject=Your personal data will be erased
erasure.body=Your personal data held by {organisation} for the purpose "{purpose}" will be erased on {date} unless you log in, contact us or exercise your rights before then.
breach.subject=Personal data breach affecting you
