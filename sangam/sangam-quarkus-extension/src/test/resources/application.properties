# SPDX-License-Identifier: Apache-2.0
# Test configuration of the Quarkus host (M-150 harness). QuarkusHostHarness overrides the JDBC URL per start (a
# private in-memory database) and, for a start without shared-transaction, quarkus.datasource.jdbc.transactions.
# No JDBC driver extension (quarkus-jdbc-h2 is held by the D-5 licence review): H2 2.3.232 (test scope) as a custom
# database kind with an explicit driver. MODE=PostgreSQL: the only H2 mode Sangam's database guard accepts.
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.h2.Driver
quarkus.datasource.jdbc.url=jdbc:h2:mem:quarkus-conformance;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000;MODE=PostgreSQL
quarkus.datasource.username=sa
quarkus.devservices.enabled=false
quarkus.operaton.generic-config.database-schema-update=true
quarkus.operaton.generic-config.job-executor-activate=false
