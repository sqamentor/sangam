# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sangam-sdk"
version = "0.1.0"
description = "Typed REST client and external-worker runtime for the Sangam workflow platform (/api/v1)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sangam contributors" }]
keywords = ["workflow", "bpmn", "operaton", "external-task", "worker", "sangam"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# Zero runtime dependencies: HTTP is urllib.request from the standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/sqamentor/sangam"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sangam_sdk = ["py.typed"]
