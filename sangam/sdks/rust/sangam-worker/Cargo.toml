# SPDX-License-Identifier: Apache-2.0
# Tier-2 Rust SDK (ADR-D-4, M-022): the worker-loop helper. The REST client is generated by sdks/tier2/generate_tier2.py.
[package]
name = "sangam-worker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Minimal Sangam external-worker loop (VI.3 lease fencing, heartbeats, Idempotency-Key per operation) over a pluggable HTTP transport."
rust-version = "1.70"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
