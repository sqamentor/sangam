# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sangam-sdk-fastapi"
version = "0.1.0"
description = "FastAPI / Starlette lifespan adapter for the Sangam Python SDK worker (M-027)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sangam contributors" }]
keywords = ["workflow", "worker", "fastapi", "starlette", "sangam"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
    # decision 131 (C-16, RM-48): deferred past 0.1.0 and never published; PyPI refuses any upload that carries a
    # "Private ::" classifier, so this distribution cannot enter the publish set by mistake
    "Private :: Do Not Upload",
]
# Checked against FastAPI 0.135.3 / Starlette 1.0.0 (lifespan = app -> async context manager; Router.lifespan_context).
dependencies = ["sangam-sdk==0.1.0", "fastapi>=0.135", "starlette>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sangam_sdk_fastapi = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]