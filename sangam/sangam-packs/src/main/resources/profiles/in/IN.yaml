# SPDX-License-Identifier: Apache-2.0
# Sangam configuration profile (data, not code; ADR-D-20). Values marked under "placeholders" are [U]:
# unverified in the research pass and must be confirmed from the government's own orders before go-live.
profile:
  id: IN
  layer: jurisdiction
  version: 2026.11.0
  effectiveFrom: '2017-04-01'
  extends:
  - REGIME-WESTMINSTER-SUPPLY
  name:
    en: 'India: national public-finance reference'
    hi: 'भारत: राष्ट्रीय लोक वित्त संदर्भ'
  source: Art. 150; GAR 1990; LMMH (CGA, slips to CS 1132 of 16-10-2026); GFR 2017; DFPR 2024; RPR 2022; SNA-SPARSH (DoE 13-07-2023,
    CGA OM 53 of 26-06-2025); IFMS-CENTRAL / IFMS-STATES
placeholders:
- path: classification.seedStatus
  reason: 'major heads seeded (verified sample + [U] rows per LMMH pattern); major-specific minor heads not seeded: load the
    official CGA LMMH file'
- path: snaSparsh.allCssFrom
  reason: DoE OM 10-06-2025 date taken from research table (V)
- path: crosswalks.OBJECT_2026_TO_2027
  reason: '[U] 61-head list and mapping not yet loaded'
locked:
- classification.schemes.HOA.segments
- snaSparsh.motherSanction
- snaSparsh.cutoff
locale:
  zone: Asia/Kolkata
  currency: INR
  symbol: ₹
  grouping:
    first: 3
    rest: 2
  units:
    L: 100000
    CR: 10000000
  fiscal:
    startMonth: 4
    startDay: 1
    label: START-END2
  languages:
  - tag: hi
    script: Deva
    default: true
  - tag: en
    script: Latn
  calendars:
    settlement:
      weekend:
      - SUNDAY
      cutoffs:
        paymentFile: '15:00'
      note: e-Kuber holidays are loaded yearly from the RBI calendar (connector or data file)
    government:
      weekend:
      - SATURDAY
      - SUNDAY
classification:
  seedStatus: PARTIAL
  schemes:
  - id: HOA
    separator: '-'
    segments:
    - id: major
      width: 4
      master: true
      owner: jurisdiction
    - id: subMajor
      width: 2
      master: true
      owner: jurisdiction
    - id: minor
      width: 3
      master: true
      owner: jurisdiction
    - id: subHead
      width: 2
    - id: detailed
      width: 2
    - id: object
      width: 2
      scheme: OBJECT
    attributes:
    - chargedVoted
    - grantNo
    - schemeType
    - tags
    derive:
    - segment: major
      prefix: '0'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '1'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '2'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      prefix: '3'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      equals: '4000'
      set:
        section: CAPITAL
        nature: RECEIPT
    - segment: major
      prefix: '4'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '5'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '6'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      prefix: '7'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      equals: '8000'
      set:
        section: CONTINGENCY_FUND
        nature: BOTH
    - segment: major
      prefix: '8'
      set:
        section: PUBLIC_ACCOUNT
        nature: BOTH
    - segment: major
      matches: 255[2]|455[2]|655[2]
      set:
        nerLumpSum: true
    - segment: minor
      matches: 9\d\d
      set:
        deductEntry: true
    - segment: minor
      equals: '791'
      set:
        exchangeDifference: true
    ruleRef: DFPR 2024 r.8(5)(i) (6 tiers / 15 digits); LMMH coding pattern
  - id: OBJECT
    separator: '-'
    segments:
    - id: object
      width: 2
      master: true
    ruleRef: DFPR 2024 Annexure I; object heads are data with old -> new mapping (IFC-034)
  combinations:
  - scheme: HOA
    if:
      major: 4*|5*
    forbid:
      object: 01|02|04|11|12|13
    ruleRef: capital section may not carry establishment object heads (illustrative; confirm per DDG)
  tags:
  - id: CHARGED_VOTED
    values:
    - CHARGED
    - VOTED
  - id: SCHEME_TYPE
    values:
    - CS
    - CSS
    - ESTABLISHMENT
    - OTHER
  - id: PLAN_LEGACY
    values:
    - PLAN
    - NON_PLAN
    note: history only (merged by DoE OM 05-08-2016)
  objectHeadVersioning:
    currentValidTo: '2027-04-01'
    newListFrom: '2027-04-01'
    newList: 'DoE OM 09-06-2026: 61 heads in 8 classes (load the list; mapping old -> new is a crosswalk)'
seeds:
- scheme: HOA
  file: in/seeds/hoa-major-heads.csv
- scheme: HOA
  file: in/seeds/hoa-standard-minor-heads.csv
- scheme: OBJECT
  file: in/seeds/object-heads.csv
