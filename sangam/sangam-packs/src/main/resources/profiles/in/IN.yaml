snaSparsh:
  motherSanction:
    onePerSls: true
    lapseAt: '23:59'
    lapseOn: FISCAL_YEAR_END
    ruleRef: CGA OM 53 of 26-06-2025
  cutoff:
    calendar: settlement
    name: paymentFile
    time: '15:00'
    nextBusinessDay: true
  reissueTag: true
  reconciliationUnit: TREASURY
  noTransferToPd: true
  allCssFrom: '2025-11-01'
  chains:
    DEFAULT:
    - PD_CHECKER
    - PR_AO
    - PAO
    LEGACY_7_ROLE:
    - PD_MAKER
    - PD_CHECKER
    - PR_AO
    - BILL_DISTRIBUTOR
    - PAO_DH
    - PAO_AAO
    - PAO
  ruleRefs:
  - DoE 13-07-2023
  - CGA SOP 11-08-2025 (3-role flow)
  - CGA FAQ OM 115 of 25-09-2025
  - DoE OM 10-06-2025
