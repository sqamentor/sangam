    label: RBI e-Kuber
    connector: rail.ekuber
    capabilityClass: c
  - id: AGENCY_BANK
    label: Agency bank cash-management product
    connector: rail.agencyBank
    capabilityClass: c
  - id: STATE_OWNED_BANK
    label: State-owned government bank (cheque / draft)
    connector: rail.stateBank
    capabilityClass: c
  - id: TREASURY_CHEQUE
    label: Treasury cheque
    connector: rail.cheque
    capabilityClass: b
  - id: LETTER_OF_CREDIT
    label: Letter of credit / CCL-DCL for cheque-drawing divisions
    connector: rail.loc
    capabilityClass: b
  - id: PFMS
    label: PFMS payment file
    connector: pfms.payment
    capabilityClass: c
  - id: APBS
    label: NPCI Aadhaar payment bridge
    connector: rail.apbs
    capabilityClass: c
  - id: FOREIGN_CURRENCY_ADVICE
    label: Accredited-bank foreign-currency advice
    connector: rail.fcy
