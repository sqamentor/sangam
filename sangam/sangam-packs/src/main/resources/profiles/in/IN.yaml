      core:
      - 60
      - 40
      optional:
      - 50
      - 50
    NE_HIMALAYAN:
      core:
      - 90
      - 10
      optional:
      - 80
      - 20
    UT_WITHOUT_LEGISLATURE:
      core:
      - 100
      - 0
      optional:
      - 100
      - 0
  ruleRef: NITI Sub-Group of CMs 2016-17
paymentRails:
