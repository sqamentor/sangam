# SPDX-License-Identifier: Apache-2.0
# Sangam configuration profile (data, not code; ADR-D-20). Values marked under "placeholders" are [U]:
# unverified in the research pass and must be confirmed from the government's own orders before go-live.
profile:
  id: MN
  layer: government
  version: 2026.11.0
  effectiveFrom: '2026-04-01'
  extends:
  - IN
  - IN-PRESET-NE-HIMALAYAN
  name:
    en: Manipur
    hi: मणिपुर
  source: IFMS-STATES-REQUIREMENTS.md section 1 and 4 (sources MN1-MN3, accessed 2026-11-04)
placeholders:
- path: chartOfAccounts
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (state digit
    structure not found)'
- path: locale.documentLanguages
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (budget-document
    language)'
- path: delegation.tables
  reason: '[U] financial-powers and procurement-mode tables are central defaults until the State order is loaded'
- path: delegation.rows
  reason: '[U] values to load from the State delegation / procurement rules'
evidence:
  fieldsVerifiedOf8: 6
  sources: MN1-MN3
locale:
  languages:
  - tag: mni
    script: Mtei
    scope: statewide
    docClass:
    - statutory
    default: true
  - tag: en
    script: Latn
    scope: statewide
    docClass:
    - statutory
  documentLanguages:
    treasuryForms: STATUTORY_PLUS_ENGLISH
    accounts:
    - en
    status: P
integrations:
  systems:
  - TreasuryNet
  - BEAMS (2014)
  - eGRAS (2021)
  - e-Budget (2022)
  - Cyber Treasury
  snaSparsh:
    onboarded: '2024-12-17'
  ekuber: true
orgTopology:
  directorate: Directorate of Treasuries & Accounts
  unitTypes:
    DISTRICT_TREASURY: 12
    SUB_TREASURY: 7
    CYBER_TREASURY_RECEIPTS: 1
  ddoCount: null
  units: 'seed: load the unit register (code, type, banking, renditionParent, agencyBank, owningGovernment, servedGovernments,
    physicalState, effectiveFrom)'
rulebooks:
  citationsOnValidation: true
  own:
  - id: MN_DFPR_1995
    title: Manipur DFPR 1995 (amended 2012, 29-10-2024)
  - id: MN_MFP_1999
    title: Manual of Financial Procedure 1999
  - id: CTR_VOL1
    title: CTR (as adopted)
paymentRails:
  default: CENTRAL_BANK_SETTLEMENT
  soleAgencyBank: CENTRAL_BANK_SETTLEMENT
  since: '2020-02-11'
budgetControl:
  stages:
  - RELEASE
  - BEAMS_SLIP
subStateEntities:
- id: HILL_ADCS
  type: STATE_ACT_COUNCIL
  financeOfficerVetting: true
pension:
  lifeProof:
  - PHOTO_SIX_MONTHLY
hillAreaFlag: true
classification:
  schemes:
  - id: HOA_MN
    separator: '-'
    segments:
    - id: major
      width: 4
      scheme: HOA
      owner: jurisdiction
    - id: subMajor
      width: 2
      scheme: HOA
      owner: jurisdiction
    - id: minor
      width: 3
      scheme: HOA
      owner: jurisdiction
    - id: subHead
      width: 2
    - id: detailed
      width: 2
    - id: object
      width: 2
    derive:
    - segment: major
      prefix: '0'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '1'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '2'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      prefix: '3'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      equals: '4000'
      set:
        section: CAPITAL
        nature: RECEIPT
    - segment: major
      prefix: '4'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '5'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '6'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      prefix: '7'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      equals: '8000'
      set:
        section: CONTINGENCY_FUND
        nature: BOTH
    - segment: major
      prefix: '8'
      set:
        section: PUBLIC_ACCOUNT
        nature: BOTH
    - segment: major
      matches: 255[2]|455[2]|655[2]
      set:
        nerLumpSum: true
    - segment: minor
      matches: 9\d\d
      set:
        deductEntry: true
    - segment: minor
      equals: '791'
      set:
        exchangeDifference: true
    example: 2225 02 001 01 00 01
    evidence: V
    source: MN DMD-14 2026-27
  defaultScheme: HOA_MN
  note: segments below the minor head are set by each government (LMMH GD 1.1, IFS-001)
procurement:
  family: RULES
  rule: Manipur Public Procurement Policy 2022
  worksCode: '[U]'
delegation:
  tables:
  - key: ifms-financial-powers
    file: in/dmn/MN/ifms-financial-powers.dmn
    deployAs: TENANT_OVERRIDE
    tenant: MN
    inputs:
    - seatRole
    - caseType
    outputs:
    - allowed
    - maxAmount
    - ruleRef
    status: U
  - key: ifms-procurement-mode
    file: in/dmn/MN/ifms-procurement-mode.dmn
    deployAs: TENANT_OVERRIDE
    tenant: MN
    inputs:
    - amount
    - scientificDepartment
    outputs:
    - procurementMode
    - ruleRef
    status: U
  rows:
    financialPowers:
    - role: DDO
      maxAmount: null
      ruleRef: '[U] central default, replace from Manipur Public Procurement Policy 2022 (was: RPR 2022: DDO draws within
        a sanction; no sanction power of its own)'
    - role: HOO
      maxAmount: null
      ruleRef: '[U] central default, replace from Manipur Public Procurement Policy 2022 (was: DFPR 2024 r.12(4) and department
        re-delegation order [U value])'
    - role: HOD
      maxAmount: null
      ruleRef: '[U] central default, replace from Manipur Public Procurement Policy 2022 (was: DFPR 2024 r.12(2) re-delegation
        to HoD [U value])'
    - role: SECRETARY
      maxAmount: null
      ruleRef: '[U] central default, replace from Manipur Public Procurement Policy 2022 (was: DFPR 2024 r.11 (open / limited
        tender up to 100 cr))'
    - role: MINISTER
      maxAmount: null
      ruleRef: '[U] central default, replace from Manipur Public Procurement Policy 2022 (was: DFPR 2024 r.11: above the Secretary;
        no upper limit in this table)'
    - role: FA
      maxAmount: null
      ruleRef: '[U] central default, replace from Manipur Public Procurement Policy 2022 (was: advice / concurrence only)'
    procurementThresholds:
      direct: null
      gemL1: null
      limitedTender: null
      limitedTenderScientific: null
