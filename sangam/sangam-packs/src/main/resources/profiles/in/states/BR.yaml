# SPDX-License-Identifier: Apache-2.0
# Sangam configuration profile (data, not code; ADR-D-20). Values marked under "placeholders" are [U]:
# unverified in the research pass and must be confirmed from the government's own orders before go-live.
profile:
  id: BR
  layer: government
  version: 2026.11.0
  effectiveFrom: '2026-04-01'
  extends:
  - IN
  - IN-PRESET-GENERAL
  name:
    en: Bihar
    hi: बिहार
  source: IFMS-STATES-REQUIREMENTS.md section 1 and 4 (sources BR1-BR2, accessed 2026-11-04)
placeholders:
- path: chartOfAccounts
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (state digit
    structure not found)'
- path: locale.documentLanguages
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (budget-document
    language)'
- path: delegation.tables
  reason: '[U] financial-powers and procurement-mode tables are central defaults until the State order is loaded'
- path: delegation.rows
  reason: '[U] values to load from the State delegation / procurement rules'
evidence:
  fieldsVerifiedOf8: 8
  sources: BR1-BR2
locale:
  languages:
  - tag: hi
    script: Deva
    scope: statewide
    docClass:
    - statutory
    default: true
  - tag: ur
    script: Arab
    scope: statewide
    docClass:
    - statutory
    note: additional
    direction: rtl
  - tag: en
    script: Latn
    scope: statewide
    docClass:
    - accounts
    - audit
    note: accounts and audit outputs are usually English (IFMS-STATES 9.1)
  documentLanguages:
    treasuryForms: STATUTORY_PLUS_ENGLISH
    accounts:
    - en
    status: P
integrations:
  systems:
  - CFMS 2.0
  snaSparsh:
    hosting: BILL_TYPE
  ekuber: true
orgTopology:
  directorate: null
  unitTypes:
    DISTRICT_TREASURY: 76
  ddoCount: null
  units: 'seed: load the unit register (code, type, banking, renditionParent, agencyBank, owningGovernment, servedGovernments,
    physicalState, effectiveFrom)'
rulebooks:
  citationsOnValidation: true
  own:
  - id: BTC_2011
    title: Bihar Treasury Code 2011
  - id: BFR
    title: Bihar Financial Rules
  - id: BBM
    title: Bihar Budget Manual
paymentRails:
  default: CENTRAL_BANK_SETTLEMENT
documentTypes:
- id: BR_BTC_FORM_8
  formNumber: BTC-FORM-8
  family: REGISTER
  approvalChain: TREASURY_STD
  sanction: REFERENCE
  integrations: {}
approvalChains:
- id: TREASURY_STD
  steps:
  - role: DEALING_ASSISTANT
  - role: ACCOUNTANT
  - role: TREASURY_OFFICER
    sign: true
  returnBy:
  - TREASURY_OFFICER
  mayEdit: false
  queue:
    token: true
    tokenSeries: TOKEN
    fifo: true
orgTiers:
- FINANCE_DEPARTMENT
- TREASURY
acDc:
  enabled: true
publicAccounts:
  localBodyHeads:
  - 8448-00-102-0001
  - 8448-00-102-0002
  - 8448-00-102-0003
cashWorkflows: false
auditTrail:
  mandatory: true
  canDisable: false
legacyFonts:
- KRUTI_DEV
classification:
  schemes:
  - id: HOA_BR
    separator: '-'
    segments:
    - id: demand
      width: 2
    - id: major
      width: 4
      scheme: HOA
      owner: jurisdiction
    - id: subMajor
      width: 2
      scheme: HOA
      owner: jurisdiction
    - id: minor
      width: 3
      scheme: HOA
      owner: jurisdiction
    - id: subHead
      width: 4
    - id: detailed
      width: 2
    - id: subDetailed
      width: 2
    - id: votedCharged
      width: 1
      pattern: '[A-Z]'
      optional: true
    derive:
    - segment: major
      prefix: '0'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '1'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '2'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      prefix: '3'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      equals: '4000'
      set:
        section: CAPITAL
        nature: RECEIPT
    - segment: major
      prefix: '4'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '5'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '6'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      prefix: '7'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      equals: '8000'
      set:
        section: CONTINGENCY_FUND
        nature: BOTH
    - segment: major
      prefix: '8'
      set:
        section: PUBLIC_ACCOUNT
        nature: BOTH
    - segment: major
      matches: 255[2]|455[2]|655[2]
      set:
        nerLumpSum: true
    - segment: minor
      matches: 9\d\d
      set:
        deductEntry: true
    - segment: minor
      equals: '791'
      set:
        exchangeDifference: true
    example: 12-2054-00-097-0001-01-01 V
    evidence: V
    source: BICA budget material
  defaultScheme: HOA_BR
  note: segments below the minor head are set by each government (LMMH GD 1.1, IFS-001)
procurement:
  family: RULES
  rule: BFR procurement chapter (r.124-131ZZB)
  worksCode: Bihar PWD Code
delegation:
  tables:
  - key: ifms-financial-powers
    file: in/dmn/BR/ifms-financial-powers.dmn
    deployAs: TENANT_OVERRIDE
    tenant: BR
    inputs:
    - seatRole
    - caseType
    outputs:
    - allowed
    - maxAmount
    - ruleRef
    status: U
  - key: ifms-procurement-mode
    file: in/dmn/BR/ifms-procurement-mode.dmn
    deployAs: TENANT_OVERRIDE
    tenant: BR
    inputs:
    - amount
    - scientificDepartment
    outputs:
    - procurementMode
    - ruleRef
    status: U
  rows:
    financialPowers:
    - role: DDO
      maxAmount: null
      ruleRef: '[U] central default, replace from BFR procurement chapter (r.124-131ZZB) (was: RPR 2022: DDO draws within
        a sanction; no sanction power of its own)'
    - role: HOO
      maxAmount: null
      ruleRef: '[U] central default, replace from BFR procurement chapter (r.124-131ZZB) (was: DFPR 2024 r.12(4) and department
        re-delegation order [U value])'
    - role: HOD
      maxAmount: null
      ruleRef: '[U] central default, replace from BFR procurement chapter (r.124-131ZZB) (was: DFPR 2024 r.12(2) re-delegation
        to HoD [U value])'
    - role: SECRETARY
      maxAmount: null
      ruleRef: '[U] central default, replace from BFR procurement chapter (r.124-131ZZB) (was: DFPR 2024 r.11 (open / limited
        tender up to 100 cr))'
    - role: MINISTER
      maxAmount: null
      ruleRef: '[U] central default, replace from BFR procurement chapter (r.124-131ZZB) (was: DFPR 2024 r.11: above the Secretary;
        no upper limit in this table)'
    - role: FA
      maxAmount: null
      ruleRef: '[U] central default, replace from BFR procurement chapter (r.124-131ZZB) (was: advice / concurrence only)'
    procurementThresholds:
      direct: null
      gemL1: null
      limitedTender: null
      limitedTenderScientific: null
