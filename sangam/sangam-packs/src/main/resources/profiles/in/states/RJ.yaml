  resolution: CATALOGUE_ID
  formNumberPrefix: '<government profile id>:'
  provenanceLabels:
  - VERIFIED
  - INFERRED
  - ASSUMED
  - UNKNOWN
  provenanceFields:
  - formKind
  - formNumber
  - billTypeCode
  - typeId
  - name
  note: 'A bill type is resolved by its catalogue id; one form can carry several bill types, so a form number alone may be
    ambiguous. typeId ASSUMED: the row id is the Sangam-assigned catalogue id; the government holds no document-type id. Forms
    that are not bills are listed under formTemplates and are never resolved as bill types.'
