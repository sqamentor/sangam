    - id: major
      width: 4
      scheme: HOA
      owner: jurisdiction
    - id: subMajor
      width: 2
      scheme: HOA
      owner: jurisdiction
    - id: minor
      width: 3
      scheme: HOA
      owner: jurisdiction
    - id: subHead
      width: 2
    - id: groupHead
      width: 2
      optional: true
    - id: object
      width: 2
    derive:
    - segment: major
      prefix: '0'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '1'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '2'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      prefix: '3'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      equals: '4000'
      set:
        section: CAPITAL
        nature: RECEIPT
    - segment: major
      prefix: '4'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '5'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '6'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      prefix: '7'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      equals: '8000'
      set:
        section: CONTINGENCY_FUND
        nature: BOTH
    - segment: major
      prefix: '8'
      set:
        section: PUBLIC_ACCOUNT
        nature: BOTH
    - segment: major
      matches: 255[2]|455[2]|655[2]
      set:
        nerLumpSum: true
    - segment: minor
      matches: 9\d\d
      set:
        deductEntry: true
    - segment: minor
      equals: '791'
      set:
        exchangeDifference: true
    example: 4202 01 202 (01) [90] 17
    evidence: V
    source: RJ Budget Manual Vol-I s.3.11
