  - IN
  - IN-PRESET-GENERAL
  name:
    en: Rajasthan
    hi: राजस्थान
  source: IFMS-STATES-REQUIREMENTS.md section 1 and 4 (sources RJ1-RJ4, accessed 2026-11-04)
