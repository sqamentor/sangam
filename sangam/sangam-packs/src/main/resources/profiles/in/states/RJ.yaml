  reason: '[U] ASSUMED: the ledger stage of the pool authorisation; RJ names no stages'
- path: budgetControl.pool.financeExpenditureConsent
  reason: '[U] UNKNOWN: FD (Expenditure) consent and FD (Budget) approval as one seat chain or two (an open consumer question)'
