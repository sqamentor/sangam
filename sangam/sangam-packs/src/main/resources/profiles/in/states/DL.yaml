    file: in/dmn/DL/ifms-financial-powers.dmn
    deployAs: TENANT_OVERRIDE
    tenant: DL
    inputs:
    - seatRole
    - caseType
    outputs:
    - allowed
    - maxAmount
    - ruleRef
    status: U
  - key: ifms-procurement-mode
    file: in/dmn/DL/ifms-procurement-mode.dmn
    deployAs: TENANT_OVERRIDE
    tenant: DL
    inputs:
    - amount
    - scientificDepartment
    outputs:
    - procurementMode
    - ruleRef
    status: U
  rows:
    financialPowers:
    - role: DDO
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: RPR 2022: DDO draws within a sanction; no sanction power
        of its own)'
    - role: HOO
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: DFPR 2024 r.12(4) and department re-delegation order [U value])'
    - role: HOD
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: DFPR 2024 r.12(2) re-delegation to HoD [U value])'
    - role: SECRETARY
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: DFPR 2024 r.11 (open / limited tender up to 100 cr))'
    - role: MINISTER
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: DFPR 2024 r.11: above the Secretary; no upper limit in this
        table)'
    - role: FA
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: advice / concurrence only)'
    procurementThresholds:
      direct: null
      gemL1: null
      limitedTender: null
      limitedTenderScientific: null
