# Sangam configuration profile (data, not code; ADR-D-20). Values marked under "placeholders" are [U]:
# unverified in the research pass and must be confirmed from the government's own orders before go-live.
profile:
  id: DL
  layer: government
  version: 2026.11.0
  effectiveFrom: '2026-04-01'
  extends:
  - IN
  - IN-PRESET-UT-LEG
  name:
    en: Delhi (NCT)
    hi: दिल्ली
  source: IFMS-STATES-REQUIREMENTS.md section 1 and 4 (sources DL1-DL2, accessed 2026-11-04)
placeholders:
- path: integrations.newIfms
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (new IFMS Rs
    261.66 cr)'
- path: chartOfAccounts
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (state digit
    structure not found)'
- path: delegation.tables
  reason: '[U] financial-powers and procurement-mode tables are central defaults until the State order is loaded'
- path: delegation.rows
  reason: '[U] values to load from the State delegation / procurement rules'
evidence:
  fieldsVerifiedOf8: 7
  sources: DL1-DL2
locale:
  languages:
  - tag: hi
    script: Deva
    scope: statewide
    docClass:
    - statutory
    default: true
  - tag: en
    script: Latn
    scope: statewide
    docClass:
    - statutory
  - tag: pa
    script: Guru
    scope: statewide
    docClass:
    - statutory
    note: second (OL Act 2000)
  - tag: ur
    script: Arab
    scope: statewide
    docClass:
    - statutory
    note: second (OL Act 2000)
    direction: rtl
  documentLanguages:
    treasuryForms: STATUTORY_PLUS_ENGLISH
    accounts:
    - en
    status: V
integrations:
  systems:
  - Delhi NIC Pay Roll
  - GPF
  - Delhi e-Lekha
  - SGST reconciliation
  snaSparsh: {}
orgTopology:
  directorate: Controller of Accounts
  unitTypes:
    PRINCIPAL_PAO: 1
    PAO: 25
  ddoCount: null
  units: 'seed: load the unit register (code, type, banking, renditionParent, agencyBank, owningGovernment, servedGovernments,
    physicalState, effectiveFrom)'
rulebooks:
  citationsOnValidation: true
  own:
  - id: RPR1983
    title: R&P Rules 1983 (as applied)
  - id: GAR1990
    title: GAR 1990
paymentRails:
  default: PFMS
treasury:
  model: PAO
accounts:
  feeds:
  - DELHI_ELEKHA
  - CGA_PFMS
receipts:
  sgstReconciliation: true
unionDemand: 57
payroll:
  lpcCapture: true
  gpfCapture: true
classification:
  schemes:
  - id: HOA_DL
    separator: '-'
    segments:
    - id: major
      width: 4
      scheme: HOA
      owner: jurisdiction
    - id: subMajor
      width: 2
      scheme: HOA
      owner: jurisdiction
    - id: minor
      width: 3
      scheme: HOA
      owner: jurisdiction
    - id: subHead
      width: 2
    - id: detailed
      width: 2
    - id: object
      width: 2
    derive:
    - segment: major
      prefix: '0'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '1'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '2'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      prefix: '3'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      equals: '4000'
      set:
        section: CAPITAL
        nature: RECEIPT
    - segment: major
      prefix: '4'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '5'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '6'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      prefix: '7'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      equals: '8000'
      set:
        section: CONTINGENCY_FUND
        nature: BOTH
    - segment: major
      prefix: '8'
      set:
        section: PUBLIC_ACCOUNT
        nature: BOTH
    - segment: major
      matches: 255[2]|455[2]|655[2]
      set:
        nerLumpSum: true
    - segment: minor
      matches: 9\d\d
      set:
        deductEntry: true
    - segment: minor
      equals: '791'
      set:
        exchangeDifference: true
    example: 2052 00 090 60 00 01
    evidence: V
    source: Delhi finance d-11
  defaultScheme: HOA_DL
  note: segments below the minor head are set by each government (LMMH GD 1.1, IFS-001)
procurement:
  family: CENTRAL
  rule: GFR 2017
  worksCode: CPWD Works Manual
delegation:
  tables:
