# Register E-26 (owner 2026-11-21, "Add bill journey"): what the demo sandbox answers for the outside checks of the bill
# journey, for a tenant listed in sangam.demo.sandbox-tenants ONLY (DemoSandbox.CHECK_CONNECTORS and DemoSandbox.CHECKS).
# SIMULATOR DATA, never the answer of an outside system: every result carries sandbox=true and its audit record says
# simulated=true. Exactly one line per connector of DemoSandbox.CHECK_CONNECTORS (checked at start; a connector that
# is not listed here is never answered by the sandbox). Format: <connector>=<simulator directive>, as in
# demo-answers.properties; an empty directive leaves the answer to the simulator itself.
#
# ifms.duplicateBill: "no duplicate or similar claim found", for every bill. The sandbox does not look for duplicates.
#   Source: the answer the presentation data set uses on H2 (deploy/presentation/data/ifms-jaipur-fy2026-27.json,
#   h2Simulator.systems.sim_ifms_duplicateBill). Closing condition: a real IFMS endpoint answers the check.
ifms.duplicateBill=duplicate=false
# docs.issue: a document number DOC/<8 characters> for the issued document (payment advice, sanction order, rejection
#   order), the same number on a repeat of the same operation. No document is rendered. Source: the simulator's own
#   answer (SimulatorConnectorGateway.effectData). Closing condition: a document service is bound to docs.issue.
docs.issue=
