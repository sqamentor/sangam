# SPDX-License-Identifier: Apache-2.0
# M-150 golden business results of the cross-host equivalence scenarios (EquivalenceScenarios), kit version 1.
# Key = <scenario>.<result name>; value = BusinessResult canonical text. Every host must produce exactly these values
# for the fixed models of ConformanceModels. Change a value only together with the model or scenario that changes it
# (a new kit version), never to make one host pass.

# money: the fee rule (DMN, hit policy UNIQUE) at its pinned latest version, amounts and charges in minor units
decision-fee.decisionKey=conformance_fee
decision-fee.fee.99999=[{feeMinor=1500}]
decision-fee.fee.100000=[{feeMinor=2500}]
decision-fee.fee.2500000=[{feeMinor=5000}]
decision-fee.version.99999.pinned=true
decision-fee.version.100000.pinned=true
decision-fee.version.2500000.pinned=true
decision-fee.digest.repeatable=true

# money and audit: the same rule evaluated inside a process step; the evidence chain of the business key verifies
process-fee.processDefinitionKey=conformance_fee_process
process-fee.feeMinor=2500
process-fee.amountMinor=250000
process-fee.activeActivityIds=[review]
process-fee.ended=false
process-fee.tenant.matches=true
process-fee.audit.ok=true

# authorization: another tenant's administrator gets not-found (existence is not disclosed) and changes nothing
cross-tenant.read=refused-404
cross-tenant.variables=refused-404
cross-tenant.setVariables=refused-404
cross-tenant.feeMinor.unchanged=1500

# duplicate prevention: one execution; replay of the stored response; another body under the key is refused
idempotent-replay.first=Claimed
idempotent-replay.first.status=201
idempotent-replay.replay=Replay
idempotent-replay.replay.status=201
idempotent-replay.replay.sameBody=true
idempotent-replay.replay.resourceRef=charge/1
idempotent-replay.reuse=Rejected
idempotent-replay.reuse.status=422
idempotent-replay.reuse.code=IDEMPOTENCY_KEY_REUSED
idempotent-replay.invalidKey=Rejected
idempotent-replay.invalidKey.status=400
idempotent-replay.invalidKey.code=IDEMPOTENCY_KEY_INVALID
idempotent-replay.executions=1

# RM-30 duplicate prevention: one message id is accepted once per tenant (INBOX key tenant, source, message id)
inbox-dedupe.first=ACCEPTED
inbox-dedupe.first.state=RECEIVED
inbox-dedupe.redelivery=DUPLICATE
inbox-dedupe.changedBody=DUPLICATE
inbox-dedupe.otherTenant=ACCEPTED
inbox-dedupe.unknown.state=none
inbox-dedupe.missingId=refused-400

# RM-30 audit: an event altered in the database is found by the chain verification, at that event
audit-tamper.recorded=2
audit-tamper.before.ok=true
audit-tamper.before.events=2
audit-tamper.after.ok=false
audit-tamper.after.firstBad.isFirstEvent=true

# RM-30 job fencing. (1) An expired lease is ended by the expiry (A-10; the default policy holds the work, no re-offer)
# and every call under it is 409 STALE_LEASE and changes nothing. (2) A released lease is taken over by another worker
# (same work and operation id, a higher fencing token); the old token is refused, the current lease completes.
job-fencing.expired.refetch.count=0
job-fencing.expired.stale.complete=refused-409-STALE_LEASE
job-fencing.expired.stale.extend=refused-409-STALE_LEASE
job-fencing.expired.stale.fail=refused-409-STALE_LEASE
job-fencing.expired.active=[charge]
job-fencing.expired.chargedBy=null
job-fencing.released.unlock=ok
job-fencing.takeover.count=1
job-fencing.takeover.sameWork=true
job-fencing.takeover.lockVersion.greater=true
job-fencing.takeover.sameOperation=true
job-fencing.released.stale.complete=refused-409-STALE_LEASE
job-fencing.released.stale.extend=refused-409-STALE_LEASE
job-fencing.released.stale.fail=refused-409-STALE_LEASE
job-fencing.released.active=[charge]
job-fencing.released.chargedBy=null
job-fencing.current.complete=ok
job-fencing.after.active=[review]
job-fencing.after.chargedBy=conformance-worker-2

# RM-30 P-1: in the transaction of a fenced lease an audit event (product row) and a process variable (engine step)
# roll back together on a failure injected after both, and commit together without it
p1-rollback.injected=failed
p1-rollback.injected.auditEvents=0
p1-rollback.injected.variable=null
p1-rollback.committed=ok
p1-rollback.committed.auditEvents=1
p1-rollback.committed.variable=2500

# RM-30 authorization: a user deny on one instance wins over a group grant on every instance and a user grant on it;
# the replay re-check of the host's permission port decides (decision 124); removing the deny restores the grant
deny-wins.before.grant=false
deny-wins.denied=false
deny-wins.otherInstance=true
deny-wins.otherClerk=true
deny-wins.deny.removed=1
deny-wins.afterDelete=true