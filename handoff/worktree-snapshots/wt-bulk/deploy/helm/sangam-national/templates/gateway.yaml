{{- if .Values.gateway.enabled }}
{{- $g := .Values.gateway }}
{{- $name := printf "%s-gateway" .Release.Name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{ include "national.labels" (dict "root" . "name" "gateway") | nindent 4 }}
spec:
  replicas: {{ $g.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: gateway }
  template:
    metadata:
      labels: {{ include "national.labels" (dict "root" . "name" "gateway") | nindent 8 }}
    spec:
      {{- include "national.pod" (dict "root" .) | nindent 6 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: gateway }
      containers:
        - name: gateway
          {{- include "national.container" (dict "root" . "cfg" $g) | nindent 10 }}
          env:
            - { name: SANGAM_GW_PORT, value: {{ $g.port | quote }} }
            - { name: SANGAM_GW_MANAGEMENT_PORT, value: {{ $g.managementPort | quote }} }
            - { name: SANGAM_GW_CONTROL_PLANE_URL, value: {{ printf "http://%s-control-plane:%v" .Release.Name .Values.controlPlane.port | quote }} }
            - { name: SANGAM_GW_HOST_SUFFIX, value: {{ $g.hostSuffix | quote }} }
            - { name: SANGAM_GW_TENANT_CLAIM, value: {{ $g.tenantClaim | quote }} }
            - { name: SANGAM_GATEWAY_MAX_IN_FLIGHT_PER_TENANT, value: {{ $g.maxInFlightPerTenant | quote }} }
            - name: SANGAM_GW_CONTROL_PLANE_TOKEN
              valueFrom: { secretKeyRef: { name: {{ required "gateway.tokenSecret" $g.tokenSecret }}, key: controlPlaneToken } }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{ include "national.labels" (dict "root" . "name" "gateway") | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: gateway }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: gateway }
{{- if $g.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }} }
  minReplicas: {{ $g.autoscaling.minReplicas }}
  maxReplicas: {{ $g.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $g.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- end }}
