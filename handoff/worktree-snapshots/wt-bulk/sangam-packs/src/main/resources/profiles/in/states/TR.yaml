# SPDX-License-Identifier: Apache-2.0
# Sangam configuration profile (data, not code; ADR-D-20). Values marked under "placeholders" are [U]:
# unverified in the research pass and must be confirmed from the government's own orders before go-live.
profile:
  id: TR
  layer: government
  version: 2026.11.0
  effectiveFrom: '2026-04-01'
  extends:
  - IN
  - IN-PRESET-NE-HIMALAYAN
  name:
    en: Tripura
    hi: त्रिपुरा
  source: IFMS-STATES-REQUIREMENTS.md section 1 and 4 (sources TR1-TR2, accessed 2026-11-04)
placeholders:
- path: locale.languages
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live'
- path: chartOfAccounts
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (state digit
    structure not found)'
- path: delegation.tables
  reason: '[U] financial-powers and procurement-mode tables are central defaults until the State order is loaded'
- path: delegation.rows
  reason: '[U] values to load from the State delegation / procurement rules'
evidence:
  fieldsVerifiedOf8: 6
  sources: TR1-TR2
locale:
  languages:
  - tag: bn
    script: Beng
    scope: statewide
    docClass:
    - statutory
    default: true
  - tag: en
    script: Latn
    scope: statewide
    docClass:
    - statutory
  - tag: trp
    script: Latn
    scope: statewide
    docClass:
    - statutory
  documentLanguages:
    treasuryForms: STATUTORY_PLUS_ENGLISH
    accounts:
    - en
    status: V
integrations:
  systems:
  - CTOS (2010)
  - HRMS (separate)
  - IFMS 2.0 (planned)
  snaSparsh:
    onboarded: '2024-12-17'
  ekuber: true
orgTopology:
  directorate: Directorate of Treasuries
  unitTypes:
    DISTRICT_TREASURY: 9
    SUB_TREASURY: 13
  ddoCount: null
  units: 'seed: load the unit register (code, type, banking, renditionParent, agencyBank, owningGovernment, servedGovernments,
    physicalState, effectiveFrom)'
rulebooks:
  citationsOnValidation: true
  own:
  - id: TR_DFP_2019
    title: DFP Rules Tripura 2019 (7 amendments)
  - id: GFR2017
    title: GFR 2017 as adopted
  - id: TR_BUDGET_MANUAL_1998
    title: Budget Manual 1998
paymentRails:
  default: CENTRAL_BANK_SETTLEMENT
payroll:
  hrmsBinding: HARD
  freeTextNetPay: false
payee:
  makerCheckerNewBeneficiary: true
subStateEntities:
- id: TTAADC
  fundRules: TTAADC (Budget & Account) Rules 1982
analytics: IDEA
cutover:
  from: CTOS
  to: IFMS_2.0
classification:
  schemes:
  - id: HOA_TR
    separator: '-'
    segments:
    - id: major
      width: 4
      scheme: HOA
      owner: jurisdiction
    - id: subMajor
      width: 2
      scheme: HOA
      owner: jurisdiction
    - id: minor
      width: 3
      scheme: HOA
      owner: jurisdiction
    - id: subHead
      width: 2
    - id: detailed
      width: 2
    - id: object
      width: 2
    derive:
    - segment: major
      prefix: '0'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '1'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '2'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      prefix: '3'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      equals: '4000'
      set:
        section: CAPITAL
        nature: RECEIPT
    - segment: major
      prefix: '4'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '5'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '6'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      prefix: '7'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      equals: '8000'
      set:
        section: CONTINGENCY_FUND
        nature: BOTH
    - segment: major
      prefix: '8'
      set:
        section: PUBLIC_ACCOUNT
        nature: BOTH
    - segment: major
      matches: 255[2]|455[2]|655[2]
      set:
        nerLumpSum: true
    - segment: minor
      matches: 9\d\d
      set:
        deductEntry: true
    - segment: minor
      equals: '791'
      set:
        exchangeDifference: true
    example: 2406 01 001 98 32 02
    evidence: V
    source: TR expenditure budget Vol 2 Part II
  defaultScheme: HOA_TR
  note: segments below the minor head are set by each government (LMMH GD 1.1, IFS-001)
procurement:
  family: RULES
  rule: Manual for Procurement of Goods 2018
  worksCode: '[U]'
delegation:
  tables:
  - key: ifms-financial-powers
    file: in/dmn/TR/ifms-financial-powers.dmn
    deployAs: TENANT_OVERRIDE
    tenant: TR
    inputs:
    - seatRole
    - caseType
    outputs:
    - allowed
    - maxAmount
    - ruleRef
    status: U
  - key: ifms-procurement-mode
    file: in/dmn/TR/ifms-procurement-mode.dmn
    deployAs: TENANT_OVERRIDE
    tenant: TR
    inputs:
    - amount
    - scientificDepartment
    outputs:
    - procurementMode
    - ruleRef
    status: U
  rows:
    financialPowers:
    - role: DDO
      maxAmount: null
      ruleRef: '[U] central default, replace from Manual for Procurement of Goods 2018 (was: RPR 2022: DDO draws within a
        sanction; no sanction power of its own)'
    - role: HOO
      maxAmount: null
      ruleRef: '[U] central default, replace from Manual for Procurement of Goods 2018 (was: DFPR 2024 r.12(4) and department
        re-delegation order [U value])'
    - role: HOD
      maxAmount: null
      ruleRef: '[U] central default, replace from Manual for Procurement of Goods 2018 (was: DFPR 2024 r.12(2) re-delegation
        to HoD [U value])'
    - role: SECRETARY
      maxAmount: null
      ruleRef: '[U] central default, replace from Manual for Procurement of Goods 2018 (was: DFPR 2024 r.11 (open / limited
        tender up to 100 cr))'
    - role: MINISTER
      maxAmount: null
      ruleRef: '[U] central default, replace from Manual for Procurement of Goods 2018 (was: DFPR 2024 r.11: above the Secretary;
        no upper limit in this table)'
    - role: FA
      maxAmount: null
      ruleRef: '[U] central default, replace from Manual for Procurement of Goods 2018 (was: advice / concurrence only)'
    procurementThresholds:
      direct: null
      gemL1: null
      limitedTender: null
      limitedTenderScientific: null
