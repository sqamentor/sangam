# SPDX-License-Identifier: Apache-2.0
# Sangam configuration profile (data, not code; ADR-D-20). Values marked under "placeholders" are [U]:
# unverified in the research pass and must be confirmed from the government's own orders before go-live.
profile:
  id: PB
  layer: government
  version: 2026.11.0
  effectiveFrom: '2026-04-01'
  extends:
  - IN
  - IN-PRESET-GENERAL
  name:
    en: Punjab
    hi: पंजाब
  source: IFMS-STATES-REQUIREMENTS.md section 1 and 4 (sources PB1-PB3, accessed 2026-11-04)
placeholders:
- path: chartOfAccounts
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (state digit
    structure not found)'
- path: locale.documentLanguages
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (budget-document
    language)'
- path: delegation.tables
  reason: '[U] financial-powers and procurement-mode tables are central defaults until the State order is loaded'
- path: delegation.rows
  reason: '[U] values to load from the State delegation / procurement rules'
evidence:
  fieldsVerifiedOf8: 8
  sources: PB1-PB3
locale:
  languages:
  - tag: pa
    script: Guru
    scope: statewide
    docClass:
    - statutory
    default: true
  - tag: en
    script: Latn
    scope: statewide
    docClass:
    - accounts
    - audit
    note: accounts and audit outputs are usually English (IFMS-STATES 9.1)
  documentLanguages:
    treasuryForms: STATUTORY_PLUS_ENGLISH
    accounts:
    - en
    status: P
integrations:
  systems:
  - IFMS Punjab Next Gen
  - eReceipt
  - Cyber Treasury
  snaSparsh:
    hosting: MODULE
  ekuber: true
orgTopology:
  directorate: Director (Treasuries & Accounts)
  unitTypes:
    DISTRICT_TREASURY: 21
    SUB_TREASURY: 76
    PAO: 1
  ddoCount: null
  units: 'seed: load the unit register (code, type, banking, renditionParent, agencyBank, owningGovernment, servedGovernments,
    physicalState, effectiveFrom)'
rulebooks:
  citationsOnValidation: true
  own:
  - id: PFR
    title: Punjab Financial Rules
  - id: PTR
    title: Punjab Treasury Rules + Subsidiary Treasury Rules
paymentRails:
  default: CENTRAL_BANK_SETTLEMENT
  byDocumentFamily:
    PENSION: AGENCY_BANK
receipts:
  apportionment:
  - id: VAT
    splits:
    - 11
    - 89
payee:
  uniquePayeeCode: true
  multiBeneficiaryAccountCheck: true
grants:
  ucExport: AG_VLC_CSV
classification:
  schemes:
  - id: HOA_PB
    separator: '-'
    segments:
    - id: major
      width: 4
      scheme: HOA
      owner: jurisdiction
    - id: subMajor
      width: 2
      scheme: HOA
      owner: jurisdiction
    - id: minor
      width: 3
      scheme: HOA
      owner: jurisdiction
    - id: subHead
      width: 2
    - id: detailed
      width: 2
    - id: object
      width: 2
    derive:
    - segment: major
      prefix: '0'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '1'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '2'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      prefix: '3'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      equals: '4000'
      set:
        section: CAPITAL
        nature: RECEIPT
    - segment: major
      prefix: '4'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '5'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '6'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      prefix: '7'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      equals: '8000'
      set:
        section: CONTINGENCY_FUND
        nature: BOTH
    - segment: major
      prefix: '8'
      set:
        section: PUBLIC_ACCOUNT
        nature: BOTH
    - segment: major
      matches: 255[2]|455[2]|655[2]
      set:
        nerLumpSum: true
    - segment: minor
      matches: 9\d\d
      set:
        deductEntry: true
    - segment: minor
      equals: '791'
      set:
        exchangeDifference: true
    example: 03.99.53 (SH.DH.OH; DH 99 = none)
    evidence: V
    source: Punjab Demands Vol-IV 2026-27
  defaultScheme: HOA_PB
  note: segments below the minor head are set by each government (LMMH GD 1.1, IFS-001)
procurement:
  family: ACT
  rule: Punjab Transparency in Public Procurement Act 2019 + Rules 2022
  worksCode: Punjab PWD Code
delegation:
  tables:
  - key: ifms-financial-powers
    file: in/dmn/PB/ifms-financial-powers.dmn
    deployAs: TENANT_OVERRIDE
    tenant: PB
    inputs:
    - seatRole
    - caseType
    outputs:
    - allowed
    - maxAmount
    - ruleRef
    status: U
  - key: ifms-procurement-mode
    file: in/dmn/PB/ifms-procurement-mode.dmn
    deployAs: TENANT_OVERRIDE
    tenant: PB
    inputs:
    - amount
    - scientificDepartment
    outputs:
    - procurementMode
    - ruleRef
    status: U
  rows:
    financialPowers:
    - role: DDO
      maxAmount: null
      ruleRef: '[U] central default, replace from Punjab Transparency in Public Procurement Act 2019 + Rules 2022 (was: RPR
        2022: DDO draws within a sanction; no sanction power of its own)'
    - role: HOO
      maxAmount: null
      ruleRef: '[U] central default, replace from Punjab Transparency in Public Procurement Act 2019 + Rules 2022 (was: DFPR
        2024 r.12(4) and department re-delegation order [U value])'
    - role: HOD
      maxAmount: null
      ruleRef: '[U] central default, replace from Punjab Transparency in Public Procurement Act 2019 + Rules 2022 (was: DFPR
        2024 r.12(2) re-delegation to HoD [U value])'
    - role: SECRETARY
      maxAmount: null
      ruleRef: '[U] central default, replace from Punjab Transparency in Public Procurement Act 2019 + Rules 2022 (was: DFPR
        2024 r.11 (open / limited tender up to 100 cr))'
    - role: MINISTER
      maxAmount: null
      ruleRef: '[U] central default, replace from Punjab Transparency in Public Procurement Act 2019 + Rules 2022 (was: DFPR
        2024 r.11: above the Secretary; no upper limit in this table)'
    - role: FA
      maxAmount: null
      ruleRef: '[U] central default, replace from Punjab Transparency in Public Procurement Act 2019 + Rules 2022 (was: advice
        / concurrence only)'
    procurementThresholds:
      direct: null
      gemL1: null
      limitedTender: null
      limitedTenderScientific: null
