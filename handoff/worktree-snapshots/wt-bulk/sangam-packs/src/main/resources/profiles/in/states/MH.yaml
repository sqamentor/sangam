# SPDX-License-Identifier: Apache-2.0
# Sangam configuration profile (data, not code; ADR-D-20). Values marked under "placeholders" are [U]:
# unverified in the research pass and must be confirmed from the government's own orders before go-live.
profile:
  id: MH
  layer: government
  version: 2026.11.0
  effectiveFrom: '2026-04-01'
  extends:
  - IN
  - IN-PRESET-GENERAL
  name:
    en: Maharashtra
    hi: महाराष्ट्र
  source: IFMS-STATES-REQUIREMENTS.md section 1 and 4 (sources MH1-MH3, accessed 2026-11-04)
placeholders:
- path: locale.documentLanguages
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (budget-document
    language)'
- path: delegation.tables
  reason: '[U] financial-powers and procurement-mode tables are central defaults until the State order is loaded'
- path: delegation.rows
  reason: '[U] values to load from the State delegation / procurement rules'
evidence:
  fieldsVerifiedOf8: 7
  sources: MH1-MH3
locale:
  languages:
  - tag: mr
    script: Deva
    scope: statewide
    docClass:
    - statutory
    default: true
  - tag: en
    script: Latn
    scope: statewide
    docClass:
    - accounts
    - audit
    note: accounts and audit outputs are usually English (IFMS-STATES 9.1)
  documentLanguages:
    treasuryForms: STATUTORY_PLUS_ENGLISH
    accounts:
    - en
    status: P
integrations:
  systems:
  - Mahakosh
  - BEAMS
  - Bill Portal
  - Treasury Net
  - Sevaarth
  - NVV
  - GRAS
  - CMP
  snaSparsh:
    hosting: MODULE
    onboarded: BY_2025-11-01
  ekuber: true
orgTopology:
  directorate: Directorate of Accounts & Treasuries
  unitTypes:
    DISTRICT_TREASURY: 34
    SUB_TREASURY: 323
    PAO: 1
    CYBER_TREASURY_RECEIPTS: 1
  ddoCount: null
  units: 'seed: load the unit register (code, type, banking, renditionParent, agencyBank, owningGovernment, servedGovernments,
    physicalState, effectiveFrom)'
rulebooks:
  citationsOnValidation: true
  own:
  - id: MTR_1968
    title: Maharashtra Treasury Rules 1968
  - id: BFR_1959
    title: Bombay Financial Rules 1959
  - id: MH_DFP_1978
    title: DFP Rules 1978
  - id: MH_CONTINGENT
    title: Contingent Expenditure Rules
paymentRails:
  default: AGENCY_BANK
  migration:
    from: AGENCY_BANK
    to: CENTRAL_BANK_SETTLEMENT
    pilot: '2022'
    parallelRun: true
documentTypes:
- id: MH_MTR_18
  formNumber: MTR-18
  family: CONTINGENT
  approvalChain: TREASURY_STD
  sanction: REFERENCE
  integrations: {}
- id: MH_MTR_18B
  formNumber: MTR-18B
  family: CONTINGENT
  approvalChain: TREASURY_STD
  sanction: REFERENCE
  integrations: {}
- id: MH_MTR_24A
  formNumber: MTR-24A
  family: PERSONAL_CLAIM
  approvalChain: TREASURY_STD
  sanction: REFERENCE
  integrations: {}
- id: MH_MTR_28
  formNumber: MTR-28
  family: ESTABLISHMENT_PAY
  approvalChain: TREASURY_STD
  sanction: REFERENCE
  integrations:
    sourceSystem: SEVAARTH
- id: MH_MTR_29
  formNumber: MTR-29
  family: ESTABLISHMENT_PAY
  approvalChain: TREASURY_STD
  sanction: REFERENCE
  integrations: {}
- id: MH_MTR_31
  formNumber: MTR-31
  family: GRANT
  approvalChain: TREASURY_STD
  sanction: REFERENCE
  integrations: {}
- id: MH_MTR_44
  formNumber: MTR-44
  family: CONTINGENT
  approvalChain: TREASURY_STD
  sanction: REFERENCE
  integrations: {}
- id: MH_MTR_45
  formNumber: MTR-45
  family: ADVANCE
  approvalChain: TREASURY_STD
  sanction: REFERENCE
  integrations: {}
- id: MH_MTR_52
  formNumber: MTR-52
  family: REFUND
  approvalChain: TREASURY_STD
  sanction: REFERENCE
  integrations: {}
- id: MH_GIS_8
  formNumber: GIS-8
  family: INSURANCE
  approvalChain: TREASURY_STD
  sanction: REFERENCE
  integrations: {}
approvalChains:
- id: TREASURY_STD
  steps:
  - role: DEALING_ASSISTANT
  - role: ACCOUNTANT
  - role: TREASURY_OFFICER
    sign: true
  returnBy:
  - TREASURY_OFFICER
  mayEdit: false
  queue:
    token: true
    tokenSeries: TOKEN
    fifo: true
beneficiaryConfirmationDays: 10
publicAccounts:
  types:
  - id: VIRTUAL_PLA
    ruleRef: GR 02-03-2021
orgTiers:
- DIRECTORATE
- REGIONAL_JD
- TREASURY
- SUB_TREASURY
worksDivisionsRenderToAg: true
billChannels:
  PAY: SEVAARTH
  NON_PAY: BILL_PORTAL
classification:
  schemes:
  - id: HOA_MH
    separator: '-'
    segments:
    - id: demandLetters
      width: 2
      pattern: '[A-Z0-9]{2}'
    - id: major
      width: 4
      scheme: HOA
      owner: jurisdiction
    - id: subMajor
      width: 2
      scheme: HOA
      owner: jurisdiction
    - id: minor
      width: 3
      scheme: HOA
      owner: jurisdiction
    - id: subHead
      width: 2
    - id: detailed
      width: 2
    - id: object
      width: 2
    derive:
    - segment: major
      prefix: '0'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '1'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '2'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      prefix: '3'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      equals: '4000'
      set:
        section: CAPITAL
        nature: RECEIPT
    - segment: major
      prefix: '4'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '5'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '6'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      prefix: '7'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      equals: '8000'
      set:
        section: CONTINGENCY_FUND
        nature: BOTH
    - segment: major
      prefix: '8'
      set:
        section: PUBLIC_ACCOUNT
        nature: BOTH
    - segment: major
      matches: 255[2]|455[2]|655[2]
      set:
        nerLumpSum: true
    - segment: minor
      matches: 9\d\d
      set:
        deductEntry: true
    - segment: minor
      equals: '791'
      set:
        exchangeDifference: true
    example: 2011 02 101 (00)(01), BEAMS 20110011
    evidence: V
    source: MLS budget 2026
  defaultScheme: HOA_MH
  note: segments below the minor head are set by each government (LMMH GD 1.1, IFS-001)
procurement:
  family: RULES
  rule: Manual of Office Procedures for Procurement 2016
  worksCode: MH PW Manual
beamsCode:
  digits: 8
  rule: MH + serial
delegation:
  tables:
  - key: ifms-financial-powers
    file: in/dmn/MH/ifms-financial-powers.dmn
    deployAs: TENANT_OVERRIDE
    tenant: MH
    inputs:
    - seatRole
    - caseType
    outputs:
    - allowed
    - maxAmount
    - ruleRef
    status: U
  - key: ifms-procurement-mode
    file: in/dmn/MH/ifms-procurement-mode.dmn
    deployAs: TENANT_OVERRIDE
    tenant: MH
    inputs:
    - amount
    - scientificDepartment
    outputs:
    - procurementMode
    - ruleRef
    status: U
  rows:
    financialPowers:
    - role: DDO
      maxAmount: null
      ruleRef: '[U] central default, replace from Manual of Office Procedures for Procurement 2016 (was: RPR 2022: DDO draws
        within a sanction; no sanction power of its own)'
    - role: HOO
      maxAmount: null
      ruleRef: '[U] central default, replace from Manual of Office Procedures for Procurement 2016 (was: DFPR 2024 r.12(4)
        and department re-delegation order [U value])'
    - role: HOD
      maxAmount: null
      ruleRef: '[U] central default, replace from Manual of Office Procedures for Procurement 2016 (was: DFPR 2024 r.12(2)
        re-delegation to HoD [U value])'
    - role: SECRETARY
      maxAmount: null
      ruleRef: '[U] central default, replace from Manual of Office Procedures for Procurement 2016 (was: DFPR 2024 r.11 (open
        / limited tender up to 100 cr))'
    - role: MINISTER
      maxAmount: null
      ruleRef: '[U] central default, replace from Manual of Office Procedures for Procurement 2016 (was: DFPR 2024 r.11: above
        the Secretary; no upper limit in this table)'
    - role: FA
      maxAmount: null
      ruleRef: '[U] central default, replace from Manual of Office Procedures for Procurement 2016 (was: advice / concurrence
        only)'
    procurementThresholds:
      direct: null
      gemL1: null
      limitedTender: null
      limitedTenderScientific: null
