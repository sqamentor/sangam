# SPDX-License-Identifier: Apache-2.0
# Sangam configuration profile (data, not code; ADR-D-20). Values marked under "placeholders" are [U]:
# unverified in the research pass and must be confirmed from the government's own orders before go-live.
profile:
  id: JH
  layer: government
  version: 2026.11.0
  effectiveFrom: '2026-04-01'
  extends:
  - IN
  - IN-PRESET-GENERAL
  name:
    en: Jharkhand
    hi: झारखण्ड
  source: IFMS-STATES-REQUIREMENTS.md section 1 and 4 (sources JH1, accessed 2026-11-04)
  adopt:
  - profile: BR
    sections:
    - rulebooks
placeholders:
- path: chartOfAccounts
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (state digit
    structure not found)'
- path: locale.documentLanguages
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (budget-document
    language)'
- path: delegation.tables
  reason: '[U] financial-powers and procurement-mode tables are central defaults until the State order is loaded'
- path: delegation.rows
  reason: '[U] values to load from the State delegation / procurement rules'
evidence:
  fieldsVerifiedOf8: 8
  sources: JH1
locale:
  languages:
  - tag: hi
    script: Deva
    scope: statewide
    docClass:
    - statutory
    default: true
  - tag: en
    script: Latn
    scope: statewide
    docClass:
    - accounts
    - audit
    note: accounts and audit outputs are usually English (IFMS-STATES 9.1)
  documentLanguages:
    treasuryForms: STATUTORY_PLUS_ENGLISH
    accounts:
    - en
    status: P
integrations:
  systems:
  - IFMS 2.0 KUBER
  - e-GRAS
  - SNA-SPARSH
  - Hastakshar
  snaSparsh:
    hosting: MODULE
  ekuber: true
orgTopology:
  directorate: null
  unitTypes:
    DISTRICT_TREASURY: 27
    SUB_TREASURY: 6
  ddoCount: null
  units: 'seed: load the unit register (code, type, banking, renditionParent, agencyBank, owningGovernment, servedGovernments,
    physicalState, effectiveFrom)'
  tiers:
  - FINANCE_DEPARTMENT
  - TREASURY
rulebooks:
  citationsOnValidation: true
  own:
  - id: JTC
    title: Jharkhand Treasury Code (Para 11B change control)
  - id: JFR
    title: Jharkhand Financial Rules
  - id: JH_BUDGET_MANUAL
    title: Budget Manual
  - id: JH_PW_ACCOUNTS
    title: PW Accounts Code
  - id: JFR_2025
    title: Jharkhand Financial Rules 2025 (notification [U])
paymentRails:
  default: CENTRAL_BANK_SETTLEMENT
  additional:
  - AGENCY_BANK
tags:
- TSP
- SCSP
- OSP
pension:
  agAuthorisationFormat: \d{9}
receipts:
  rejectShortDeposit: true
changeControl:
  register: true
  ruleRef: JTC Para 11B
noBackendBypass: true
citizenBudget: HAMAR_APAN_BUDGET
classification:
  schemes:
  - id: HOA_JH
    separator: '-'
    segments:
    - id: demand
      width: 2
    - id: letter
      width: 1
      pattern: '[A-Z0-9]{1}'
    - id: major
      width: 4
      scheme: HOA
      owner: jurisdiction
    - id: subMajor
      width: 2
      scheme: HOA
      owner: jurisdiction
    - id: minor
      width: 3
      scheme: HOA
      owner: jurisdiction
    - id: subHead
      width: 2
    - id: detailed
      width: 2
    - id: objectGroup
      width: 2
    - id: object
      width: 2
    derive:
    - segment: major
      prefix: '0'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '1'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '2'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      prefix: '3'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      equals: '4000'
      set:
        section: CAPITAL
        nature: RECEIPT
    - segment: major
      prefix: '4'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '5'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '6'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      prefix: '7'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      equals: '8000'
      set:
        section: CONTINGENCY_FUND
        nature: BOTH
    - segment: major
      prefix: '8'
      set:
        section: PUBLIC_ACCOUNT
        nature: BOTH
    - segment: major
      matches: 255[2]|455[2]|655[2]
      set:
        nerLumpSum: true
    - segment: minor
      matches: 9\d\d
      set:
        deductEntry: true
    - segment: minor
      equals: '791'
      set:
        exchangeDifference: true
    example: 12-S-2052-00-090-08-00-01-01
    evidence: V
    source: JH FD budget 2026-27
  defaultScheme: HOA_JH
  note: segments below the minor head are set by each government (LMMH GD 1.1, IFS-001)
procurement:
  family: RULES
  rule: Jharkhand Financial Rules 2025 Ch.7 (r.165 GeM)
  worksCode: JFR 2025 Ch.10; PW Account Code 1935
delegation:
  tables:
  - key: ifms-financial-powers
    file: in/dmn/JH/ifms-financial-powers.dmn
    deployAs: TENANT_OVERRIDE
    tenant: JH
    inputs:
    - seatRole
    - caseType
    outputs:
    - allowed
    - maxAmount
    - ruleRef
    status: U
  - key: ifms-procurement-mode
    file: in/dmn/JH/ifms-procurement-mode.dmn
    deployAs: TENANT_OVERRIDE
    tenant: JH
    inputs:
    - amount
    - scientificDepartment
    outputs:
    - procurementMode
    - ruleRef
    status: U
  rows:
    financialPowers:
    - role: DDO
      maxAmount: null
      ruleRef: '[U] central default, replace from Jharkhand Financial Rules 2025 Ch.7 (r.165 GeM) (was: RPR 2022: DDO draws
        within a sanction; no sanction power of its own)'
    - role: HOO
      maxAmount: null
      ruleRef: '[U] central default, replace from Jharkhand Financial Rules 2025 Ch.7 (r.165 GeM) (was: DFPR 2024 r.12(4)
        and department re-delegation order [U value])'
    - role: HOD
      maxAmount: null
      ruleRef: '[U] central default, replace from Jharkhand Financial Rules 2025 Ch.7 (r.165 GeM) (was: DFPR 2024 r.12(2)
        re-delegation to HoD [U value])'
    - role: SECRETARY
      maxAmount: null
      ruleRef: '[U] central default, replace from Jharkhand Financial Rules 2025 Ch.7 (r.165 GeM) (was: DFPR 2024 r.11 (open
        / limited tender up to 100 cr))'
    - role: MINISTER
      maxAmount: null
      ruleRef: '[U] central default, replace from Jharkhand Financial Rules 2025 Ch.7 (r.165 GeM) (was: DFPR 2024 r.11: above
        the Secretary; no upper limit in this table)'
    - role: FA
      maxAmount: null
      ruleRef: '[U] central default, replace from Jharkhand Financial Rules 2025 Ch.7 (r.165 GeM) (was: advice / concurrence
        only)'
    procurementThresholds:
      direct: null
      gemL1: null
      limitedTender: null
      limitedTenderScientific: null
