    hosting: CYBER_TREASURY
    unit: PANCHKULA
  ekuber: true
orgTopology:
  directorate: DG Treasuries & Accounts
  unitTypes:
    DISTRICT_TREASURY: 24
    CYBER_TREASURY_RECEIPTS: 1
    CYBER_TREASURY_SNA: 1
    SUB_TREASURY: 82
