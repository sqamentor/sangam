    - role: HOO
      maxAmount: null
      ruleRef: '[U] central default, replace from HPPC store purchase rules (was: DFPR 2024 r.12(4) and department re-delegation
        order [U value])'
    - role: HOD
      maxAmount: null
      ruleRef: '[U] central default, replace from HPPC store purchase rules (was: DFPR 2024 r.12(2) re-delegation to HoD [U
        value])'
    - role: SECRETARY
      maxAmount: null
      ruleRef: '[U] central default, replace from HPPC store purchase rules (was: DFPR 2024 r.11 (open / limited tender up
        to 100 cr))'
    - role: MINISTER
      maxAmount: null
      ruleRef: '[U] central default, replace from HPPC store purchase rules (was: DFPR 2024 r.11: above the Secretary; no
        upper limit in this table)'
    - role: FA
      maxAmount: null
      ruleRef: '[U] central default, replace from HPPC store purchase rules (was: advice / concurrence only)'
    procurementThresholds:
