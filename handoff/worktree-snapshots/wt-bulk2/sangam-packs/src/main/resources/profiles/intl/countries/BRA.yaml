# Sangam configuration profile (data, ADR-D-20 / ADR-D-23). Source: spike/results/INTERNATIONAL-PFM-REQUIREMENTS.md.
# Values under "placeholders" are [U]: unverified, configuration placeholders to confirm from official sources.
# Written outside profilegen (frozen while LMMH-EXTRACTION runs); indexed by intl.idx.
profile:
