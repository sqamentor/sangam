  - INTL-PFM
  - REGIME-CIVIL-LAW-EMPENHO
  name:
    en: Brazil (federal)
  source: INTERNATIONAL-PFM 5
placeholders:
- path: classification
  reason: '[U] unverified in the research pass (INTERNATIONAL-PFM); confirm from official sources (natureza da despesa, fonte)'
- path: treasury.tsa
  reason: '[U] unverified in the research pass (INTERNATIONAL-PFM); confirm from official sources (Conta Unica at the Banco
    Central)'
- path: fiscalRules.rules
  reason: '[U] unverified in the research pass (INTERNATIONAL-PFM); confirm from official sources (LRF art. 42 end-of-mandate)'
locale:
