# SPDX-License-Identifier: Apache-2.0
# Sangam configuration profile (data, not code; ADR-D-20). Values marked under "placeholders" are [U]:
# unverified in the research pass and must be confirmed from the government's own orders before go-live.
profile:
  id: MP
  layer: government
  version: 2026.11.0
  effectiveFrom: '2026-04-01'
  extends:
  - IN
  - IN-PRESET-GENERAL
  name:
    en: Madhya Pradesh
    hi: मध्य प्रदेश
  source: IFMS-STATES-REQUIREMENTS.md section 1 and 4 (sources MP1, accessed 2026-11-04)
placeholders:
- path: rulebooks.own.MP_FINANCIAL_CODE
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live'
- path: paymentRails.default
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live'
- path: classification.schemes
  reason: partially verified code structure (delta P)
- path: locale.documentLanguages
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (budget-document
    language)'
- path: delegation.tables
  reason: '[U] financial-powers and procurement-mode tables are central defaults until the State order is loaded'
- path: delegation.rows
  reason: '[U] values to load from the State delegation / procurement rules'
evidence:
  fieldsVerifiedOf8: 7
  sources: MP1
locale:
  languages:
  - tag: hi
    script: Deva
    scope: statewide
    docClass:
    - statutory
    default: true
  - tag: en
    script: Latn
    scope: statewide
    docClass:
    - accounts
    - audit
    note: accounts and audit outputs are usually English (IFMS-STATES 9.1)
  documentLanguages:
    treasuryForms: STATUTORY_PLUS_ENGLISH
    accounts:
    - en
    status: P
integrations:
  systems:
  - IFMIS (2018)
  - Cyber Treasury
  snaSparsh:
    onboarded: '2024-07-29'
    hosting: BILL_TYPE
  ekuber: true
orgTopology:
  directorate: Commissioner Treasury & Accounts
  unitTypes:
    DISTRICT_TREASURY: 54
  ddoCount: null
  units: 'seed: load the unit register (code, type, banking, renditionParent, agencyBank, owningGovernment, servedGovernments,
    physicalState, effectiveFrom)'
rulebooks:
  citationsOnValidation: true
  own:
  - id: MPTC_2020
    title: MP Treasury Code 2020
  - id: MP_BUDGET_MANUAL_II
    title: Budget Manual Vol-II
paymentRails:
  default: CENTRAL_BANK_SETTLEMENT
documentTypes:
- id: MP_MPTC_56
  formNumber: MPTC-56
  family: CONTINGENT
  approvalChain: TREASURY_STD
  sanction: REFERENCE
  integrations: {}
- id: MP_MPTC_71
  formNumber: MPTC-71
  family: PERSONAL_CLAIM
  approvalChain: TREASURY_STD
  sanction: REFERENCE
  integrations: {}
- id: MP_FORM_80
  formNumber: FORM-80
  family: ESTABLISHMENT_PAY
  approvalChain: TREASURY_STD
  sanction: REFERENCE
  integrations: {}
approvalChains:
- id: TREASURY_STD
  steps:
  - role: DEALING_ASSISTANT
  - role: ACCOUNTANT
  - role: TREASURY_OFFICER
    sign: true
  returnBy:
  - TREASURY_OFFICER
  mayEdit: false
  queue:
    token: true
    tokenSeries: TOKEN
    fifo: true
orgTiers:
- COMMISSIONER
- DIVISIONAL_JD
- TREASURY
ddoCodeWidth: 10
receipts:
  cyberTreasuryMandatoryFor:
  - FOREST_REVENUE
  pdFallbackHead: 8443-106
signatures:
  specimenRegistry: true
legacyFonts:
- KRUTI_DEV
classification:
  schemes:
  - id: HOA_MP
    separator: '-'
    segments:
    - id: demand
      width: 2
    - id: major
      width: 4
      scheme: HOA
      owner: jurisdiction
    - id: subMajor
      width: 2
      scheme: HOA
      owner: jurisdiction
    - id: minor
      width: 3
      scheme: HOA
      owner: jurisdiction
    - id: scheme
      width: 4
    - id: object
      width: 2
    - id: detailedObject
      width: 3
    derive:
    - segment: major
      prefix: '0'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '1'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '2'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      prefix: '3'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      equals: '4000'
      set:
        section: CAPITAL
        nature: RECEIPT
    - segment: major
      prefix: '4'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '5'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '6'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      prefix: '7'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      equals: '8000'
      set:
        section: CONTINGENCY_FUND
        nature: BOTH
    - segment: major
      prefix: '8'
      set:
        section: PUBLIC_ACCOUNT
        nature: BOTH
    - segment: major
      matches: 255[2]|455[2]|655[2]
      set:
        nerLumpSum: true
    - segment: minor
      matches: 9\d\d
      set:
        deductEntry: true
    - segment: minor
      equals: '791'
      set:
        exchangeDifference: true
    example: 22-008 (object-detailed object)
    evidence: P
    source: by analogy with CT
  defaultScheme: HOA_MP
  note: segments below the minor head are set by each government (LMMH GD 1.1, IFS-001)
procurement:
  family: RULES
  rule: MP Bhandar Kray tatha Seva Upaarjan Niyam 2015
  worksCode: MP Works Dept Manual
delegation:
  tables:
  - key: ifms-financial-powers
    file: in/dmn/MP/ifms-financial-powers.dmn
    deployAs: TENANT_OVERRIDE
    tenant: MP
    inputs:
    - seatRole
    - caseType
    outputs:
    - allowed
    - maxAmount
    - ruleRef
    status: U
  - key: ifms-procurement-mode
    file: in/dmn/MP/ifms-procurement-mode.dmn
    deployAs: TENANT_OVERRIDE
    tenant: MP
    inputs:
    - amount
    - scientificDepartment
    outputs:
    - procurementMode
    - ruleRef
    status: U
  rows:
    financialPowers:
    - role: DDO
      maxAmount: null
      ruleRef: '[U] central default, replace from MP Bhandar Kray tatha Seva Upaarjan Niyam 2015 (was: RPR 2022: DDO draws
        within a sanction; no sanction power of its own)'
    - role: HOO
      maxAmount: null
      ruleRef: '[U] central default, replace from MP Bhandar Kray tatha Seva Upaarjan Niyam 2015 (was: DFPR 2024 r.12(4) and
        department re-delegation order [U value])'
    - role: HOD
      maxAmount: null
      ruleRef: '[U] central default, replace from MP Bhandar Kray tatha Seva Upaarjan Niyam 2015 (was: DFPR 2024 r.12(2) re-delegation
        to HoD [U value])'
    - role: SECRETARY
      maxAmount: null
      ruleRef: '[U] central default, replace from MP Bhandar Kray tatha Seva Upaarjan Niyam 2015 (was: DFPR 2024 r.11 (open
        / limited tender up to 100 cr))'
    - role: MINISTER
      maxAmount: null
      ruleRef: '[U] central default, replace from MP Bhandar Kray tatha Seva Upaarjan Niyam 2015 (was: DFPR 2024 r.11: above
        the Secretary; no upper limit in this table)'
    - role: FA
      maxAmount: null
      ruleRef: '[U] central default, replace from MP Bhandar Kray tatha Seva Upaarjan Niyam 2015 (was: advice / concurrence
        only)'
    procurementThresholds:
      direct: null
      gemL1: null
      limitedTender: null
      limitedTenderScientific: null
