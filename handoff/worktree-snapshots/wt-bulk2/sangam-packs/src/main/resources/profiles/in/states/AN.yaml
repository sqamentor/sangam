# SPDX-License-Identifier: Apache-2.0
# Sangam configuration profile (data, not code; ADR-D-20). Values marked under "placeholders" are [U]:
# unverified in the research pass and must be confirmed from the government's own orders before go-live.
profile:
  id: AN
  layer: government
  version: 2026.11.0
  effectiveFrom: '2026-04-01'
  extends:
  - IN
  - IN-PRESET-UT-NOLEG
  name:
    en: Andaman & Nicobar
    hi: अंडमान और निकोबार
  source: IFMS-STATES-REQUIREMENTS.md section 1 and 4 (sources AN1, accessed 2026-11-04)
placeholders:
- path: chartOfAccounts
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (state digit
    structure not found)'
- path: classification.schemes
  reason: partially verified code structure (delta P)
- path: locale.documentLanguages
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (budget-document
    language)'
- path: delegation.tables
  reason: '[U] financial-powers and procurement-mode tables are central defaults until the State order is loaded'
- path: delegation.rows
  reason: '[U] values to load from the State delegation / procurement rules'
evidence:
  fieldsVerifiedOf8: 8
  sources: AN1
locale:
  languages:
  - tag: hi
    script: Deva
    scope: statewide
    docClass:
    - statutory
    default: true
  - tag: en
    script: Latn
    scope: statewide
    docClass:
    - statutory
  documentLanguages:
    treasuryForms: STATUTORY_PLUS_ENGLISH
    accounts:
    - en
    status: P
integrations:
  systems:
  - PFMS (LC approval, DSC)
  snaSparsh: {}
orgTopology:
  directorate: Chief PAO
  unitTypes:
    CHIEF_PAO: 1
    PAO: 3
    SUB_PAO: 5
  ddoCount: null
  units: 'seed: load the unit register (code, type, banking, renditionParent, agencyBank, owningGovernment, servedGovernments,
    physicalState, effectiveFrom)'
rulebooks:
  citationsOnValidation: true
  own:
  - id: RPR2022
    title: R&P Rules 2022
  - id: GFR2017
    title: GFR 2017
  - id: DFPR2024
    title: DFPR
paymentRails:
  default: PFMS
works:
  creditLimitMode: LETTER_OF_CREDIT
  divisions:
  - APWD
  - FOREST
offlineUnits:
- CAMPBELL_BAY
grantsToPriTiers: 3
unionDemand: 52
classification:
  schemes:
  - id: HOA_AN
    separator: '-'
    segments:
    - id: major
      width: 4
      scheme: HOA
      owner: jurisdiction
    - id: subMajor
      width: 2
      scheme: HOA
      owner: jurisdiction
    - id: minor
      width: 3
      scheme: HOA
      owner: jurisdiction
    - id: subHead
      width: 2
    - id: detailed
      width: 2
    - id: object
      width: 2
    derive:
    - segment: major
      prefix: '0'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '1'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '2'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      prefix: '3'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      equals: '4000'
      set:
        section: CAPITAL
        nature: RECEIPT
    - segment: major
      prefix: '4'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '5'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '6'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      prefix: '7'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      equals: '8000'
      set:
        section: CONTINGENCY_FUND
        nature: BOTH
    - segment: major
      prefix: '8'
      set:
        section: PUBLIC_ACCOUNT
        nature: BOTH
    - segment: major
      matches: 255[2]|455[2]|655[2]
      set:
        nerLumpSum: true
    - segment: minor
      matches: 9\d\d
      set:
        deductEntry: true
    - segment: minor
      equals: '791'
      set:
        exchangeDifference: true
    example: Union layout
    evidence: P
    source: LMMH para 8
  defaultScheme: HOA_AN
  note: segments below the minor head are set by each government (LMMH GD 1.1, IFS-001)
procurement:
  family: CENTRAL
  rule: GFR 2017
  worksCode: CPWD Manual
regime:
  accountsRenderedTo: CGA
  reportingUnit: CPAO Port Blair
  ruleRef: 'IFMS-RESEARCH-DELTA IFC-237: each UT reports to the CGA directly (not via MHA PAOs)'
delegation:
  tables:
  - key: ifms-financial-powers
    file: in/dmn/AN/ifms-financial-powers.dmn
    deployAs: TENANT_OVERRIDE
    tenant: AN
    inputs:
    - seatRole
    - caseType
    outputs:
    - allowed
    - maxAmount
    - ruleRef
    status: U
  - key: ifms-procurement-mode
    file: in/dmn/AN/ifms-procurement-mode.dmn
    deployAs: TENANT_OVERRIDE
    tenant: AN
    inputs:
    - amount
    - scientificDepartment
    outputs:
    - procurementMode
    - ruleRef
    status: U
  rows:
    financialPowers:
    - role: DDO
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: RPR 2022: DDO draws within a sanction; no sanction power
        of its own)'
    - role: HOO
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: DFPR 2024 r.12(4) and department re-delegation order [U value])'
    - role: HOD
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: DFPR 2024 r.12(2) re-delegation to HoD [U value])'
    - role: SECRETARY
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: DFPR 2024 r.11 (open / limited tender up to 100 cr))'
    - role: MINISTER
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: DFPR 2024 r.11: above the Secretary; no upper limit in this
        table)'
    - role: FA
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: advice / concurrence only)'
    procurementThresholds:
      direct: null
      gemL1: null
      limitedTender: null
      limitedTenderScientific: null
