# SPDX-License-Identifier: Apache-2.0
# Sangam configuration profile (data, not code; ADR-D-20). Values marked under "placeholders" are [U]:
# unverified in the research pass and must be confirmed from the government's own orders before go-live.
profile:
  id: GA
  layer: government
  version: 2026.11.0
  effectiveFrom: '2026-04-01'
  extends:
  - IN
  - IN-PRESET-GENERAL
  name:
    en: Goa
    hi: गोवा
  source: IFMS-STATES-REQUIREMENTS.md section 1 and 4 (sources GA1, accessed 2026-11-04)
placeholders:
- path: evidence
  reason: 'thin profile: 3 of 8 fields verified'
- path: classification.schemes
  reason: partially verified code structure (delta P)
- path: delegation.tables
  reason: '[U] financial-powers and procurement-mode tables are central defaults until the State order is loaded'
- path: delegation.rows
  reason: '[U] values to load from the State delegation / procurement rules'
evidence:
  fieldsVerifiedOf8: 3
  sources: GA1
locale:
  languages:
  - tag: kok
    script: Deva
    scope: statewide
    docClass:
    - statutory
    default: true
  - tag: mr
    script: Deva
    scope: statewide
    docClass:
    - statutory
    note: permitted
  - tag: en
    script: Latn
    scope: statewide
    docClass:
    - statutory
    note: continues
  documentLanguages:
    treasuryForms: STATUTORY_PLUS_ENGLISH
    accounts:
    - en
    status: V
integrations:
  systems:
  - Accounts-Online
  - IBPS
  - e-Pagaar20
  - E-DDO
  - e-Challan (SBI MOPS)
  - Treasury Accounting
  - Works Audit
  snaSparsh: {}
  ekuber: true
orgTopology:
  directorate: Directorate of Accounts (Director of Treasuries)
  unitTypes:
    DISTRICT_TREASURY: 2
    SUB_TREASURY: 10
  ddoCount: 550
  units: 'seed: load the unit register (code, type, banking, renditionParent, agencyBank, owningGovernment, servedGovernments,
    physicalState, effectiveFrom)'
  treasuries:
  - PORVORIM
  - MARGAO
  subTreasuries:
  - PANAJI
  - MAPUSA
  - BICHOLIM
  - PERNEM
  - VALPOI
  - VASCO
  - PONDA
  - SANGUEM
  - QUEPEM
  - CANACONA
rulebooks:
  citationsOnValidation: true
  own:
  - id: GA_DFPR_2008
    title: Goa DFPR 2008 (amended 2023)
  - id: GA_BUDGET_MANUAL
    title: Budget Manual
  - id: GFRBM_2006
    title: Goa FRBM Act 2006 / Rules 2007
paymentRails:
  default: CENTRAL_BANK_SETTLEMENT
  agencyBank: SBI e-payment + link banks
treasury:
  model: PRE_AUDIT_PAO
  payAuditSectionsAsQueues: true
statutoryAuditOfLocalBodies: true
agencyPensions:
- CENTRAL
- RAILWAY
- DEFENCE
classification:
  schemes:
  - id: HOA_GA
    separator: '-'
    segments:
    - id: major
      width: 4
      scheme: HOA
      owner: jurisdiction
    - id: subMajor
      width: 2
      scheme: HOA
      owner: jurisdiction
    - id: minor
      width: 3
      scheme: HOA
      owner: jurisdiction
    - id: subHead
      width: 2
    - id: detailed
      width: 2
      optional: true
    - id: object
      width: 2
      optional: true
    derive:
    - segment: major
      prefix: '0'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '1'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '2'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      prefix: '3'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      equals: '4000'
      set:
        section: CAPITAL
        nature: RECEIPT
    - segment: major
      prefix: '4'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '5'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '6'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      prefix: '7'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      equals: '8000'
      set:
        section: CONTINGENCY_FUND
        nature: BOTH
    - segment: major
      prefix: '8'
      set:
        section: PUBLIC_ACCOUNT
        nature: BOTH
    - segment: major
      matches: 255[2]|455[2]|655[2]
      set:
        nerLumpSum: true
    - segment: minor
      matches: 9\d\d
      set:
        deductEntry: true
    - segment: minor
      equals: '791'
      set:
        exchangeDifference: true
    example: 2225-03-277-09
    evidence: P
    source: CAG Report 2 of 2018; lower widths [U]
  defaultScheme: HOA_GA
  note: segments below the minor head are set by each government (LMMH GD 1.1, IFS-001)
procurement:
  family: CENTRAL
  rule: GFR 2017
  worksCode: CPWD Works Manual (adopted)
delegation:
  tables:
  - key: ifms-financial-powers
    file: in/dmn/GA/ifms-financial-powers.dmn
    deployAs: TENANT_OVERRIDE
    tenant: GA
    inputs:
    - seatRole
    - caseType
    outputs:
    - allowed
    - maxAmount
    - ruleRef
    status: U
  - key: ifms-procurement-mode
    file: in/dmn/GA/ifms-procurement-mode.dmn
    deployAs: TENANT_OVERRIDE
    tenant: GA
    inputs:
    - amount
    - scientificDepartment
    outputs:
    - procurementMode
    - ruleRef
    status: U
  rows:
    financialPowers:
    - role: DDO
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: RPR 2022: DDO draws within a sanction; no sanction power
        of its own)'
    - role: HOO
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: DFPR 2024 r.12(4) and department re-delegation order [U value])'
    - role: HOD
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: DFPR 2024 r.12(2) re-delegation to HoD [U value])'
    - role: SECRETARY
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: DFPR 2024 r.11 (open / limited tender up to 100 cr))'
    - role: MINISTER
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: DFPR 2024 r.11: above the Secretary; no upper limit in this
        table)'
    - role: FA
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 (was: advice / concurrence only)'
    procurementThresholds:
      direct: null
      gemL1: null
      limitedTender: null
      limitedTenderScientific: null
