# SPDX-License-Identifier: Apache-2.0
# Sangam configuration profile (data, not code; ADR-D-20). Values marked under "placeholders" are [U]:
# unverified in the research pass and must be confirmed from the government's own orders before go-live.
profile:
  id: PY
  layer: government
  version: 2026.11.0
  effectiveFrom: '2026-04-01'
  extends:
  - IN
  - IN-PRESET-UT-LEG
  name:
    en: Puducherry
    hi: पुदुच्चेरी
  source: IFMS-STATES-REQUIREMENTS.md section 1 and 4 (sources PY1-PY2, accessed 2026-11-04)
placeholders:
- path: locale.regions
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live'
- path: chartOfAccounts
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (state digit
    structure not found)'
- path: classification.schemes
  reason: partially verified code structure (delta P)
- path: delegation.tables
  reason: '[U] financial-powers and procurement-mode tables are central defaults until the State order is loaded'
- path: delegation.rows
  reason: '[U] values to load from the State delegation / procurement rules'
evidence:
  fieldsVerifiedOf8: 6
  sources: PY1-PY2
locale:
  languages:
  - tag: ta
    script: Taml
    scope: statewide
    docClass:
    - statutory
    default: true
  - tag: te
    script: Telu
    scope: statewide
    docClass:
    - statutory
  - tag: ml
    script: Mlym
    scope: statewide
    docClass:
    - statutory
  - tag: en
    script: Latn
    scope: statewide
    docClass:
    - statutory
  documentLanguages:
    treasuryForms: STATUTORY_PLUS_ENGLISH
    accounts:
    - en
    status: V
integrations:
  systems:
  - IFMIS Puducherry
  - GRAS
  - e-Salary
  - BEAMS
  - SS
  - eK
  - NPCI
  snaSparsh: {}
  ekuber: true
orgTopology:
  directorate: Directorate of Accounts & Treasuries
  unitTypes:
    DISTRICT_TREASURY: 3
    SUB_TREASURY: 3
  ddoCount: null
  units: 'seed: load the unit register (code, type, banking, renditionParent, agencyBank, owningGovernment, servedGovernments,
    physicalState, effectiveFrom)'
rulebooks:
  citationsOnValidation: true
  own:
  - id: GFR2017
    title: GFR 2017
  - id: DFPR2024
    title: DFPR
  - id: RPR1983
    title: R&P Rules 1983
  - id: CTR
    title: CTR
  - id: PY_TREASURY_ACCOUNTING_1992
    title: Accounting Rules for Treasuries 1992
paymentRails:
  default: CENTRAL_BANK_SETTLEMENT
regions:
  PUDUCHERRY:
  - ta
  - en
  KARAIKAL:
  - ta
  - en
  MAHE:
  - ml
  - en
  YANAM:
  - te
  - en
pension:
  payerClasses:
  - UT
  - CENTRAL
  - EX_FRENCH_GOVERNMENT
paysForLocalBodies: true
unionDemand: 59
classification:
  schemes:
  - id: HOA_PY
    separator: '-'
    segments:
    - id: major
      width: 4
      scheme: HOA
      owner: jurisdiction
    - id: subMajor
      width: 2
      scheme: HOA
      owner: jurisdiction
    - id: minor
      width: 3
      scheme: HOA
      owner: jurisdiction
    - id: subHead
      width: 2
    - id: detailed
      width: 2
    - id: object
      width: 2
    derive:
    - segment: major
      prefix: '0'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '1'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '2'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      prefix: '3'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      equals: '4000'
      set:
        section: CAPITAL
        nature: RECEIPT
    - segment: major
      prefix: '4'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '5'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '6'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      prefix: '7'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      equals: '8000'
      set:
        section: CONTINGENCY_FUND
        nature: BOTH
    - segment: major
      prefix: '8'
      set:
        section: PUBLIC_ACCOUNT
        nature: BOTH
    - segment: major
      matches: 255[2]|455[2]|655[2]
      set:
        nerLumpSum: true
    - segment: minor
      matches: 9\d\d
      set:
        deductEntry: true
    - segment: minor
      equals: '791'
      set:
        exchangeDifference: true
    example: object 28 (BEAMS); full code [U]
    evidence: P
    source: PY FD compendium 2022
  defaultScheme: HOA_PY
  note: segments below the minor head are set by each government (LMMH GD 1.1, IFS-001)
procurement:
  family: CENTRAL
  rule: GFR 2017 + CPWD (FD 24-10-2017)
  worksCode: CPWD Works Manual
delegation:
  tables:
  - key: ifms-financial-powers
    file: in/dmn/PY/ifms-financial-powers.dmn
    deployAs: TENANT_OVERRIDE
    tenant: PY
    inputs:
    - seatRole
    - caseType
    outputs:
    - allowed
    - maxAmount
    - ruleRef
    status: U
  - key: ifms-procurement-mode
    file: in/dmn/PY/ifms-procurement-mode.dmn
    deployAs: TENANT_OVERRIDE
    tenant: PY
    inputs:
    - amount
    - scientificDepartment
    outputs:
    - procurementMode
    - ruleRef
    status: U
  rows:
    financialPowers:
    - role: DDO
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 + CPWD (FD 24-10-2017) (was: RPR 2022: DDO draws within a sanction;
        no sanction power of its own)'
    - role: HOO
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 + CPWD (FD 24-10-2017) (was: DFPR 2024 r.12(4) and department re-delegation
        order [U value])'
    - role: HOD
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 + CPWD (FD 24-10-2017) (was: DFPR 2024 r.12(2) re-delegation to
        HoD [U value])'
    - role: SECRETARY
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 + CPWD (FD 24-10-2017) (was: DFPR 2024 r.11 (open / limited tender
        up to 100 cr))'
    - role: MINISTER
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 + CPWD (FD 24-10-2017) (was: DFPR 2024 r.11: above the Secretary;
        no upper limit in this table)'
    - role: FA
      maxAmount: null
      ruleRef: '[U] central default, replace from GFR 2017 + CPWD (FD 24-10-2017) (was: advice / concurrence only)'
    procurementThresholds:
      direct: null
      gemL1: null
      limitedTender: null
      limitedTenderScientific: null
