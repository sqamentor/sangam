# Example for an India deployment: the server has no default compliance jurisdiction.
# An overlay: combine it with a database example (oidc.issuerUri and database.* are required), e.g.
#   helm upgrade --install sangam deploy/helm/sangam -f deploy/helm/sangam/examples/values-postgres.yaml \
#     -f deploy/helm/sangam/values-india.example.yaml
server:
  config:
    sangam:
      compliance:
        jurisdictions: IN
        log-archive:
          country: IN