# SPDX-License-Identifier: Apache-2.0
# Sangam configuration profile (data, not code; ADR-D-20). Values marked under "placeholders" are [U]:
# unverified in the research pass and must be confirmed from the government's own orders before go-live.
profile:
  id: UK
  layer: government
  version: 2026.11.0
  effectiveFrom: '2026-04-01'
  extends:
  - IN
  - IN-PRESET-NE-HIMALAYAN
  name:
    en: Uttarakhand
    hi: उत्तराखण्ड
  source: IFMS-STATES-REQUIREMENTS.md section 1 and 4 (sources UK1-UK2, accessed 2026-11-04)
placeholders:
- path: locale.documentLanguages
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (budget-document
    language)'
- path: delegation.tables
  reason: '[U] financial-powers and procurement-mode tables are central defaults until the State order is loaded'
- path: delegation.rows
  reason: '[U] values to load from the State delegation / procurement rules'
evidence:
  fieldsVerifiedOf8: 7
  sources: UK1-UK2
locale:
  languages:
  - tag: hi
    script: Deva
    scope: statewide
    docClass:
    - statutory
    default: true
  - tag: sa
    script: Deva
    scope: statewide
    docClass:
    - statutory
    note: '[U] second language'
  - tag: en
    script: Latn
    scope: statewide
    docClass:
    - accounts
    - audit
    note: accounts and audit outputs are usually English (IFMS-STATES 9.1)
  documentLanguages:
    treasuryForms: STATUTORY_PLUS_ENGLISH
    accounts:
    - en
    status: P
integrations:
  systems:
  - IFMS UK (2019)
  - e-DDO
  - e-HRMS
  - UKosh
  - SNA Sparsh
  - State DBT
  snaSparsh:
    hosting: MODULE
  ekuber: true
orgTopology:
  directorate: Directorate of Treasuries, Pension & Entitlements
  unitTypes:
    DISTRICT_TREASURY: 13
    SUB_TREASURY: 70
    UPGRADED_SUB_TREASURY: 5
    PAO: 2
  ddoCount: 4200
  units: 'seed: load the unit register (code, type, banking, renditionParent, agencyBank, owningGovernment, servedGovernments,
    physicalState, effectiveFrom)'
rulebooks:
  citationsOnValidation: true
  own:
  - id: UK_FHB1_DFP_2018
    title: FHB Part-1 DFP 2018 (amended 2019, 2022)
  - id: UK_BUDGET_MANUAL_2012
    title: Budget Manual 2012
  - id: UK_TREASURY_MANUAL_2015
    title: Treasury Rules Manual 2015
  - id: UK_PROCUREMENT
    title: Procurement Rules 2017/2021
paymentRails:
  default: CENTRAL_BANK_SETTLEMENT
works:
  creditLimitMode: CCL_DCL
  since: '1974'
  accountingGo: '2019'
signatures:
  dscMandatory: true
  ruleRef: GO 15-02-2023
receipts:
  manualChallanAbolished: '2020-12-31'
classification:
  schemes:
  - id: HOA_UK
    separator: '-'
    segments:
    - id: major
      width: 4
      scheme: HOA
      owner: jurisdiction
    - id: subMajor
      width: 2
      scheme: HOA
      owner: jurisdiction
    - id: minor
      width: 3
      scheme: HOA
      owner: jurisdiction
    - id: subHead
      width: 2
    - id: detailed
      width: 2
    - id: object
      width: 2
    derive:
    - segment: major
      prefix: '0'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '1'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '2'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      prefix: '3'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      equals: '4000'
      set:
        section: CAPITAL
        nature: RECEIPT
    - segment: major
      prefix: '4'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '5'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '6'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      prefix: '7'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      equals: '8000'
      set:
        section: CONTINGENCY_FUND
        nature: BOTH
    - segment: major
      prefix: '8'
      set:
        section: PUBLIC_ACCOUNT
        nature: BOTH
    - segment: major
      matches: 255[2]|455[2]|655[2]
      set:
        nerLumpSum: true
    - segment: minor
      matches: 9\d\d
      set:
        deductEntry: true
    - segment: minor
      equals: '791'
      set:
        exchangeDifference: true
    example: 2052-00-090-19-00 / 42
    evidence: V
    source: UK budget 2025
  defaultScheme: HOA_UK
  note: segments below the minor head are set by each government (LMMH GD 1.1, IFS-001)
procurement:
  family: RULES
  rule: UK Procurement Rules 2017 (amended 2021)
  worksCode: UK PWD GOs
delegation:
  tables:
  - key: ifms-financial-powers
    file: in/dmn/UK/ifms-financial-powers.dmn
    deployAs: TENANT_OVERRIDE
    tenant: UK
    inputs:
    - seatRole
    - caseType
    outputs:
    - allowed
    - maxAmount
    - ruleRef
    status: U
  - key: ifms-procurement-mode
    file: in/dmn/UK/ifms-procurement-mode.dmn
    deployAs: TENANT_OVERRIDE
    tenant: UK
    inputs:
    - amount
    - scientificDepartment
    outputs:
    - procurementMode
    - ruleRef
    status: U
  rows:
    financialPowers:
    - role: DDO
      maxAmount: null
      ruleRef: '[U] central default, replace from UK Procurement Rules 2017 (amended 2021) (was: RPR 2022: DDO draws within
        a sanction; no sanction power of its own)'
    - role: HOO
      maxAmount: null
      ruleRef: '[U] central default, replace from UK Procurement Rules 2017 (amended 2021) (was: DFPR 2024 r.12(4) and department
        re-delegation order [U value])'
    - role: HOD
      maxAmount: null
      ruleRef: '[U] central default, replace from UK Procurement Rules 2017 (amended 2021) (was: DFPR 2024 r.12(2) re-delegation
        to HoD [U value])'
    - role: SECRETARY
      maxAmount: null
      ruleRef: '[U] central default, replace from UK Procurement Rules 2017 (amended 2021) (was: DFPR 2024 r.11 (open / limited
        tender up to 100 cr))'
    - role: MINISTER
      maxAmount: null
      ruleRef: '[U] central default, replace from UK Procurement Rules 2017 (amended 2021) (was: DFPR 2024 r.11: above the
        Secretary; no upper limit in this table)'
    - role: FA
      maxAmount: null
      ruleRef: '[U] central default, replace from UK Procurement Rules 2017 (amended 2021) (was: advice / concurrence only)'
    procurementThresholds:
      direct: null
      gemL1: null
      limitedTender: null
      limitedTenderScientific: null
