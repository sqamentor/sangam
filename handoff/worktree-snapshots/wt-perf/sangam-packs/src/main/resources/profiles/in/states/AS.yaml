# SPDX-License-Identifier: Apache-2.0
# Sangam configuration profile (data, not code; ADR-D-20). Values marked under "placeholders" are [U]:
# unverified in the research pass and must be confirmed from the government's own orders before go-live.
profile:
  id: AS
  layer: government
  version: 2026.11.0
  effectiveFrom: '2026-04-01'
  extends:
  - IN
  - IN-PRESET-NE-HIMALAYAN
  name:
    en: Assam
    hi: असम
  source: IFMS-STATES-REQUIREMENTS.md section 1 and 4 (sources AS1-AS3, accessed 2026-11-04)
placeholders:
- path: classification.schemes
  reason: partially verified code structure (delta P)
- path: locale.documentLanguages
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (budget-document
    language)'
- path: delegation.tables
  reason: '[U] financial-powers and procurement-mode tables are central defaults until the State order is loaded'
- path: delegation.rows
  reason: '[U] values to load from the State delegation / procurement rules'
evidence:
  fieldsVerifiedOf8: 6
  sources: AS1-AS3
locale:
  languages:
  - tag: as
    script: Beng
    scope: statewide
    docClass:
    - statutory
    default: true
  - tag: bn
    script: Beng
    scope: districts
    docClass:
    - statutory
    districts:
    - Barak Valley
  - tag: brx
    script: Deva
    scope: statewide
    docClass:
    - statutory
    note: '[U] 2020'
  - tag: en
    script: Latn
    scope: statewide
    docClass:
    - accounts
    - audit
    note: accounts and audit outputs are usually English (IFMS-STATES 9.1)
  documentLanguages:
    treasuryForms: STATUTORY_PLUS_ENGLISH
    accounts:
    - en
    status: P
integrations:
  systems:
  - FinAssam (18+ modules)
  - e-GRAS
  - CTMIS (legacy)
  snaSparsh:
    hosting: GENERIC
  ekuber: true
orgTopology:
  directorate: Directorate of Accounts & Treasuries
  unitTypes:
    DISTRICT_TREASURY: 29
    SUB_TREASURY: 34
  ddoCount: 13090
  units: 'seed: load the unit register (code, type, banking, renditionParent, agencyBank, owningGovernment, servedGovernments,
    physicalState, effectiveFrom)'
rulebooks:
  citationsOnValidation: true
  own:
  - id: ATR_2017
    title: Assam Treasury Rules 2017 (amended 2023)
  - id: AFR
    title: Assam Financial Rules
  - id: AS_DFP_1999
    title: DFP Rules 1999 (2nd edn 2016)
paymentRails:
  default: CENTRAL_BANK_SETTLEMENT
subStateEntities:
- id: BTC
  type: SIXTH_SCHEDULE_ADC
  fundRules: BTC Fund Rules 2012
  shareDecision: btc-share
- id: KAAC
  type: SIXTH_SCHEDULE_ADC
- id: DHAC
  type: SIXTH_SCHEDULE_ADC
extraTerritorialUnits:
- SHILLONG_SOUTH
signatures:
  voucherSigners:
  - DDO
  - TREASURY
cutover:
  from: CTMIS
  to: FINASSAM
  perTreasury: true
  phase2: '2024-02-28'
ridfClaims: true
classification:
  schemes:
  - id: HOA_AS
    separator: '-'
    segments:
    - id: major
      width: 4
      scheme: HOA
      owner: jurisdiction
    - id: subMajor
      width: 2
      scheme: HOA
      owner: jurisdiction
    - id: minor
      width: 3
      scheme: HOA
      owner: jurisdiction
    - id: subHead
      width: 4
    - id: detailed
      width: 3
    - id: object
      width: 2
    - id: subDetailed
      width: 2
    derive:
    - segment: major
      prefix: '0'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '1'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '2'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      prefix: '3'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      equals: '4000'
      set:
        section: CAPITAL
        nature: RECEIPT
    - segment: major
      prefix: '4'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '5'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '6'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      prefix: '7'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      equals: '8000'
      set:
        section: CONTINGENCY_FUND
        nature: BOTH
    - segment: major
      prefix: '8'
      set:
        section: PUBLIC_ACCOUNT
        nature: BOTH
    - segment: major
      matches: 255[2]|455[2]|655[2]
      set:
        nerLumpSum: true
    - segment: minor
      matches: 9\d\d
      set:
        deductEntry: true
    - segment: minor
      equals: '791'
      set:
        exchangeDifference: true
    example: 8443-00-108-1994-000-00-00
    evidence: P
    source: AS finance (search excerpt)
  defaultScheme: HOA_AS
  note: segments below the minor head are set by each government (LMMH GD 1.1, IFS-001)
procurement:
  family: ACT
  rule: Assam Public Procurement Act 2017 + Rules 2020
  worksCode: Assam PWD Manual
delegation:
  tables:
  - key: ifms-financial-powers
    file: in/dmn/AS/ifms-financial-powers.dmn
    deployAs: TENANT_OVERRIDE
    tenant: AS
    inputs:
    - seatRole
    - caseType
    outputs:
    - allowed
    - maxAmount
    - ruleRef
    status: U
  - key: ifms-procurement-mode
    file: in/dmn/AS/ifms-procurement-mode.dmn
    deployAs: TENANT_OVERRIDE
    tenant: AS
    inputs:
    - amount
    - scientificDepartment
    outputs:
    - procurementMode
    - ruleRef
    status: U
  rows:
    financialPowers:
    - role: DDO
      maxAmount: null
      ruleRef: '[U] central default, replace from Assam Public Procurement Act 2017 + Rules 2020 (was: RPR 2022: DDO draws
        within a sanction; no sanction power of its own)'
    - role: HOO
      maxAmount: null
      ruleRef: '[U] central default, replace from Assam Public Procurement Act 2017 + Rules 2020 (was: DFPR 2024 r.12(4) and
        department re-delegation order [U value])'
    - role: HOD
      maxAmount: null
      ruleRef: '[U] central default, replace from Assam Public Procurement Act 2017 + Rules 2020 (was: DFPR 2024 r.12(2) re-delegation
        to HoD [U value])'
    - role: SECRETARY
      maxAmount: null
      ruleRef: '[U] central default, replace from Assam Public Procurement Act 2017 + Rules 2020 (was: DFPR 2024 r.11 (open
        / limited tender up to 100 cr))'
    - role: MINISTER
      maxAmount: null
      ruleRef: '[U] central default, replace from Assam Public Procurement Act 2017 + Rules 2020 (was: DFPR 2024 r.11: above
        the Secretary; no upper limit in this table)'
    - role: FA
      maxAmount: null
      ruleRef: '[U] central default, replace from Assam Public Procurement Act 2017 + Rules 2020 (was: advice / concurrence
        only)'
    procurementThresholds:
      direct: null
      gemL1: null
      limitedTender: null
      limitedTenderScientific: null
