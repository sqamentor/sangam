# SPDX-License-Identifier: Apache-2.0
# Sangam configuration profile (data, not code; ADR-D-20). Values marked under "placeholders" are [U]:
# unverified in the research pass and must be confirmed from the government's own orders before go-live.
profile:
  id: SK
  layer: government
  version: 2026.11.0
  effectiveFrom: '2026-04-01'
  extends:
  - IN
  - IN-PRESET-NE-HIMALAYAN
  name:
    en: Sikkim
    hi: सिक्किम
  source: IFMS-STATES-REQUIREMENTS.md section 1 and 4 (sources SK1-SK2, accessed 2026-11-04)
placeholders:
- path: locale.languages
  reason: '[U] unverified in the 2026-11-04 research pass; configuration placeholder, confirm before go-live (finance-document
    language policy)'
- path: delegation.tables
  reason: '[U] financial-powers and procurement-mode tables are central defaults until the State order is loaded'
- path: delegation.rows
  reason: '[U] values to load from the State delegation / procurement rules'
evidence:
  fieldsVerifiedOf8: 6
  sources: SK1-SK2
locale:
  languages:
  - tag: en
    script: Latn
    scope: statewide
    docClass:
    - statutory
    default: true
  - tag: ne
    script: Deva
    scope: statewide
    docClass:
    - statutory
  - tag: sip
    script: Tibt
    scope: statewide
    docClass:
    - statutory
    note: Bhutia
  - tag: lep
    script: Lepc
    scope: statewide
    docClass:
    - statutory
    note: Lepcha
  documentLanguages:
    treasuryForms: STATUTORY_PLUS_ENGLISH
    accounts:
    - en
    status: V
integrations:
  systems:
  - SIFMS
  snaSparsh:
    hosting: CYBER_TREASURY
orgTopology:
  directorate: Directorate of Treasuries
  unitTypes:
    PAO: 1
    CPAO_NON_BANKING: 6
    CYBER_TREASURY_SNA: 1
    LEGISLATURE_PAO: 1
  ddoCount: null
  units: 'seed: load the unit register (code, type, banking, renditionParent, agencyBank, owningGovernment, servedGovernments,
    physicalState, effectiveFrom)'
rulebooks:
  citationsOnValidation: true
  own:
  - id: SFR_1979
    title: Sikkim Financial Rules 1979
  - id: SK_HANDBOOK
    title: Handbook of Payment & Accounting
  continuity: Art. 371F(k)
paymentRails:
  default: STATE_OWNED_BANK
regime:
  rbiBanker: false
  banker: STATE_BANK_OF_SIKKIM
budgetControl:
  hardBlock: true
accounts:
  periodLock: true
chequeRegisters:
- STOCK
- CANCELLATION
- REVALIDATION
separateDirectorate: PENSION_GPF_GIS
acDc:
  backlogAlerts: true
classification:
  schemes:
  - id: HOA_SK
    separator: '-'
    segments:
    - id: major
      width: 4
      scheme: HOA
      owner: jurisdiction
    - id: subMajor
      width: 2
      scheme: HOA
      owner: jurisdiction
    - id: minor
      width: 3
      scheme: HOA
      owner: jurisdiction
    - id: subHead
      width: 2
    - id: detailed
      width: 2
    - id: object
      width: 2
    derive:
    - segment: major
      prefix: '0'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '1'
      set:
        section: REVENUE
        nature: RECEIPT
    - segment: major
      prefix: '2'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      prefix: '3'
      set:
        section: REVENUE
        nature: EXPENDITURE
    - segment: major
      equals: '4000'
      set:
        section: CAPITAL
        nature: RECEIPT
    - segment: major
      prefix: '4'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '5'
      set:
        section: CAPITAL
        nature: EXPENDITURE
    - segment: major
      prefix: '6'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      prefix: '7'
      set:
        section: LOANS
        nature: BOTH
    - segment: major
      equals: '8000'
      set:
        section: CONTINGENCY_FUND
        nature: BOTH
    - segment: major
      prefix: '8'
      set:
        section: PUBLIC_ACCOUNT
        nature: BOTH
    - segment: major
      matches: 255[2]|455[2]|655[2]
      set:
        nerLumpSum: true
    - segment: minor
      matches: 9\d\d
      set:
        deductEntry: true
    - segment: minor
      equals: '791'
      set:
        exchangeDifference: true
    example: 2401 00 001 01 44 / 01 (DH often = district)
    evidence: V
    source: CAG SK Appropriation Accounts 2023-24
  defaultScheme: HOA_SK
  note: segments below the minor head are set by each government (LMMH GD 1.1, IFS-001)
procurement:
  family: RULES
  rule: SFR 1979; DFP Rules 1977 (2020)
  worksCode: Sikkim Public Works Code
delegation:
  tables:
  - key: ifms-financial-powers
    file: in/dmn/SK/ifms-financial-powers.dmn
    deployAs: TENANT_OVERRIDE
    tenant: SK
    inputs:
    - seatRole
    - caseType
    outputs:
    - allowed
    - maxAmount
    - ruleRef
    status: U
  - key: ifms-procurement-mode
    file: in/dmn/SK/ifms-procurement-mode.dmn
    deployAs: TENANT_OVERRIDE
    tenant: SK
    inputs:
    - amount
    - scientificDepartment
    outputs:
    - procurementMode
    - ruleRef
    status: U
  rows:
    financialPowers:
    - role: DDO
      maxAmount: null
      ruleRef: '[U] central default, replace from SFR 1979; DFP Rules 1977 (2020) (was: RPR 2022: DDO draws within a sanction;
        no sanction power of its own)'
    - role: HOO
      maxAmount: null
      ruleRef: '[U] central default, replace from SFR 1979; DFP Rules 1977 (2020) (was: DFPR 2024 r.12(4) and department re-delegation
        order [U value])'
    - role: HOD
      maxAmount: null
      ruleRef: '[U] central default, replace from SFR 1979; DFP Rules 1977 (2020) (was: DFPR 2024 r.12(2) re-delegation to
        HoD [U value])'
    - role: SECRETARY
      maxAmount: null
      ruleRef: '[U] central default, replace from SFR 1979; DFP Rules 1977 (2020) (was: DFPR 2024 r.11 (open / limited tender
        up to 100 cr))'
    - role: MINISTER
      maxAmount: null
      ruleRef: '[U] central default, replace from SFR 1979; DFP Rules 1977 (2020) (was: DFPR 2024 r.11: above the Secretary;
        no upper limit in this table)'
    - role: FA
      maxAmount: null
      ruleRef: '[U] central default, replace from SFR 1979; DFP Rules 1977 (2020) (was: advice / concurrence only)'
    procurementThresholds:
      direct: null
      gemL1: null
      limitedTender: null
      limitedTenderScientific: null
