# SPDX-License-Identifier: Apache-2.0
# Default collector: receives OTLP and exports NOWHERE outside the host (R56: no outbound telemetry by default).
# Sensitive attributes are removed before any exporter (R13: privacy, bounded cardinality).
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  attributes/redact:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: http.response.header.set-cookie, action: delete }
      - { key: enduser.id, action: hash }
      - { key: sangam.variables, action: delete }
      - { key: db.query.parameter, pattern: ".*", action: delete }
  batch: {}

exporters:
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 1000

extensions:
  health_check: { endpoint: 0.0.0.0:13133 }

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:  { receivers: [otlp], processors: [memory_limiter, attributes/redact, batch], exporters: [debug] }
    metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }
    logs:    { receivers: [otlp], processors: [memory_limiter, attributes/redact, batch], exporters: [debug] }
