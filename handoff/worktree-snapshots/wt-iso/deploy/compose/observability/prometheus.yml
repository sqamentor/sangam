global:
  scrape_interval: 15s
  evaluation_interval: 30s
scrape_configs:
  - job_name: sangam-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["sangam-server:8081"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
