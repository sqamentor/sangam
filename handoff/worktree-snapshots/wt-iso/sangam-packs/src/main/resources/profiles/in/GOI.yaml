approvalChains:
- id: PAO_3
  steps:
  - role: BILL_DISTRIBUTOR
  - role: DEALING_HAND
  - role: AAO
  - role: PAO
    sign: true
  returnBy:
  - PAO
  mayEdit: false
  queue:
    token: true
    tokenSeries: TOKEN
    fifo: true
    distributorRole: BILL_DISTRIBUTOR
  signatures:
  - atOrAbove: 1000000
    count: 2
    secondSignatoryRole: SECOND_SIGNATORY
    ruleRef: CAM 2024 2.2.9 note (two DSCs at Rs 10 lakh and above)
  sequence:
  - DDO
  - PAO
  ruleRef: CAM 2024 2.2.8 (only the PAO returns a bill)
- id: CDDO
  steps:
  - role: CDDO
    sign: true
  returnBy:
  - CDDO
  mayEdit: false
- id: SNA_SPARSH_3
  steps:
  - role: PD_CHECKER
    sign: true
  - role: PR_AO
    sign: true
  - role: PAO
    sign: true
  returnBy:
  - PD_CHECKER
  mayEdit: false
- id: SNA_SPARSH_7
  steps:
  - role: PD_MAKER
  - role: PD_CHECKER
  - role: PR_AO
  - role: BILL_DISTRIBUTOR
  - role: PAO_DH
  - role: PAO_AAO
  - role: PAO
  returnBy:
  - PAO
  mayEdit: false
- id: PR_AO
  steps:
  - role: PR_AO
    sign: true
  returnBy:
  - PR_AO
  mayEdit: false
- id: SANCTION
  steps:
  - role: SANCTION_MAKER
  - role: SANCTION_CHECKER
    sign: true
  returnBy:
  - SANCTION_CHECKER
  mayEdit: true
  ruleRef: CAM 2024 2.3.3; RPR-100 uniform sanction
