approvalChains:
- id: PFM-CH-1
  name: Release
  steps:
  - role: BUDGET_OFFICE
  - role: TREASURY_CASH
  - role: INDEPENDENT_AUTHORITY
    external: true
    optional: true
  - role: RELEASE_SIGNATORY
    sign: true
- id: PFM-CH-2
  name: Commitment
  steps:
  - role: REQUESTER
  - role: BUDGET_HOLDER
  - role: PROCUREMENT
    optional: true
  - role: COMMITMENT_APPROVER
    sign: true
- id: PFM-CH-3
  name: Verification and payment
  steps:
  - role: RECEIVER
  - role: VERIFIER
  - role: CERTIFYING_OFFICER
    sign: true
    liability: PERSONAL
  - role: DISBURSING_OFFICER
    sign: true
  sod:
  - - COMMITMENT_APPROVER
    - VERIFIER
  - - VERIFIER
    - CERTIFYING_OFFICER
- id: PFM-CH-4
  name: Virement
  steps:
  - role: PROPOSER
  - role: FINANCE_UNIT
  - role: BUDGET_OFFICE
  legislatureReportList: true
- id: PFM-CH-5
  name: Year-end
  steps:
  - role: ACCOUNTANT
  - role: BUDGET_OFFICE
    sign: true
  ledgerAction: closePeriod
- id: PFM-CH-6
  name: Donor replenishment
  steps:
  - role: PROJECT_UNIT
  - role: TREASURY
  - role: DONOR
    external: true
    optional: true
  - role: PROJECT_SIGNATORY
    sign: true
- id: PFM-CH-7
  name: Breach
  steps:
  - role: BUDGET_OFFICE
  - role: INVESTIGATOR
  - role: REPORTING_AUTHORITY
    external: true
  trigger: LEDGER_BREACH
accountingBasis:
- basis: CASH
  effectiveFrom: '2000-01-01'
pefa:
  framework: PEFA 2016
  evidencePack: not built (PFM-080)
