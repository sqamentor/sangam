# Sangam configuration profile (data, ADR-D-20 / ADR-D-23). Source: spike/results/INTERNATIONAL-PFM-REQUIREMENTS.md.
# Values under "placeholders" are [U]: unverified, configuration placeholders to confirm from official sources.
# Written outside profilegen (frozen while LMMH-EXTRACTION runs); indexed by intl.idx.
profile:
  id: INTL-PFM
  layer: international
  version: 2026.11.0
  effectiveFrom: '2000-01-01'
  extends:
  - INTL
  name:
    en: International PFM generic reference
  source: INTERNATIONAL-PFM 2.1-2.5, 4.3, 4.4
placeholders:
- path: classification.schemes.GFS
  reason: GFSM 2014 loaded to two levels only [U]
classification:
  schemes:
  - id: GFS
    separator: ''
    segments:
    - id: economic
      width: 2
      master: true
      pattern: '[1-3][0-9]?'
  attributes:
    counterpartySector:
    - DOMESTIC_GG
    - DOMESTIC_PUBLIC_CORP
    - DOMESTIC_PRIVATE
    - EXTERNAL
    institutionalSector:
    - BUDGETARY_CENTRAL
    - EXTRABUDGETARY_UNIT
    - SOCIAL_SECURITY_FUND
    - STATE_REGIONAL
    - LOCAL
    - PUBLIC_CORPORATION
  tags:
  - id: CLIMATE
    splitAllowed: true
  - id: GENDER
    splitAllowed: true
  - id: SDG
    splitAllowed: true
  - id: POVERTY
  - id: DISASTER_RISK
seeds:
- scheme: GFS
  file: intl/seeds/gfsm-2014-economic.csv
crosswalks:
- id: NATIONAL_TO_GFS
  from: NATIONAL
  to: GFS
  rows: []
  note: per country
