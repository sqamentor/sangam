# Source: sangam/templates/server-configmap.yaml
# Environment of the server pods. Names follow sangam-server/src/main/resources/application*.yaml (SANGAM_*).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sangam-server-env
  labels:
    helm.sh/chart: sangam-0.1.0
    app.kubernetes.io/name: sangam
    app.kubernetes.io/instance: sangam
    app.kubernetes.io/version: "0.1.0-SNAPSHOT"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: sangam
    app.kubernetes.io/component: server
data:
  TZ: UTC
  # SL-18: production posture (no dev tokens/bootstrap, no loopback URL defaults, keys required)
  SANGAM_SECURITY_PRODUCTION: "true"
  SANGAM_TRUSTED_PROXIES: ""
  SANGAM_CLIENT_IP_HEADERS: "X-Forwarded-For"
  SANGAM_PORT: "8080"
  SANGAM_MANAGEMENT_PORT: "8081"
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "70s"
  SANGAM_LIQUIBASE_MODE: "validate"
  # M-081: fonts the PDF/A and PDF/UA renderer embeds (image default /opt/sangam/fonts, SIL OFL 1.1)
  SANGAM_PDF_FONTS: "/opt/sangam/fonts/NotoSans-Regular.ttf,/opt/sangam/fonts/NotoSansDevanagari-Regular.ttf"
  SANGAM_DB_POOL_SIZE: "30"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "5"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "2000"
  SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "1.5e+06"
  # SL-168 / X1-05: leaf pools, each on top of SANGAM_DB_POOL_SIZE per pod (deploy/README.md section 1.6)
  SANGAM_QUOTA_POOL_SIZE: "4"
  SANGAM_SECURITY_DENIAL_AUDIT_POOL_SIZE: "2"
  SANGAM_COMPLIANCE_DENIAL_AUDIT_POOL_SIZE: "2"
  # Job executor (SANGAM_JOB_*, sangam-engine SangamEngineSettings)
  SANGAM_JOB_EXECUTOR_ENABLED: "true"
  SANGAM_JOB_CORE_POOL_SIZE: "16"
  SANGAM_JOB_MAX_POOL_SIZE: "32"
  SANGAM_JOB_MAX_JOBS_PER_ACQUISITION: "20"
  # M-055 / SANGAM.md 4.3 item 3: exclusive jobs grouped per root instance (false = per process instance)
  SANGAM_JOB_EXCLUSIVE_OVER_PROCESS_HIERARCHIES: "true"
  # M-054: job executor pool on JDK virtual threads (default false)
  SANGAM_JOB_VIRTUAL_THREADS: "false"
  # OIDC (profile "oidc"): SANGAM_OIDC_ISSUER is the iss the tokens carry; jwk-set-uri optional (internal JWKS URL)
  SANGAM_OIDC_ISSUER: "https://sso.example.gov.in/realms/sangam"
  SANGAM_SECURITY_OIDC_AUDIENCE: "sangam-server"
  SANGAM_SECURITY_OIDC_TENANT_CLAIM: "tenant"
  SANGAM_SECURITY_OIDC_ROLES_CLAIM: "roles"
  SANGAM_SECURITY_OIDC_SEATS_CLAIM: "seats"
  # Upload limits (sangam.content.max-bytes and the servlet multipart limits move together)
  SANGAM_CONTENT_MAX_BYTES: "268435456"
  SANGAM_CONTENT_MAX_FILE: "256MB"
  SANGAM_CONTENT_MAX_REQUEST: "260MB"
  # Telemetry: off by default (R56); OTLP via the Spring Boot OpenTelemetry starter
  SANGAM_OTLP_ENABLED: "false"
  # SL-168 / M-062: engine spans (sangam.tracing.engine.enabled), exported only when OTLP is enabled
  SANGAM_TRACING_ENGINE_ENABLED: "false"
  # sangam-integration
  SANGAM_INTEGRATION_SIMULATORS_ENABLED: "false"
  # sangam-compliance (DPDP Act 2023 / Rules 2025, CERT-In 2022). Log archive: R51, >= 180 days, India-resident.
  SANGAM_MODULE_COMPLIANCE: "true"
  SANGAM_COMPLIANCE_JURISDICTIONS: "IN"
  SANGAM_COMPLIANCE_ORGANISATION: ""
  SANGAM_COMPLIANCE_LOG_ARCHIVE: /var/lib/sangam/compliance-logs
  SANGAM_COMPLIANCE_LOG_ARCHIVE_COUNTRY: "IN"
  SANGAM_COMPLIANCE_SCHEDULE: "true"
  SANGAM_COMPLIANCE_SMS_CONNECTOR: "sms-dlt"
  SANGAM_COMPLIANCE_EMAIL_CONNECTOR: "smtp"
  SANGAM_COMPLIANCE_AUTHORITY_EMAIL_CONNECTOR: "smtp"
  SANGAM_COMPLIANCE_AUTHORITY_HTTP_CONNECTOR: "rest"
  SANGAM_CELL_EXPORT_DIR: /var/lib/sangam/cell-exports
  # Document content store (ContentService); on the shared state volume, never the read-only root filesystem
  SANGAM_CONTENT_ROOT: /var/lib/sangam/content
  # M-082: upload malware scanning (sangam.malware.*); none = no scanner
  SANGAM_MALWARE_SCANNER: "none"
  SANGAM_MALWARE_FAIL_CLOSED: "true"
  SANGAM_MALWARE_TIMEOUT: "30s"
  SANGAM_MALWARE_MAX_BYTES: "26214400"
