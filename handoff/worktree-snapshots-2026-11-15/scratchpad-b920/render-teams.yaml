      app.kubernetes.io/name: sangam
      app.kubernetes.io/instance: sangam
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sangam
        app.kubernetes.io/instance: sangam
        app.kubernetes.io/component: ui
    spec:
      
      serviceAccountName: sangam
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: "ghcr.io/sqamentor/sangam-ui:0.1.0-SNAPSHOT"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SANGAM_API_UPSTREAM
              value: "http://sangam-server:8080"
            - name: SANGAM_PUBLIC_API_BASE
              value: /api/v1
            - name: SANGAM_OIDC_ISSUER
              value: "https://sso.example.gov.in/realms/sangam"
            - name: SANGAM_OIDC_CLIENT_ID
              value: "sangam-ui"
            - name: SANGAM_DEFAULT_LOCALE
              value: "en"
            - name: SANGAM_LOCALES
              value: "en,hi"
            - name: SANGAM_ENV_LABEL
              value: "production"
            - name: SANGAM_CSP_CONNECT_EXTRA
              value: ""
            # M-044: trace viewer link template with {traceId} (/config.json traceUrlTemplate); empty = no links
            - name: SANGAM_TRACE_URL_TEMPLATE
              value: ""
            # Decision 213: Teams personal tab (/teams.html); false = unframeable; empty ancestors = built-in Microsoft list
            - name: SANGAM_TEAMS_ENABLED
              value: "true"
            - name: SANGAM_TEAMS_FRAME_ANCESTORS
              value: "https://teams.microsoft.com"
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: nginx-cache
          emptyDir: { sizeLimit: 128Mi }
        - name: nginx-conf
          emptyDir: { sizeLimit: 1Mi }
