# Source: sangam/templates/backup-cronjobs.yaml
# Continuous WAL archive (RPO = seconds) with a physical replication slot. The backup user needs REPLICATION.
# Watch the slot: if this pod stops for long, WAL accumulates on the primary (pg_replication_slots).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sangam-pg-receivewal
  labels:
    helm.sh/chart: sangam-0.1.0
    app.kubernetes.io/name: sangam
    app.kubernetes.io/instance: sangam
    app.kubernetes.io/version: "0.1.0-SNAPSHOT"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: sangam
    app.kubernetes.io/component: backup
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: sangam
      app.kubernetes.io/instance: sangam
      app.kubernetes.io/component: backup
      sangam.io/backup: pg-receivewal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sangam
        app.kubernetes.io/instance: sangam
        app.kubernetes.io/component: backup
        sangam.io/backup: pg-receivewal
    spec:
      
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pg-receivewal
          image: "postgres:17"
          command: ["sh", "/scripts/pg-receivewal.sh"]
          env:
            - name: DB_HOST
              value: "pg-primary.db.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "sangam"
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: sangam-db-backup, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: sangam-db-backup, key: password }
            - name: BACKUP_DIR
              value: /backup
            - name: RETENTION_DAYS
              value: "14"
            - name: ORACLE_CONNECT_AS
              value: "AS SYSBACKUP"
            - name: DEST
              value: "/var/opt/mssql/backup"
            - name: DEST_TYPE
              value: "DISK"
            - name: URL_CRED
              value: ""
            - { name: WAL_SLOT, value: "sangam_backup" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: backup, mountPath: /backup }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: scripts
          configMap: { name: sangam-backup-scripts }
        - name: backup
          persistentVolumeClaim: { claimName: sangam-backup }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
