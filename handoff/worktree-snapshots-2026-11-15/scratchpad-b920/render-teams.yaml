              mountPath: /tmp
            - name: state
              mountPath: /var/lib/sangam
            - name: config
              mountPath: /opt/sangam/config
              readOnly: true
            - name: drivers
              mountPath: /opt/sangam/drivers
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: state
          persistentVolumeClaim:
            claimName: sangam-server-state
        - name: config
          configMap:
            name: sangam-server-config
        - name: drivers
          emptyDir:
            sizeLimit: 256Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sangam
