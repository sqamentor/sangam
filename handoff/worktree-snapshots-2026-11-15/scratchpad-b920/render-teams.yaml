      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sangam
      app.kubernetes.io/instance: sangam
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sangam
        app.kubernetes.io/instance: sangam
        app.kubernetes.io/component: server
        sangam.io/db-client: "true"
      annotations:
        checksum/config: 6c6cc9496cc2a960539cfb42b8331b81def4e287a0c5ba15741d92efcfa1638c
    spec:
      
      serviceAccountName: sangam
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "ghcr.io/sqamentor/sangam-server:0.1.0-SNAPSHOT"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sangam-server-env
          env:
            - name: SANGAM_DB_URL
              value: "jdbc:postgresql://pg-primary.db.svc.cluster.local:5432/sangam?ApplicationName=sangam-server&sslmode=verify-full"
            - name: SANGAM_DB_USER
              valueFrom:
                secretKeyRef:
                  name: sangam-db
                  key: username
            - name: SANGAM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sangam-db
                  key: password
            - name: SPRING_PROFILES_ACTIVE
              value: "postgres,oidc"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -XX:+UseG1GC -Duser.timezone=UTC -Dfile.encoding=UTF-8 -Djava.io.tmpdir=/tmp"
            - name: SANGAM_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: optional:file:/opt/sangam/config/
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 72
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
