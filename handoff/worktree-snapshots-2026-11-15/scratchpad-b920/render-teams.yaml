---
# Source: sangam/templates/networkpolicy.yaml
# Server: API from the UI, the ingress controller (and networkPolicy.ingressFrom.cidrs) and labelled API clients;
# management from monitoring.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sangam-server
  labels:
    helm.sh/chart: sangam-0.1.0
    app.kubernetes.io/name: sangam
    app.kubernetes.io/instance: sangam
    app.kubernetes.io/version: "0.1.0-SNAPSHOT"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: sangam
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sangam
      app.kubernetes.io/instance: sangam
      app.kubernetes.io/component: server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sangam
              app.kubernetes.io/instance: sangam
              app.kubernetes.io/component: ui
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              sangam.io/api-client: "true"
        # SCALE: the gateway proxies tenant traffic to the cell, the control plane calls the cell admin API (IR-4)
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/instance, operator: In, values: ["sangam"] }
              - { key: app.kubernetes.io/component, operator: In, values: [gateway, control-plane] }
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 8081 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    
    - to:
        -
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: db
          podSelector:
            matchLabels:
              app: pg-primary
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - ipBlock: { cidr: 10.20.0.10/32 }
      ports:
        - { protocol: TCP, port: 443 }
---
