# Source: sangam/templates/liquibase-job.yaml
# R12: Liquibase runs as ONE Kubernetes Job with the Liquibase session lock (DATABASECHANGELOGLOCK), before any new
# server pod starts (pre-install / pre-upgrade hook). The server image runs in migrate-only mode: Sangam product
# changelogs (sangam-persistence, Liquibase 4.33.0) + Operaton schema create/upgrade, then exits.
# backoffLimit 0: a failed migration is not retried blindly; the job is kept for its logs (deploy/README.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: sangam-migrate-1
  labels:
    helm.sh/chart: sangam-0.1.0
    app.kubernetes.io/name: sangam
    app.kubernetes.io/instance: sangam
    app.kubernetes.io/version: "0.1.0-SNAPSHOT"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: sangam
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sangam
        app.kubernetes.io/instance: sangam
        app.kubernetes.io/component: migration
        sangam.io/db-client: "true"
    spec:
      restartPolicy: Never
      
      # Hook runs before the chart's ServiceAccount exists on first install: no token, default account.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "ghcr.io/sqamentor/sangam-server:0.1.0-SNAPSHOT"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          env:
            - name: SANGAM_DB_URL
              value: "jdbc:postgresql://pg-primary.db.svc.cluster.local:5432/sangam?ApplicationName=sangam-server&sslmode=verify-full"
            - name: SANGAM_DB_USER
              valueFrom:
                secretKeyRef:
                  name: sangam-db
                  key: username
            - name: SANGAM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sangam-db
                  key: password
            - name: SPRING_PROFILES_ACTIVE
              value: "postgres,oidc"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -XX:+UseG1GC -Duser.timezone=UTC -Dfile.encoding=UTF-8 -Djava.io.tmpdir=/tmp"
            - name: SANGAM_LIQUIBASE_MODE
              value: migrate-only
            - name: SANGAM_JOB_EXECUTOR_ENABLED
              value: "false"
            - name: SANGAM_COMPLIANCE_SCHEDULE
              value: "false"
            - name: TZ
              value: UTC
          resources:
            limits:
              memory: 1536Mi
            requests:
              cpu: 250m
              memory: 768Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /var/lib/sangam
            - name: drivers
              mountPath: /opt/sangam/drivers
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        # one-shot run: no compliance scheduler, so a scratch directory is enough here
        - name: state
          emptyDir:
            sizeLimit: 64Mi
        - name: drivers
          emptyDir:
            sizeLimit: 256Mi