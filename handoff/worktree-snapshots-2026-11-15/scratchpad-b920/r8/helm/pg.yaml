---
# Source: sangam/templates/backup-scripts.yaml
# Backup scripts (EXAMPLES, ADR-D-12: RPO <= 5 min, RTO <= 1 h). Env: DB_HOST, DB_PORT, DB_NAME, DB_USER,
# DB_PASSWORD, BACKUP_DIR, RETENTION_DAYS. Every run writes a manifest with sha256 sums next to the backup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: t-sangam-backup-scripts
  labels:
    helm.sh/chart: sangam-0.1.0
    app.kubernetes.io/name: sangam
    app.kubernetes.io/instance: t
    app.kubernetes.io/version: "0.1.0-SNAPSHOT"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: sangam
    app.kubernetes.io/component: backup
data:
  common.sh: |
    set -eu
    ts() { date -u +%Y%m%dT%H%M%SZ; }
    log() { echo "$(date -u +%FT%TZ) $*"; }
    checksum_dir() { (cd "$1" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS); }
    # Retention: a failed removal is a failed job (otherwise the volume fills silently until backups stop).
    prune() {
      if ! find "$1" -mindepth 1 -maxdepth 1 -type d -mtime +"${RETENTION_DAYS}" -print -exec rm -rf {} +; then
        log "retention prune of $1 failed: backups older than ${RETENTION_DAYS} days were not all removed"; return 1
      fi
    }
  pg-full.sh: |
    . /scripts/common.sh
    export PGPASSWORD="$DB_PASSWORD"
    dest="$BACKUP_DIR/base/$(ts)"; mkdir -p "$dest"
    log "pg_basebackup -> $dest"
    pg_basebackup -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -D "$dest" -Ft -z -X stream \
      --checkpoint=fast --label="sangam-$(ts)" --manifest-checksums=SHA256 --progress --verbose
    checksum_dir "$dest"
    prune "$BACKUP_DIR/base"
    # WAL files older than the oldest kept base backup are no longer needed. The base directory holds at least the
    # backup just written; the WAL directory exists only where pg-receivewal runs. A failed delete fails the job.
    oldest=$(ls -1 "$BACKUP_DIR/base" | head -n 1)
    if [ -n "$oldest" ] && [ -d "$BACKUP_DIR/wal" ]; then
      if ! find "$BACKUP_DIR/wal" -type f ! -newer "$BACKUP_DIR/base/$oldest" -name '0000*' -delete; then
        log "WAL cleanup older than base backup $oldest failed"; exit 1
      fi
    fi
    log "done"
  pg-logical.sh: |
    . /scripts/common.sh
    export PGPASSWORD="$DB_PASSWORD"
    dest="$BACKUP_DIR/logical/$(ts)"; mkdir -p "$dest"
    pg_dump -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Fc -Z 6 -f "$dest/sangam.dump"
    pg_restore --list "$dest/sangam.dump" > "$dest/sangam.toc"
    checksum_dir "$dest"; prune "$BACKUP_DIR/logical"; log "done"
  pg-receivewal.sh: |
    . /scripts/common.sh
    export PGPASSWORD="$DB_PASSWORD"
    mkdir -p "$BACKUP_DIR/wal"
    # --if-not-exists already accepts an existing slot, so any failure here is real (connection, rights, slot limit).
    if ! pg_receivewal -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -D "$BACKUP_DIR/wal" \
      --slot="$WAL_SLOT" --create-slot --if-not-exists; then
      log "could not create or confirm replication slot $WAL_SLOT; WAL is not being archived"; exit 1
    fi
    exec pg_receivewal -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -D "$BACKUP_DIR/wal" \
      --slot="$WAL_SLOT" --synchronous --compress=gzip --verbose
