    exposed outside that network. The client fails closed: no URL, a timeout, a refused connection, any status other than 200 or a malformed or
    inconsistent report make PDF output answer 422 FORMAT_NOT_AVAILABLE in the server, never an unvalidated PDF. Every error answer is `application/json`
